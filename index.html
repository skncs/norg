<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0a0708" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Norg" />
<title>Norg · 健身与饮食记录</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="css/app.css?v=12" />
</head>
<body>

<div id="app">

  <!-- 顶栏 -->
  <header class="topbar" id="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff5a4e"/><stop offset="1" stop-color="#c1121f"/>
          </linearGradient>
        </defs>
        <path d="M6 26V6l14 14V6" fill="none" stroke="url(#bm)" stroke-width="5.5"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 20v6" fill="none" stroke="url(#bm)" stroke-width="5.5" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Norg</span>
    </div>
    <div class="top-actions">
      <button class="pill pill-pro" id="btnPro">PRO</button>
      <button class="pill pill-streak" id="btnStreak">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 2c1 4-2 5-2 8a2 2 0 004 0c0-1 0-2 .5-2.5C16 9 18 12 18 15a6 6 0 11-12 0c0-4 3-7 6-13z" fill="currentColor"/></svg>
        <span id="streakNum">0</span>
      </button>
    </div>
  </header>

  <!-- 主视图 -->
  <main id="view" class="view"></main>

  <!-- 底部导航 -->
  <nav class="tabbar" id="tabbar">
    <button class="tab is-active" data-tab="today">
      <svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 011 1v13a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1zm0 5h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="14.5" r="1.6" fill="currentColor"/></svg>
      <span>今日</span>
    </button>
    <button class="tab" data-tab="diet">
      <svg viewBox="0 0 24 24"><path d="M6 3v7a3 3 0 006 0V3M9 3v18M17 3c-1.5 2-2 4-2 6 0 2 1 3 2 3v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>饮食</span>
    </button>
    <button class="tab" data-tab="plan">
      <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6l7-3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>计划</span>
    </button>
    <button class="tab" data-tab="train">
      <svg viewBox="0 0 24 24"><path d="M3 9v6M21 9v6M6.5 6.5v11M17.5 6.5v11M6.5 12h11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>训练</span>
    </button>
    <button class="tab" data-tab="body">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 21c0-4 3-6.5 7-6.5s7 2.5 7 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>数据</span>
    </button>
  </nav>

</div>

<!-- 底部弹层 -->
<div class="sheet-mask" id="sheetMask" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <h3 id="sheetTitle">标题</h3>
    <button class="icon-btn" id="sheetClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/data.js?v=12"></script>
<script src="js/store.js?v=12"></script>
<script src="js/planner.js?v=12"></script>
<script src="js/charts.js?v=12"></script>
<script src="js/body3d.js?v=12"></script>
<script src="js/ui.js?v=12"></script>
<script src="js/views.js?v=12"></script>
<script src="js/views-plan.js?v=12"></script>
<script src="js/app.js?v=12"></script>
</body>
</html>
