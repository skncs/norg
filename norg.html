<style>
/* ============================================================
   Norg · 设计系统
   深色 + 猩红主色，卡片圆角 20-24px，光晕质感
   ============================================================ */

:root{
  --bg:#080607;
  --bg-1:#0e0a0c;
  --card:#141011;
  --card-2:#1a1416;
  --card-3:#221a1d;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.12);

  --red:#ff3b30;
  --red-2:#e01b24;
  --red-3:#8e0f16;
  --red-soft:rgba(255,59,48,.14);

  --green:#3ddc84;
  --purple:#a78bfa;
  --yellow:#e8ff4f;
  --cyan:#4fd1e0;
  --orange:#ff9f43;

  --t1:#ffffff;
  --t2:rgba(255,255,255,.72);
  --t3:rgba(255,255,255,.44);
  --t4:rgba(255,255,255,.26);

  --r-s:12px;
  --r-m:18px;
  --r-l:24px;
  --r-xl:30px;

  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC",
          "Helvetica Neue", "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--t1);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}
/* hidden 必须压过组件自身的 display */
[hidden]{display:none !important;}

/* 内联图标统一尺寸，防止无宽高的 svg 撑满容器 */
.mini .h svg{width:14px;height:14px;flex:0 0 auto;color:var(--t4);}
.row > svg{width:16px;height:16px;flex:0 0 auto;color:var(--t4);}
.kv svg{width:16px;height:16px;color:var(--t4);}
.tag svg{width:13px;height:13px;}
.icon-btn svg{width:17px;height:17px;}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
input,select,textarea{font-family:inherit;color:inherit;}
::-webkit-scrollbar{width:0;height:0;}

/* ---------- 外壳 ---------- */
#app{
  max-width:520px;margin:0 auto;min-height:100%;
  display:flex;flex-direction:column;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(224,27,36,.22), transparent 62%),
    var(--bg);
  position:relative;
}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(var(--safe-t) + 14px) 18px 12px;
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  background:linear-gradient(180deg, rgba(8,6,7,.92), rgba(8,6,7,.62));
}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto;}
.brand-mark{width:26px;height:26px;filter:drop-shadow(0 0 10px rgba(255,59,48,.55));}
.brand-name{font-size:22px;font-weight:800;letter-spacing:-.5px;}
.top-actions{display:flex;align-items:center;gap:8px;}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  height:29px;padding:0 13px;border-radius:999px;
  font-size:12.5px;font-weight:700;letter-spacing:.2px;
  background:rgba(255,255,255,.09);
  border:1px solid var(--line-2);
}
.pill-pro{
  background:linear-gradient(135deg,#fff,#e6e6e6);
  color:#111;border-color:transparent;
  box-shadow:0 2px 10px rgba(255,255,255,.18);
}
.pill-streak{color:var(--t2);}
.pill-streak svg{color:var(--red);}

/* ---------- 视图 ---------- */
.view{
  flex:1;
  padding:4px 14px calc(104px + var(--safe-b));
  animation:viewIn .28s cubic-bezier(.2,.8,.25,1);
}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--safe-b) + 10px);
  width:min(492px, calc(100% - 28px));
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px 4px;
  border-radius:22px;
  background:rgba(22,16,18,.82);
  border:1px solid var(--line-2);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:0 12px 40px rgba(0,0,0,.6);
  z-index:50;
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 0 5px;border-radius:16px;
  color:var(--t4);transition:color .18s, background .18s;
  min-width:0;
}
.tab svg{width:21px;height:21px;flex:0 0 auto;}
.tab span{font-size:9.5px;font-weight:600;letter-spacing:.1px;white-space:nowrap;}
.tab.is-active{
  color:var(--red);
  background:radial-gradient(60% 100% at 50% 120%, rgba(255,59,48,.22), transparent 70%);
}

/* ---------- 通用卡片 ---------- */
.card{
  background:linear-gradient(168deg, var(--card-2), var(--card));
  border:1px solid var(--line);
  border-radius:var(--r-l);
  padding:16px;
  position:relative;
  overflow:hidden;
}
.card.glow::after{
  content:"";position:absolute;inset:auto -30% -60% -30%;height:70%;
  background:radial-gradient(50% 100% at 50% 100%, rgba(255,59,48,.30), transparent 70%);
  pointer-events:none;
}
.sec-title{
  display:flex;align-items:center;gap:8px;
  margin:22px 4px 12px;font-size:17px;font-weight:800;letter-spacing:-.2px;
}
.sec-title .dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 9px var(--red);}
.sec-title .more{margin-left:auto;font-size:13px;font-weight:600;color:var(--t3);}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px;}
.grid2 > *{min-width:0;overflow:hidden;}
.muted{color:var(--t3);}
.small{font-size:12px;}
.tiny{font-size:11px;}
.center{text-align:center;}

/* ---------- 今日：模式切换 ---------- */
.mode-seg{
  display:inline-flex;gap:4px;padding:4px;border-radius:999px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  flex:0 0 auto;
}
.mode-seg button{
  padding:6px 15px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--t3);
  transition:.2s;white-space:nowrap;
}
.mode-seg button.on{
  background:linear-gradient(135deg,#ff5a4e,#d3141d);
  color:#fff;box-shadow:0 4px 16px rgba(224,27,36,.45);
}

/* ---------- 今日：主数据卡 ---------- */
.hero{
  margin-top:14px;
  border-radius:var(--r-xl);
  padding:18px 18px 20px;
  background:
    radial-gradient(120% 90% at 50% 108%, rgba(255,59,48,.34), transparent 62%),
    linear-gradient(170deg, #241a1c, #120d0e 70%);
  border:1px solid rgba(255,90,78,.22);
  box-shadow:0 18px 48px -18px rgba(224,27,36,.55), inset 0 1px 0 rgba(255,255,255,.06);
  position:relative;overflow:hidden;
}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.hero-kcal{display:flex;align-items:baseline;gap:7px;}
.hero-kcal b{font-size:46px;line-height:1;font-weight:800;letter-spacing:-2.2px;}
.hero-kcal i{font-style:normal;font-size:14px;font-weight:700;color:var(--t2);}
.hero-sub{margin-top:7px;font-size:12.5px;color:var(--t3);font-weight:600;}
.hero-btns{display:flex;gap:8px;}
.round-btn{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.08);
  border:1px solid var(--line-2);
  color:var(--t2);transition:.16s;
}
.round-btn:active{transform:scale(.93);background:rgba(255,255,255,.16);}
.round-btn svg{width:18px;height:18px;}

.bar-wrap{display:flex;align-items:center;gap:12px;margin-top:16px;}
.bar{
  flex:1;height:30px;border-radius:999px;
  background:rgba(255,255,255,.08);
  overflow:hidden;position:relative;
  border:1px solid rgba(255,255,255,.06);
}
.bar-fill{
  height:100%;border-radius:999px;
  background:repeating-linear-gradient(115deg,#ff6a5e 0 9px,#f5352b 9px 18px);
  box-shadow:0 0 22px rgba(255,59,48,.6);
  transition:width .55s cubic-bezier(.2,.8,.25,1);
}
.bar-pct{font-size:17px;font-weight:800;min-width:46px;text-align:right;}

.macros{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;gap:6px;}
.macro{text-align:left;}
.macro .k{font-size:11.5px;color:var(--t3);font-weight:600;}
.macro .v{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.4px;}
.macro .v span{font-size:11.5px;font-weight:600;color:var(--t3);margin-left:2px;}
.goal-arc{
  margin-top:14px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.07);
  text-align:center;font-size:12.5px;color:var(--t3);font-weight:600;
}
.goal-arc b{color:var(--t1);font-weight:800;font-size:14px;}

/* ---------- 快捷入口横排 ---------- */
.quick-row{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  gap:2px;margin-top:16px;
}
.quick{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 2px;border-radius:16px;color:var(--t3);
  font-size:10.5px;font-weight:600;transition:.16s;
  min-width:0;overflow:hidden;
}
.quick span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.quick:active{background:rgba(255,255,255,.05);}
.quick svg{width:26px;height:26px;color:rgba(255,255,255,.5);}
.quick.on svg{color:var(--red);filter:drop-shadow(0 0 8px rgba(255,59,48,.6));}
.quick.on{color:var(--t1);}

/* ---------- 数据小卡 ---------- */
.mini{
  background:linear-gradient(168deg,var(--card-2),var(--card));
  border:1px solid var(--line);border-radius:var(--r-m);
  padding:13px 14px;position:relative;overflow:hidden;
}
.mini .h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--t2);font-weight:600;gap:6px;}
.mini .big{font-size:26px;font-weight:800;letter-spacing:-1px;margin-top:6px;line-height:1;white-space:nowrap;overflow:hidden;}
.mini .big span{font-size:12px;font-weight:600;color:var(--t3);margin-left:3px;letter-spacing:0;}
.mini .foot{font-size:10.5px;color:var(--t4);margin-top:7px;}

/* ---------- 环形（宏量） ---------- */
.ring-cell{display:flex;align-items:center;gap:10px;min-width:0;}
.ring-cell > svg{flex:0 0 auto;}
.legend{display:flex;flex-direction:column;gap:5px;font-size:10.5px;color:var(--t2);font-weight:600;min-width:0;}
.legend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.legend i{display:inline-block;width:3px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;}

/* ---------- 列表 ---------- */
.list{display:flex;flex-direction:column;gap:8px;}
.row{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:var(--r-m);
  background:linear-gradient(168deg,var(--card-2),var(--card));
  border:1px solid var(--line);
}
.row:active{background:var(--card-3);}
.row .ico{
  width:38px;height:38px;border-radius:12px;flex:0 0 auto;
  display:grid;place-items:center;font-size:19px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
}
.row .mid{flex:1;min-width:0;}
.row .t{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .s{font-size:11.5px;color:var(--t3);margin-top:3px;font-weight:600;}
.row .r{text-align:right;flex:0 0 auto;}
.row .r .n{font-size:15px;font-weight:800;}
.row .r .u{font-size:10.5px;color:var(--t4);font-weight:600;}

/* ---------- 输入 ---------- */
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--t3);font-weight:700;margin-bottom:6px;}
.input,.select{
  width:100%;height:46px;padding:0 14px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid var(--line-2);
  font-size:15px;font-weight:600;outline:none;transition:.16s;
}
.input:focus,.select:focus{border-color:rgba(255,59,48,.6);background:rgba(255,59,48,.08);}
.input::placeholder{color:var(--t4);}
.row-in{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.btn{
  width:100%;height:50px;border-radius:16px;font-size:15.5px;font-weight:800;
  background:linear-gradient(135deg,#ff5a4e,#cf1520);
  color:#fff;box-shadow:0 10px 26px -8px rgba(224,27,36,.8);
  transition:.16s;
}
.btn:active{transform:scale(.98);}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--t1);box-shadow:none;border:1px solid var(--line-2);}
.btn.sm{height:40px;font-size:13.5px;border-radius:13px;}

/* ---------- 弹层 ---------- */
.sheet-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.62);
  backdrop-filter:blur(4px);z-index:90;
  animation:fade .2s;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:0;width:min(520px,100%);
  max-height:88vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#191315,#0d090a);
  border-radius:26px 26px 0 0;
  border-top:1px solid var(--line-2);
  z-index:100;
  padding-bottom:var(--safe-b);
  animation:up .3s cubic-bezier(.2,.9,.25,1);
  box-shadow:0 -18px 60px rgba(0,0,0,.7);
}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:9px auto 0;}
.sheet-head{display:flex;align-items:center;padding:12px 18px 8px;}
.sheet-head h3{margin:0;font-size:17px;font-weight:800;flex:1;}
.icon-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--t2);}
.sheet-body{padding:4px 18px 22px;overflow-y:auto;}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);
  transform:translateX(-50%);
  padding:11px 20px;border-radius:14px;
  background:rgba(255,255,255,.96);color:#111;
  font-size:13.5px;font-weight:700;z-index:200;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:up2 .26s;
}
@keyframes up2{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- 动作卡 / 肌群 ---------- */
.ex-hero{
  border-radius:var(--r-l);overflow:hidden;position:relative;
  background:linear-gradient(160deg,#f2f2f0,#d8d8d4);
  aspect-ratio:1.28/1;display:grid;place-items:center;
}
.ex-hero svg{width:88%;height:88%;}
.tag{
  display:inline-block;padding:5px 11px;border-radius:999px;
  font-size:11.5px;font-weight:700;
  background:rgba(255,255,255,.08);border:1px solid var(--line-2);color:var(--t2);
}
.tag.red{background:var(--red-soft);border-color:rgba(255,59,48,.35);color:#ff8b82;}

/* ---------- 训练记录条目 ---------- */
.set-line{
  display:grid;grid-template-columns:26px 1fr 1fr 1fr 30px;
  gap:6px;align-items:center;
  font-size:13px;font-weight:600;
  padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.05);
}
.set-line .idx{color:var(--t4);font-weight:800;font-size:12px;}
.set-line .v{font-weight:800;}
.set-line .u{font-size:10.5px;color:var(--t4);font-weight:600;}
.set-line .del{color:var(--t4);text-align:right;}

/* ---------- 空状态 ---------- */
.empty{
  text-align:center;padding:34px 20px;color:var(--t4);
  font-size:13px;font-weight:600;
}
.empty svg{width:44px;height:44px;opacity:.4;margin-bottom:10px;}

/* ---------- 进度条（目标） ---------- */
.prog{height:7px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff6a5e,#e01b24);transition:width .5s;}

/* ---------- 分段 tab（动作详情） ---------- */
.seg{
  display:flex;gap:16px;overflow-x:auto;padding:2px 2px 0;
  border-bottom:1px solid var(--line);
}
.seg button{
  padding:10px 0 11px;font-size:13.5px;font-weight:700;color:var(--t3);
  border-bottom:2px solid transparent;white-space:nowrap;transition:.18s;
}
.seg button.on{color:var(--t1);border-bottom-color:var(--red);}

/* ---------- 头像 / 设置 ---------- */
.avatar{
  width:60px;height:60px;border-radius:50%;
  background:linear-gradient(135deg,#ff5a4e,#8e0f16);
  display:grid;place-items:center;font-size:24px;font-weight:800;
  box-shadow:0 8px 24px -6px rgba(224,27,36,.8);
}
.kv{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.05);
  font-size:14px;font-weight:600;
}
.kv:last-child{border-bottom:0;}
.kv .k{color:var(--t2);}
.kv .v{color:var(--t1);font-weight:800;}

/* ---------- 数字滚动 ---------- */
.num{font-variant-numeric:tabular-nums;}

/* ---------- 水波纹按钮 ---------- */
.fab{
  position:fixed;right:calc(50% - 246px);
  bottom:calc(var(--safe-b) + 92px);
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#ff5a4e,#cf1520);
  display:grid;place-items:center;z-index:60;
  box-shadow:0 12px 30px -6px rgba(224,27,36,.9);
  transition:.16s;
}
.fab:active{transform:scale(.92);}
.fab svg{width:24px;height:24px;}
@media(max-width:540px){.fab{right:20px;}}

/* ---------- 图表容器 ---------- */
.chart{width:100%;display:block;overflow:visible;}
.chart text{font-family:var(--font);}

/* ---------- 训练热力 ---------- */
.muscle-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

</head>

  const todayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dayOffset = (k, n) => {
    const d = new Date(k + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return todayKey(d);
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const round = (v, n = 0) => { const p = Math.pow(10, n); return Math.round(v * p) / p; };
  const uid = () => Math.random().toString(36).slice(2, 9);

  /* ---------- 默认档案 ---------- */
  function defaultState() {
    return {
      v: 1,
      profile: {
        name: '训练者',
        sex: 'male',
        age: 25,
        height: 175,
        weight: 70,
        targetWeight: 65,
        activity: 1.375,      // 活动系数
        goalRate: -0.5,       // kg / 周
        goalType: 'cut',      // cut / maintain / bulk
        proteinPerKg: 2.0,
        fatPct: 0.25,
        theme: 'crimson',
        unit: 'kg',
        daysPerWeek: 3,       // 每周能练几天
        equipment: 'all',     // all / 杠铃 / 哑铃 / 器械 / 自重 / 绳索
        level: 'intermediate',// beginner / intermediate / advanced
      },
      days: {},        // { '2026-11-12': { meals:[], workouts:[], weight:null, water:0, sleep:null, steps:0 } }
      prs: {},         // { exerciseId: { weight, reps, e1rm, date } }
      streak: 0,
      lastLog: null,
      achievements: [],
      customFoods: [],
      planWeek: null,  // 旧字段（兼容）
      program: null,   // 当前计划 { id, startDate, weekIndex }
    };
  }

  /* ---------- 读写 ---------- */
  let S = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) { S = defaultState(); seed(); return S; }
      S = JSON.parse(raw);
      // 迁移/补全
      const d = defaultState();
      S.profile = Object.assign({}, d.profile, S.profile || {});
      S.days = S.days || {};
      S.prs = S.prs || {};
      S.achievements = S.achievements || [];
      S.customFoods = S.customFoods || [];
      return S;
    } catch (e) {
      S = defaultState(); seed(); return S;
    }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  /* ---------- 首次体验：注入 30 天演示数据 ---------- */
  function seed() {
    const t = todayKey();
    const foods = global.NORG_DATA.FOODS;
    const find = n => foods.find(f => f.name === n);

    /* 1) 30 天体重曲线：从 87.6 缓慢降到 85.0，带自然波动 */
    const w0 = 87.6, w1 = 85.0;
    for (let i = 29; i >= 0; i--) {
      const k = dayOffset(t, -i);
      if (!S.days[k]) S.days[k] = { meals: [], workouts: [], weight: null, water: 0, sleep: null, steps: 0 };
      const prog = (29 - i) / 29;
      const base = w0 + (w1 - w0) * prog;
      // 每 7 天一个平台期，加 ±0.25 抖动
      const wobble = Math.sin((29 - i) / 7 * Math.PI * 2) * 0.22 + Math.sin((29 - i) * 1.7) * 0.1;
      S.days[k].weight = round(base + wobble, 1);
      S.days[k].sleep = round(6.2 + Math.abs(Math.sin(i * 0.9)) * 1.8, 1);
      S.days[k].steps = 5500 + Math.round(Math.abs(Math.sin(i * 1.3)) * 5000);
      S.days[k].water = 1500 + Math.round(Math.abs(Math.cos(i * 0.8)) * 1200);
    }
    // 今天体重固定为 85.0
    S.days[t].weight = 85.0;

    /* 2) 最近 7 天的饮食记录 */
    const plan = [
      { off: -6, meals: [['燕麦片', 60], ['牛奶', 250], ['鸡蛋', 100], ['鸡胸肉', 180], ['米饭', 250], ['西兰花', 200], ['三文鱼', 130]] },
      { off: -5, meals: [['全麦面包', 70], ['鸡蛋', 100], ['鸡胸肉', 200], ['糙米饭', 250], ['菠菜', 150], ['牛肉丸', 100]] },
      { off: -4, meals: [['燕麦片', 60], ['乳清蛋白粉', 30], ['米饭', 200], ['牛里脊', 180], ['黄瓜', 150], ['苹果', 200]] },
      { off: -3, meals: [['馒头', 100], ['鸡蛋', 100], ['鸡腿肉', 200], ['红薯', 200], ['生菜', 100], ['无糖希腊酸奶', 150]] },
      { off: -2, meals: [['燕麦片', 50], ['牛奶', 250], ['猪里脊', 180], ['意大利面', 250], ['番茄', 150], ['香蕉', 120]] },
      { off: -1, meals: [['全麦面包', 60], ['鸡蛋', 100], ['鸡胸肉', 200], ['糙米饭', 220], ['西兰花', 180], ['蓝莓', 100]] },
      { off: 0,  meals: [['燕麦片', 50], ['牛奶', 250], ['鸡蛋', 50], ['鸡胸肉', 200], ['米饭', 250], ['西兰花', 200]] },
    ];

    plan.forEach(p => {
      const k = dayOffset(t, p.off);
      const meals = [];
      const slots = ['早餐', '早餐', '午餐', '午餐', '晚餐', '加餐', '加餐'];
      p.meals.forEach((m, i) => {
        const f = find(m[0]);
        if (!f) return;
        const grams = m[1];
        meals.push({
          id: uid(),
          foodId: f.id,
          name: f.name,
          grams,
          kcal: round(f.kcal * grams / 100),
          p: round(f.p * grams / 100, 1),
          c: round(f.c * grams / 100, 1),
          f: round(f.f * grams / 100, 1),
          slot: slots[i] || '加餐',
          ts: Date.now() - (6 - p.off) * 864e5,
        });
      });
      S.days[k].meals = meals;
    });

    /* 3) 训练记录：最近 3 次 */
    [[-6, 'push'], [-3, 'pull'], [-1, 'legs']].forEach(([off, kind]) => {
      const k = dayOffset(t, off);
      S.days[k].workouts = [makeWorkout(kind)];
    });
    // 今天也给一次训练，让今日训练页有内容
    S.days[t].workouts = [makeWorkout('push')];

    /* 4) 个人纪录（按动作名定位，避免 ID 漂移） */
    const EXS = global.NORG_DATA.EXERCISES;
    const byName = n => EXS.find(e => e.name === n);
    const prSet = (name, weight, reps, off) => {
      const ex = byName(name);
      if (!ex) return;
      S.prs[ex.id] = { weight, reps, e1rm: e1rm(weight, reps), date: dayOffset(t, off) };
    };
    prSet('杠铃平板卧推', 80, 5, -1);
    prSet('杠铃深蹲', 110, 6, -1);
    prSet('硬拉', 130, 5, -6);
    prSet('高位下拉', 65, 8, -3);
    prSet('腿举', 150, 8, -6);

    S.streak = 12;
    S.lastLog = t;
    save();
  }

  function makeWorkout(kind) {
    const EX = global.NORG_DATA.EXERCISES;
    const pick = names => names.map(n => EX.find(e => e.name === n)).filter(Boolean);
    const sets = (ex, base, n) => {
      if (!ex) return null;
      const arr = [];
      for (let i = 0; i < n; i++) {
        arr.push({ id: uid(), weight: round(base * (1 + i * 0.025), 1), reps: [10, 9, 8, 7][i] || 8, done: true });
      }
      return { exId: ex.id, name: ex.name, sets: arr };
    };
    let list = [];
    if (kind === 'push') {
      list = [
        sets(EX.find(e => e.name === '杠铃平板卧推'), 70, 4),
        sets(EX.find(e => e.name === '上斜哑铃卧推'), 24, 3),
        sets(EX.find(e => e.name === '哑铃侧平举'), 10, 3),
        sets(EX.find(e => e.name === '绳索下压'), 25, 3),
      ];
    } else if (kind === 'pull') {
      list = [
        sets(EX.find(e => e.name === '高位下拉'), 60, 4),
        sets(EX.find(e => e.name === '杠铃划船'), 65, 4),
        sets(EX.find(e => e.name === '面拉'), 20, 3),
        sets(EX.find(e => e.name === '哑铃交替弯举'), 14, 3),
      ];
    } else {
      list = [
        sets(EX.find(e => e.name === '杠铃深蹲'), 90, 4),
        sets(EX.find(e => e.name === '罗马尼亚硬拉'), 70, 3),
        sets(EX.find(e => e.name === '腿举'), 140, 3),
        sets(EX.find(e => e.name === '站姿提踵'), 50, 4),
      ];
    }
    return {
      id: uid(),
      name: kind === 'push' ? '推日 · 胸肩三头' : kind === 'pull' ? '拉日 · 背二头' : '腿日 · 下肢',
      ts: Date.now(),
      dur: 55 + Math.round(Math.random() * 25),
      exercises: list.filter(Boolean),
    };
  }

  /* ---------- 日数据 ---------- */
  function day(k) {
    k = k || todayKey();
    if (!S.days[k]) S.days[k] = { meals: [], workouts: [], weight: null, water: 0, sleep: null, steps: 0 };
    const d = S.days[k];
    d.meals = d.meals || [];
    d.workouts = d.workouts || [];
    if (d.water == null) d.water = 0;
    if (d.steps == null) d.steps = 0;
    return d;
  }

  /* ---------- 目标计算 ---------- */
  function calcTargets() {
    const p = S.profile;
    // Mifflin-St Jeor
    const bmr = p.sex === 'male'
      ? 10 * p.weight + 6.25 * p.height - 5 * p.age + 5
      : 10 * p.weight + 6.25 * p.height - 5 * p.age - 161;
    const tdee = bmr * p.activity;
    // 1kg 脂肪 ≈ 7700 kcal
    const dailyDelta = (p.goalRate * 7700) / 7;
    let kcal = tdee + dailyDelta;
    kcal = clamp(kcal, bmr * 1.05, tdee * 1.6);
    kcal = Math.round(kcal / 10) * 10;

    const protein = Math.round(p.weight * p.proteinPerKg);
    const fat = Math.round((kcal * p.fatPct) / 9);
    const carb = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));

    return {
      bmr: Math.round(bmr),
      tdee: Math.round(tdee),
      kcal,
      protein, fat, carb,
      delta: Math.round(dailyDelta),
    };
  }

  /* ---------- 日汇总 ---------- */
  function dayTotals(k) {
    const d = day(k);
    const t = { kcal: 0, p: 0, c: 0, f: 0 };
    d.meals.forEach(m => { t.kcal += m.kcal; t.p += m.p; t.c += m.c; t.f += m.f; });
    t.kcal = Math.round(t.kcal);
    t.p = round(t.p, 1); t.c = round(t.c, 1); t.f = round(t.f, 1);
    return t;
  }

  function workoutVolume(w) {
    if (!w || !w.exercises) return 0;
    let v = 0;
    w.exercises.forEach(ex => {
      (ex.sets || []).forEach(s => { if (s.done) v += (s.weight || 0) * (s.reps || 0); });
    });
    return Math.round(v);
  }

  function workoutSets(w) {
    if (!w || !w.exercises) return 0;
    let n = 0;
    w.exercises.forEach(ex => { n += (ex.sets || []).filter(s => s.done).length; });
    return n;
  }

  function dayVolume(k) {
    return day(k).workouts.reduce((a, w) => a + workoutVolume(w), 0);
  }

  /* ---------- e1RM (Epley) ---------- */
  function e1rm(weight, reps) {
    if (!weight || !reps) return 0;
    if (reps === 1) return weight;
    return round(weight * (1 + reps / 30), 1);
  }

  /* ---------- 记录一餐 ---------- */
  function addMeal(k, food, grams, slot) {
    const d = day(k);
    const g = Number(grams) || food.serving;
    const item = {
      id: uid(),
      foodId: food.id,
      name: food.name,
      grams: g,
      kcal: round(food.kcal * g / 100),
      p: round(food.p * g / 100, 1),
      c: round(food.c * g / 100, 1),
      f: round(food.f * g / 100, 1),
      slot: slot || slotOfNow(),
      ts: Date.now(),
    };
    d.meals.push(item);
    bumpStreak(k);
    save();
    return item;
  }

  function removeMeal(k, id) {
    const d = day(k);
    d.meals = d.meals.filter(m => m.id !== id);
    save();
  }

  function slotOfNow() {
    const h = new Date().getHours();
    if (h < 10) return '早餐';
    if (h < 15) return '午餐';
    if (h < 20) return '晚餐';
    return '加餐';
  }

  /* ---------- 记录体重 ---------- */
  function setWeight(k, kg) {
    const d = day(k);
    d.weight = Number(kg);
    S.profile.weight = Number(kg);
    save();
  }

  /* ---------- 连续打卡 ---------- */
  function bumpStreak(k) {
    if (S.lastLog === k) return;
    if (S.lastLog === dayOffset(k, -1)) S.streak += 1;
    else S.streak = 1;
    S.lastLog = k;
  }

  /* ---------- 体重趋势 ---------- */
  function weightSeries(n = 30) {
    const t = todayKey();
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const k = dayOffset(t, -i);
      const d = S.days[k];
      out.push({ k, w: d && d.weight != null ? d.weight : null });
    }
    return out;
  }

  function weightAvg(n = 7) {
    const s = weightSeries(n).filter(x => x.w != null);
    if (!s.length) return null;
    return round(s.reduce((a, x) => a + x.w, 0) / s.length, 1);
  }

  /* ---------- 热量缺口 ---------- */
  function calorieBalance(k) {
    const t = calcTargets();
    const tot = dayTotals(k);
    const vol = dayVolume(k);
    // 训练消耗估算：容量 × 0.0006 ≈ 每 1000kg 容量 6kcal（保守）
    const exerciseBurn = Math.round(vol * 0.0006);
    const intake = tot.kcal;
    const deficit = t.tdee + exerciseBurn - intake;
    return { intake, burn: t.tdee + exerciseBurn, exerciseBurn, deficit };
  }

  /* ---------- 统计聚合 ---------- */
  function weekSeries(n = 7, field) {
    const t = todayKey();
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const k = dayOffset(t, -i);
      out.push({ k, v: field === 'kcal' ? dayTotals(k).kcal : dayVolume(k) });
    }
    return out;
  }

  function totalWorkouts() {
    return Object.values(S.days).reduce((a, d) => a + (d.workouts || []).length, 0);
  }

  function muscleVolume(daysBack = 7) {
    const t = todayKey();
    const acc = {};
    const EX = global.NORG_DATA.EXERCISES;
    for (let i = 0; i < daysBack; i++) {
      const k = dayOffset(t, -i);
      const d = S.days[k];
      if (!d) continue;
      (d.workouts || []).forEach(w => {
        (w.exercises || []).forEach(ex => {
          const meta = EX.find(e => e.id === ex.exId);
          if (!meta) return;
          const vol = (ex.sets || []).filter(s => s.done).reduce((a, s) => a + s.weight * s.reps, 0);
          meta.muscles.forEach(m => { acc[m] = (acc[m] || 0) + vol; });
        });
      });
    }
    return acc;
  }

  /* ---------- 主题 ---------- */
  function applyTheme(id) {
    const th = global.NORG_DATA.THEMES.find(t => t.id === id) || global.NORG_DATA.THEMES[0];
    const r = document.documentElement.style;
    r.setProperty('--red', th.accent);
    r.setProperty('--red-2', th.accent2);
    r.setProperty('--red-soft', hexA(th.accent, .14));
    r.setProperty('--bg', th.bg);
    document.querySelector('meta[name=theme-color]').setAttribute('content', th.bg);
    S.profile.theme = th.id;
    save();
  }

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }

  /* ---------- 成就 ---------- */
  function checkAchievements() {
    const got = new Set(S.achievements);
    const add = id => { if (!got.has(id)) { S.achievements.push(id); return true; } return false; };
    let n = 0;
    if (Object.values(S.days).some(d => (d.meals || []).length)) n += add('first_meal') ? 1 : 0;
    if (S.streak >= 7) n += add('week_streak') ? 1 : 0;
    if (S.streak >= 30) n += add('month_streak') ? 1 : 0;
    if (totalWorkouts() >= 1) n += add('first_workout') ? 1 : 0;
    if (totalWorkouts() >= 10) n += add('ten_workouts') ? 1 : 0;
    if (Object.keys(S.prs).length >= 5) n += add('pr_hunter') ? 1 : 0;
    if (n) save();
    return n;
  }

  /* ---------- 导出 / 导入 ---------- */
  function exportJSON() { return JSON.stringify(S, null, 2); }

  function importJSON(txt) {
    const obj = JSON.parse(txt);
    if (!obj || typeof obj !== 'object' || !obj.profile) throw new Error('格式不正确');
    S = obj;
    save();
  }

  function reset() {
    localStorage.removeItem(KEY);
    S = defaultState();
    save();
  }

  global.NorgStore = {
    load, save, get state() { return S; },
    day, dayTotals, calcTargets, addMeal, removeMeal, setWeight,
    weightSeries, weightAvg, calorieBalance, weekSeries,
    workoutVolume, workoutSets, dayVolume, totalWorkouts, muscleVolume,
    e1rm, applyTheme, checkAchievements, exportJSON, importJSON, reset,
    bumpStreak, slotOfNow,
    todayKey, dayOffset, round, clamp, uid, seed,
  };
})(window);

        { key: 'l1', label: '下肢 A · 力量', focus: ['quads', 'hams', 'glutes'], strength: true },
        { key: 'u2', label: '上肢 B · 增肌', focus: ['chest', 'back', 'biceps', 'triceps'] },
        { key: 'l2', label: '下肢 B · 增肌', focus: ['quads', 'hams', 'calves', 'abs'] },
      ],
    },
    // 5 天：推拉腿 + 上下
    pplul5: {
      name: '推拉腿 + 上下五分化',
      days: 5,
      desc: '每周 5 练，适合有一定基础、恢复能力好的人。',
      sessions: [
        { key: 'push', label: '推日', focus: ['chest', 'shoulders', 'triceps'] },
        { key: 'pull', label: '拉日', focus: ['back', 'biceps', 'traps'] },
        { key: 'legs', label: '腿日', focus: ['quads', 'hams', 'glutes'] },
        { key: 'upper', label: '上肢日', focus: ['chest', 'back', 'shoulders'] },
        { key: 'lower', label: '下肢日', focus: ['quads', 'hams', 'calves', 'abs'] },
      ],
    },
  };

  /* ---------------- 选分化：按可用天数 + 经验 ---------------- */
  function pickSplit(daysPerWeek, level) {
    const d = Math.max(2, Math.min(6, daysPerWeek || 3));
    if (d <= 2) return 'fullbody2';
    if (d === 3) return 'ppl3';
    if (d === 4) return 'ul4';
    return 'pplul5';
  }

  /* ---------------- 选动作：按肌群 + 器械，且排除有氧 ---------------- */
  function pickExercises(muscle, equipment, count) {
    const pool = D.EXERCISES.filter(e => {
      if (e.equip === '有氧') return false;              // 有氧不参与力量编排
      if (!e.muscles.includes(muscle)) return false;
      if (equipment !== 'all' && e.equip !== equipment) return false;
      return true;
    });
    // 复合动作优先（多肌群参与），其次主肌群就是它的
    pool.sort((a, b) => {
      const aMain = a.primary === muscle ? 1 : 0;
      const bMain = b.primary === muscle ? 1 : 0;
      if (aMain !== bMain) return bMain - aMain;
      return b.muscles.length - a.muscles.length;
    });
    return pool.slice(0, count);
  }

  /* ---------------- 计算某个动作的目标重量 ---------------- */
  /* 有 PR 就按百分比；没有就用体重估算（新手默认值） */
  function targetWeight(ex, pr, profile, intensity) {
    const range = SCIENCE.intensity[intensity] || SCIENCE.intensity.hypertrophy;
    const pct = (range.pct[0] + range.pct[1]) / 2 / 100;

    if (pr && pr.e1rm > 0) {
      return Math.round(pr.e1rm * pct / 2.5) * 2.5; // 取 2.5 的倍数
    }
    // 无历史数据：按体重与动作类型粗估 1RM
    const bw = profile.weight || 70;
    const factor = estimateFactor(ex);
    return Math.round((bw * factor * pct) / 2.5) * 2.5;
  }

  /* 无数据时，按动作类型估 1RM ≈ 体重 × 系数 */
  function estimateFactor(ex) {
    const n = ex.name;
    if (/深蹲/.test(n)) return 1.2;
    if (/硬拉/.test(n)) return 1.4;
    if (/腿举/.test(n)) return 2.2;
    if (/卧推/.test(n) && /杠铃/.test(n)) return 0.95;
    if (/卧推/.test(n)) return 0.4;
    if (/推举/.test(n)) return 0.6;
    if (/划船|下拉/.test(n)) return 0.85;
    if (/弯举|侧平举|飞鸟|下压|面拉/.test(n)) return 0.18;
    if (/提踵/.test(n)) return 0.9;
    if (/臀推/.test(n)) return 1.3;
    if (/罗马尼亚/.test(n)) return 1.0;
    if (ex.equip === '自重') return 0;      // 自重动作不加重量
    return 0.3;
  }

  /* ---------------- 生成一周计划 ----------------
     关键约束（避免生成不科学的计划）：
     1. 动作全局去重 —— 同一个动作一周内不重复（除非同肌群动作不够）
     2. 按目标组数反推动作数量 —— 让每肌群周组数落在 MEV~MRV 内
     3. 排除有氧动作，不参与力量编排
     4. 同一肌群不安排连续两天 */
  function buildWeek(opts) {
    const { daysPerWeek = 3, equipment = 'all', level = 'intermediate', startDate } = opts || {};
    const S = global.NorgStore;
    const profile = S.state.profile;
    const splitKey = pickSplit(daysPerWeek, level);
    const split = SPLITS[splitKey];
    const weekdayMap = distributeDays(split.days);

    const week = {
      splitKey,
      splitName: split.name,
      splitDesc: split.desc,
      daysPerWeek: split.days,
      equipment,
      level,
      sessions: [],
      createdAt: Date.now(),
    };

    /* 每个肌群每周出现几次（用于算每次该练多少组） */
    const freqPerMuscle = {};
    split.sessions.forEach(s => {
      s.focus.forEach(m => { freqPerMuscle[m] = (freqPerMuscle[m] || 0) + 1; });
    });

    /* 全局已用动作 */
    const usedIds = new Set();

    /* 全局肌群累计组数（用于实时卡住 MRV 上限） */
    const runningVol = {};

    /* 累加某动作对各肌群的贡献（主肌群全额，协同肌群半额） */
    const addVolume = (ex, sets, sign) => {
      const meta = D.EXERCISES.find(e => e.id === ex.exId) || ex;
      const muscles = meta.muscles || [ex.muscle];
      muscles.forEach((m, idx) => {
        const w = idx === 0 ? 1 : 0.5;
        runningVol[m] = (runningVol[m] || 0) + sets * w * sign;
      });
    };

    /* 判断加入这个动作后是否会顶爆某个肌群 */
    const wouldExceed = (ex, sets) => {
      const meta = D.EXERCISES.find(e => e.id === ex.id);
      if (!meta) return false;
      return meta.muscles.some((m, idx) => {
        const lm = SCIENCE.volumeLandmark[m];
        if (!lm) return false;
        const w = idx === 0 ? 1 : 0.5;
        const after = (runningVol[m] || 0) + sets * w;
        return after > lm.mrv;
      });
    };

    split.sessions.forEach((sess, i) => {
      const dayIdx = weekdayMap[i];
      const exercises = [];

      sess.focus.forEach(muscle => {
        const lm = SCIENCE.volumeLandmark[muscle];
        if (!lm) return;
        const freq = freqPerMuscle[muscle] || 1;

        /* 每次训练的组数目标：取 MEV~MAV 中点分摊到每周次数，
           再按经验水平微调（新手取下限，进阶取上限） */
        const levelAdj = level === 'beginner' ? 0.75 : level === 'advanced' ? 1.15 : 1.0;
        const weeklyTarget = (lm.mev + lm.mav) / 2 * levelAdj;
        const perSessionSets = Math.max(2, Math.round(weeklyTarget / freq));

        /* 每个动作给 3-4 组，算出需要几个动作 */
        const setsPerEx = sess.strength ? 4 : 3;
        let exCount = Math.max(1, Math.min(3, Math.round(perSessionSets / setsPerEx)));

        const intensity = sess.strength ? 'strength' : 'hypertrophy';
        const range = SCIENCE.intensity[intensity];

        // 候选：优先没用过的
        const fresh = pickExercises(muscle, equipment, 12).filter(ex => !usedIds.has(ex.id));
        const stale = pickExercises(muscle, equipment, 12).filter(ex => usedIds.has(ex.id));
        const candidates = fresh.concat(stale);

        let placed = 0;
        for (const ex of candidates) {
          if (placed >= exCount) break;
          if (wouldExceed(ex, setsPerEx)) continue;   // 会超 MRV 就跳过

          usedIds.add(ex.id);
          const pr = S.state.prs[ex.id];
          const w = targetWeight(ex, pr, profile, intensity);
          const item = {
            exId: ex.id,
            name: ex.name,
            muscle,
            intensity,
            targetWeight: w,
            targetReps: Math.round((range.reps[0] + range.reps[1]) / 2),
            targetSets: setsPerEx,
            rest: range.rest,
            hasPR: !!pr,
          };
          exercises.push(item);
          addVolume(item, setsPerEx, 1);
          placed++;
        }

        /* 一个都没排上（动作库不够）时，退而求其次放一个不超 MRV 的 */
        if (placed === 0) {
          const fallback = pickExercises(muscle, equipment, 12)
            .find(ex => !exercises.find(e => e.exId === ex.id));
          if (fallback) {
            const pr = S.state.prs[fallback.id];
            const item = {
              exId: fallback.id,
              name: fallback.name,
              muscle,
              intensity,
              targetWeight: targetWeight(fallback, pr, profile, intensity),
              targetReps: Math.round((range.reps[0] + range.reps[1]) / 2),
              targetSets: Math.min(3, setsPerEx),
              rest: range.rest,
              hasPR: !!pr,
            };
            exercises.push(item);
            addVolume(item, item.targetSets, 1);
          }
        }
      });

      week.sessions.push({
        key: sess.key,
        label: sess.label,
        weekday: dayIdx,
        focus: sess.focus,
        strength: !!sess.strength,
        exercises,
        totalSets: exercises.reduce((a, e) => a + e.targetSets, 0),
      });
    });

    return week;
  }

  /* 把 n 个训练日均匀铺到 7 天里（避开连续两天练同一部位） */
  function distributeDays(n) {
    if (n === 2) return [1, 4];            // 周一、周四
    if (n === 3) return [1, 3, 5];         // 一、三、五
    if (n === 4) return [1, 2, 4, 5];      // 一、二、四、五
    if (n === 5) return [1, 2, 3, 5, 6];   // 一、二、三、五、六
    return [0, 1, 2, 3, 4, 5];
  }

  /* ---------------- 每周肌群组数统计（验证是否达标） ---------------- */
  function weeklyVolumeByMuscle(week) {
    const acc = {};
    week.sessions.forEach(s => {
      s.exercises.forEach(e => {
        const muscles = D.EXERCISES.find(x => x.id === e.exId)?.muscles || [e.muscle];
        // 主肌群算全额，协同肌群算一半
        muscles.forEach((m, i) => {
          const w = i === 0 ? 1 : 0.5;
          acc[m] = (acc[m] || 0) + e.targetSets * w;
        });
      });
    });
    return acc;
  }

  /* ---------------- 计划质量评估 ---------------- */
  function auditWeek(week) {
    const vol = weeklyVolumeByMuscle(week);
    const issues = [];
    const warnings = [];

    Object.entries(SCIENCE.volumeLandmark).forEach(([m, lm]) => {
      const v = Math.round(vol[m] || 0);
      const name = D.MUSCLES[m].name;
      if (v === 0 && ['chest', 'back', 'quads', 'hams'].includes(m)) {
        issues.push(`${name} 完全没有安排`);
      } else if (v > 0 && v < lm.mev) {
        warnings.push(`${name} ${v} 组，低于最低有效量 ${lm.mev} 组`);
      } else if (v > lm.mrv) {
        warnings.push(`${name} ${v} 组，超过可恢复上限 ${lm.mrv} 组`);
      }
    });

    // 检查是否连续两天练同一肌群
    const byDay = {};
    week.sessions.forEach(s => {
      byDay[s.weekday] = s.focus;
    });
    Object.keys(byDay).forEach(d => {
      const d1 = Number(d), d2 = d1 + 1;
      if (byDay[d2]) {
        const overlap = byDay[d1].filter(m => byDay[d2].includes(m));
        if (overlap.length >= 2) {
          warnings.push(`周${'日一二三四五六'[d1]}与周${'日一二三四五六'[d2]}连续练 ${overlap.map(m => D.MUSCLES[m].name).join('、')}`);
        }
      }
    });

    return { volume: vol, issues, warnings, score: Math.max(0, 100 - issues.length * 25 - warnings.length * 8) };
  }

  /* ---------------- 饮食计划：按目标生成一周菜单 ----------------
     核心问题：不同食物的「蛋白效率」差很多。
     鸡胸肉每 100 kcal 含 18.5g 蛋白，豆腐只有 8.2g。
     用低效食物凑蛋白会把热量顶爆，所以必须按效率筛选。 */
  function buildMealPlan(opts) {
    const { days = 7 } = opts || {};
    const S = global.NorgStore;
    const t = S.calcTargets();
    const foods = D.FOODS;
    const pick = name => foods.find(f => f.name === name);

    /* 蛋白效率 = 每 100 kcal 提供的蛋白克数 */
    const pEff = f => (f.kcal > 0 ? (f.p / f.kcal) * 100 : 0);
    /* 碳水效率 = 每 100 kcal 提供的碳水克数 */
    const cEff = f => (f.kcal > 0 ? (f.c / f.kcal) * 100 : 0);

    // 高效蛋白源：效率 >= 12（低于这个值的食物会把热量顶爆）
    const proteinPool = ['鸡胸肉', '龙利鱼', '虾', '鳕鱼', '牛里脊', '金枪鱼罐头', '乳清蛋白粉', '鸡蛋', '三文鱼', '鸡腿肉']
      .map(pick).filter(Boolean)
      .filter(f => pEff(f) >= 12)
      .sort((a, b) => pEff(b) - pEff(a));

    // 高效碳水：碳水效率降序（米饭 22 > 燕麦 17 > 全麦面包 18 但脂肪高）
    const carbPool = ['米饭', '馒头', '糙米饭', '意大利面', '红薯', '土豆', '燕麦片', '藜麦', '全麦面包']
      .map(pick).filter(Boolean)
      .sort((a, b) => cEff(b) - cEff(a));

    const fatPool = ['橄榄油', '杏仁', '核桃', '牛油果', '花生酱'].map(pick).filter(Boolean);
    const vegPool = ['西兰花', '菠菜', '生菜', '黄瓜', '番茄', '青椒', '香菇'].map(pick).filter(Boolean);

    if (!proteinPool.length || !carbPool.length) {
      return { days: [], target: t, error: '食物库缺少可用的蛋白或碳水来源' };
    }

    const plan = [];
    for (let i = 0; i < days; i++) {
      const pFood = proteinPool[i % proteinPool.length];
      const pFood2 = proteinPool[(i + 3) % proteinPool.length];
      const cFood = carbPool[i % carbPool.length];
      const cFood2 = carbPool[(i + 2) % carbPool.length];
      const fFood = fatPool[i % fatPool.length];
      const vFood = vegPool[i % vegPool.length];
      const vFood2 = vegPool[(i + 2) % vegPool.length];

      /* 蛋白优先配餐：
         1) 蛋白分三餐（早 25% / 午 40% / 晚 35%）
         2) 碳水分配（早 30% / 午 45% / 晚 25%）
         3) 蔬菜固定 200g
         4) 迭代微调主食，把总热量压到目标 ±2% */

      const pG = [
        Math.max(30, Math.round(t.protein * 0.25 / (pFood.p / 100) / 5) * 5),
        Math.max(30, Math.round(t.protein * 0.40 / (pFood2.p / 100) / 5) * 5),
        Math.max(30, Math.round(t.protein * 0.35 / (pFood.p / 100) / 5) * 5),
      ];
      const cG = [
        Math.max(30, Math.round(t.carb * 0.30 / (cFood.c / 100) / 5) * 5),
        Math.max(30, Math.round(t.carb * 0.45 / (cFood2.c / 100) / 5) * 5),
        Math.max(30, Math.round(t.carb * 0.25 / (cFood.c / 100) / 5) * 5),
      ];

      const meals = [
        { slot: '早餐', items: [gram(cFood, cG[0]), gram(pFood, pG[0])] },
        { slot: '午餐', items: [gram(cFood2, cG[1]), gram(pFood2, pG[1]), gram(vFood, 200)] },
        { slot: '晚餐', items: [gram(pFood, pG[2]), gram(vFood2, 200), gram(cFood, cG[2])] },
      ];

      const recount = () => {
        const tot = { kcal: 0, p: 0, c: 0, f: 0 };
        meals.forEach(m => m.items.forEach(it => {
          tot.kcal += it.kcal; tot.p += it.p; tot.c += it.c; tot.f += it.f;
        }));
        return tot;
      };
      const setGram = (item, food, g) => {
        g = Math.max(20, Math.min(500, Math.round(g)));
        item.grams = g;
        item.kcal = Math.round(food.kcal * g / 100);
        item.p = Math.round(food.p * g / 100 * 10) / 10;
        item.c = Math.round(food.c * g / 100 * 10) / 10;
        item.f = Math.round(food.f * g / 100 * 10) / 10;
      };

      /* 迭代校正：午餐主食弹性最大，贴边后换晚餐主食，最后再动早餐 */
      const carbItems = [
        { item: meals[1].items[0], food: cFood2 },
        { item: meals[2].items[2], food: cFood },
        { item: meals[0].items[0], food: cFood },
      ];
      for (let iter = 0; iter < 14; iter++) {
        const tot = recount();
        const diff = t.kcal - tot.kcal;
        if (Math.abs(diff) <= t.kcal * 0.02) break;

        // 找一个还有调整空间的碳水
        let slot = null;
        for (const c of carbItems) {
          const perG = c.food.kcal / 100;
          const want = c.item.grams + diff / perG;
          if (want >= 20 && want <= 500) { slot = c; break; }
        }
        if (!slot) {
          // 都贴边了，放宽到主项强制调
          slot = carbItems[0];
        }
        const perG = slot.food.kcal / 100;
        setGram(slot.item, slot.food, slot.item.grams + diff / perG);
      }

      // ---- 脂肪校正：总量到位后，检查脂肪是否差太多 ----
      let tot = recount();
      const fatGap = t.fat - tot.f;
      if (fatGap > 4) {
        const g = Math.round(fatGap / (fFood.f / 100) / 5) * 5;
        if (g >= 5) {
          // 加了脂肪会超热量，所以同时减主食
          const addKcal = fFood.kcal * g / 100;
          const c = carbItems[0];
          setGram(c.item, c.food, c.item.grams - addKcal / (c.food.kcal / 100));
          meals.push({ slot: '加餐', items: [gram(fFood, g)] });
        }
      }

      const total = recount();
      plan.push({
        day: i,
        meals,
        total: {
          kcal: Math.round(total.kcal),
          p: Math.round(total.p),
          c: Math.round(total.c),
          f: Math.round(total.f),
        },
        target: { kcal: t.kcal, p: t.protein, c: t.carb, f: t.fat },
      });
    }
    return { days: plan, target: t };
  }

  function gram(food, g) {
    g = Math.max(10, g);
    return {
      foodId: food.id,
      name: food.name,
      grams: g,
      kcal: Math.round(food.kcal * g / 100),
      p: Math.round(food.p * g / 100 * 10) / 10,
      c: Math.round(food.c * g / 100 * 10) / 10,
      f: Math.round(food.f * g / 100 * 10) / 10,
    };
  }

  /* ---------------- 有氧安排建议 ---------------- */
  function cardioPlan(goalType, daysPerWeek) {
    if (goalType === 'cut') {
      return {
        sessions: Math.max(2, Math.min(5, daysPerWeek - 1)),
        type: 'Zone 2 低强度有氧',
        duration: '30-45 分钟',
        hr: '最大心率 60-70%',
        note: '安排在力量训练之后或非训练日，避免影响力量表现。每周 150-250 分钟。',
      };
    }
    if (goalType === 'bulk') {
      return {
        sessions: 1,
        type: 'Zone 2 有氧',
        duration: '20-25 分钟',
        hr: '最大心率 60-65%',
        note: '仅用于维持心肺健康，不要过量，以免影响增肌所需的能量盈余。',
      };
    }
    return {
      sessions: 2,
      type: '混合有氧',
      duration: '25-30 分钟',
      hr: '最大心率 60-75%',
      note: '维持心血管健康，每周 2 次即可。',
    };
  }

  /* ---------------- 进度追踪与动态调整 ---------------- */
  /* 根据过去 2 周的实际完成率，建议加量 / 维持 / 减量 */
  function progressReview() {
    const S = global.NorgStore;
    const today = S.todayKey();
    let planned = 0, done = 0;
    const byMuscle = {};

    for (let i = 0; i < 14; i++) {
      const k = S.dayOffset(today, -i);
      const d = S.state.days[k];
      if (!d) continue;
      (d.workouts || []).forEach(w => {
        done++;
        (w.exercises || []).forEach(ex => {
          const meta = D.EXERCISES.find(e => e.id === ex.exId);
          if (!meta) return;
          const sets = (ex.sets || []).filter(s => s.done).length;
          meta.muscles.forEach((m, idx) => {
            byMuscle[m] = (byMuscle[m] || 0) + sets * (idx === 0 ? 1 : 0.5);
          });
        });
      });
    }

    const avgPerWeek = done / 2;
    const vol = S.muscleVolume(14);
    const suggestions = [];

    Object.entries(SCIENCE.volumeLandmark).forEach(([m, lm]) => {
      const v = (byMuscle[m] || 0) / 2; // 每周平均
      const name = D.MUSCLES[m].name;
      if (v === 0) return;
      if (v < lm.mev) {
        suggestions.push({ type: 'increase', muscle: m, text: `${name} 周均 ${v.toFixed(1)} 组，低于 MEV ${lm.mev}，建议每周增加 2-4 组` });
      } else if (v > lm.mrv) {
        suggestions.push({ type: 'decrease', muscle: m, text: `${name} 周均 ${v.toFixed(1)} 组，超过 MRV ${lm.mrv}，建议减量或安排减载周` });
      }
    });

    // 体重趋势 vs 目标速率
    const ws = S.weightSeries(14).filter(x => x.w != null);
    let weightAdvice = null;
    if (ws.length >= 7) {

        THREE ? resolve(THREE) : reject(new Error('three.js 未挂载'));
      };
      s.onerror = () => reject(new Error('three.js 加载失败'));
      document.head.appendChild(s);
    });
  }

  /* ============================================================
     调色板（对照原图取色）
     ============================================================ */
  const PAL = {
    skin:      0xa9b3ab,   // 灰绿肤色
    skinDark:  0x8e988f,   // 阴影侧
    muscle:    0xb4bdb5,   // 肌肉略亮
    equip:     0x9aa39b,   // 器械与人体同色系
    equipDark: 0x7d8680,
    plate:     0x8a938c,
    cloth:     0x2a2e2c,   // 短裤深灰
    bgTop:     0xf2f2f0,
    bgBot:     0xd6d6d2,
    hot:       0xff2a18,   // 高亮红
  };

  /* 皮肤材质：哑光，轻微粗糙（不透明，去掉任何透明感） */
  function matSkin(color) {
    return new THREE.MeshStandardMaterial({
      color: color === undefined ? PAL.skin : color,
      roughness: 0.60,
      metalness: 0.02,
      transparent: false,
      opacity: 1,
      flatShading: false,
    });
  }

  /* 肌肉材质：比皮肤亮一点，用于肌肉块 */
  function matMuscle() {
    return new THREE.MeshStandardMaterial({
      color: PAL.muscle,
      roughness: 0.54,
      metalness: 0.02,
      transparent: false,
      opacity: 1,
    });
  }

  /* 高亮材质：红色 + 自发光（配合 bloom 出光晕） */
  function matHot(intensity) {
    return new THREE.MeshStandardMaterial({
      color: 0xff3b28,
      emissive: new THREE.Color(0xff2010),
      emissiveIntensity: intensity === undefined ? 1.6 : intensity,
      roughness: 0.4,
      metalness: 0.0,
    });
  }

  function matEquip(dark) {
    return new THREE.MeshStandardMaterial({
      color: dark ? PAL.equipDark : PAL.equip,
      roughness: 0.5,
      metalness: 0.15,
    });
  }

  function matCloth() {
    return new THREE.MeshStandardMaterial({
      color: PAL.cloth,
      roughness: 0.85,
      metalness: 0.0,
    });
  }

  /* ============================================================
     几何
     ============================================================ */
  const G = {
    sph: (r, s = 24) => new THREE.SphereGeometry(r, s, Math.max(12, s / 2)),
    cap: (r, l, s = 20) => new THREE.CapsuleGeometry(r, l, Math.max(6, s / 3), s),
    box: (w, h, d) => new THREE.BoxGeometry(w, h, d),
    cyl: (rt, rb, h, s = 20) => new THREE.CylinderGeometry(rt, rb, h, s),

    /* 平滑锥形（用于肢体、躯干）—— 上中下三段半径 */
    taper: (rTop, rMid, rBot, len, seg = 24) => {
      const pts = [];
      const N = 14;
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        let r;
        if (t < 0.5) {
          const u = t / 0.5;
          r = rTop + (rMid - rTop) * (u * u * (3 - 2 * u)); // smoothstep
        } else {
          const u = (t - 0.5) / 0.5;
          r = rMid + (rBot - rMid) * (u * u * (3 - 2 * u));
        }
        pts.push(new THREE.Vector2(Math.max(0.002, r), -t * len));
      }
      return new THREE.LatheGeometry(pts, seg);
    },
  };

  /* ============================================================
     人体
     ============================================================ */
  function buildBody(opts) {
    const o = opts || {};
    const root = new THREE.Group();
    const muscles = {};
    const skin = matSkin();
    const muscle = matMuscle();

    const add = (geo, mat, pos, rot, muscleKey, parent) => {
      const m = new THREE.Mesh(geo, mat);
      if (pos) m.position.set(pos[0], pos[1], pos[2]);
      if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
      m.castShadow = true;
      m.receiveShadow = true;
      (parent || root).add(m);
      if (muscleKey) {
        if (!muscles[muscleKey]) muscles[muscleKey] = [];
        muscles[muscleKey].push(m);
      }
      return m;
    };

    /* 肌肉块：用极扁的椭球做"表面隆起"
       —— 关键是 z 轴压到 0.10-0.22，且位置略往内嵌，
          这样它只在中段凸出 1-2mm，视觉上是肌腹而不是石头 */
    const slab = (key, pos, scale, rot, parent) => {
      const m = add(G.sph(0.05, 24), muscle, pos, rot, key, parent);
      m.scale.set(scale[0], scale[1], Math.min(0.22, scale[2]));
      return m;
    };

    /* ---------- 头 ---------- */
    // 椭球头（无面孔，跟原图一致）
    const head = add(G.sph(0.105, 32), skin, [0, 1.632, 0.004]);
    head.scale.set(0.90, 1.15, 0.98);
    // 下颌收窄
    add(G.sph(0.074, 22), skin, [0, 1.556, 0.026]).scale.set(0.86, 0.80, 0.94);
    // 后脑
    add(G.sph(0.082, 22), skin, [0, 1.616, -0.040]).scale.set(0.94, 0.98, 0.90);

    /* ---------- 颈 ---------- */
    add(G.taper(0.052, 0.058, 0.072, 0.10, 20), skin, [0, 1.505, 0]);

    /* ---------- 躯干（连续基础体，加粗） ---------- */
    // 胸腔：上宽下窄，前后厚实
    const chest = add(G.taper(0.190, 0.192, 0.160, 0.30, 28), skin, [0, 1.445, 0]);
    chest.scale.set(1.0, 1.0, 0.80);
    chest.rotation.y = Math.PI;

    // 腰
    const waist = add(G.taper(0.152, 0.144, 0.138, 0.16, 24), skin, [0, 1.155, 0]);
    waist.scale.set(1.0, 1.0, 0.82);
    waist.rotation.y = Math.PI;

    // 髋
    const pelvis = add(G.taper(0.144, 0.150, 0.136, 0.12, 22), skin, [0, 1.030, 0]);
    pelvis.scale.set(1.0, 1.0, 0.88);
    pelvis.rotation.y = Math.PI;

    /* ---------- 胸肌（两片薄壳，中间留缝） ---------- */
    [-1, 1].forEach(s => {
      // 主胸肌
      slab('chest', [s * 0.070, 1.352, 0.082], [1.55, 1.05, 0.30], [0.04, 0, s * -0.10]);
      // 上胸（锁骨部）
      slab('chest', [s * 0.058, 1.400, 0.072], [1.05, 0.62, 0.24], [0.10, 0, s * -0.14]);
      // 下胸外缘
      slab('chest', [s * 0.086, 1.312, 0.072], [0.98, 0.45, 0.22], [-0.10, 0, s * -0.08]);
    });

    /* ---------- 腹直肌（4×2 薄片 + 分割感） ---------- */
    for (let r = 0; r < 4; r++) {
      for (let c = -1; c <= 1; c += 2) {
        const y = 1.252 - r * 0.048;
        const w = 0.72 - r * 0.04;
        slab('abs', [c * 0.024, y, 0.082 - r * 0.003], [w, 0.50 - r * 0.02, 0.20], [0, 0, 0]);
      }
    }
    // 腹斜肌
    [-1, 1].forEach(s => {
      const ob = add(G.sph(0.05, 18), muscle, [s * 0.094, 1.150, 0.032], [0, 0, s * 0.26], 'abs');
      ob.scale.set(0.50, 1.65, 0.34);
    });

    /* ---------- 背 ---------- */
    [-1, 1].forEach(s => {
      // 背阔肌
      const lat = add(G.sph(0.05, 20), muscle, [s * 0.100, 1.242, -0.048], [0.10, 0, s * 0.46], 'back');
      lat.scale.set(0.76, 2.30, 0.30);
      // 上背
      const up = add(G.sph(0.05, 18), muscle, [s * 0.072, 1.385, -0.058], [0, 0, s * 0.18], 'back');
      up.scale.set(0.92, 1.00, 0.26);
    });
    // 竖脊肌
    [-1, 1].forEach(s => {
      const er = add(G.sph(0.04, 16), muscle, [s * 0.028, 1.155, -0.070], null, 'back');
      er.scale.set(0.56, 2.85, 0.24);
    });

    /* ---------- 斜方肌 ---------- */
    [-1, 1].forEach(s => {
      const tr = add(G.sph(0.05, 18), muscle, [s * 0.064, 1.468, -0.034], [0.16, 0, s * 0.48], 'traps');
      tr.scale.set(1.16, 0.76, 0.34);
    });

    /* ---------- 三角肌（三束） ---------- */
    [-1, 1].forEach(s => {
      slab('shoulders', [s * 0.170, 1.428, 0.040], [0.95, 1.15, 0.72], [0, 0, s * 0.10]);
      slab('shoulders', [s * 0.196, 1.418, -0.004], [1.05, 1.25, 0.82], [0, 0, s * 0.26]);
      slab('shoulders', [s * 0.162, 1.420, -0.050], [0.90, 1.05, 0.68], [0, 0, s * 0.04]);
    });

    /* ---------- 手臂 ---------- */
    const arms = [];
    [-1, 1].forEach(s => {
      const shoulder = new THREE.Group();
      shoulder.position.set(s * 0.196, 1.418, 0);
      root.add(shoulder);

      const upper = new THREE.Group();
      shoulder.add(upper);

      // 上臂基础体（连续，加粗）
      add(G.taper(0.060, 0.064, 0.050, 0.235, 18), skin, [0, 0, 0], null, null, upper);

      // 肱二头
      slab('biceps', [s * 0.010, -0.105, 0.034], [0.92, 1.70, 0.24], [0, 0, 0], upper);
      // 肱肌
      slab('biceps', [s * 0.012, -0.152, 0.020], [0.80, 0.82, 0.20], [0, 0, 0], upper);
      // 肱三头
      slab('triceps', [s * 0.012, -0.108, -0.036], [0.96, 1.80, 0.24], [0, 0, 0], upper);
      slab('triceps', [s * 0.026, -0.070, -0.020], [0.66, 0.98, 0.18], [0, 0, 0], upper);

      // 前臂
      const fore = new THREE.Group();
      fore.position.set(0, -0.238, 0);
      upper.add(fore);

      add(G.taper(0.052, 0.048, 0.030, 0.210, 18), skin, [0, 0, 0], null, null, fore);
      // 前臂屈肌
      slab('forearms', [s * 0.008, -0.050, 0.022], [0.72, 1.12, 0.20], [0, 0, 0], fore);

      // 手
      const hand = add(G.sph(0.040, 16), skin, [0, -0.240, 0.004], null, null, fore);
      hand.scale.set(0.82, 1.10, 0.52);
      // 手指
      for (let f = 0; f < 4; f++) {
        add(G.cap(0.0095, 0.040, 8), skin, [(f - 1.5) * 0.018, -0.284, 0.008], [0.12, 0, 0], null, fore);
      }
      add(G.cap(0.010, 0.028, 8), skin, [s * -0.028, -0.256, 0.018], [0.28, 0, s * 0.85], null, fore);

      arms.push({ side: s, shoulder, upper, fore });
    });

    /* ---------- 腿 ---------- */
    const legs = [];
    [-1, 1].forEach(s => {
      const hipJoint = new THREE.Group();
      hipJoint.position.set(s * 0.078, 1.010, 0);
      root.add(hipJoint);

      const thigh = new THREE.Group();
      hipJoint.add(thigh);

      // 大腿基础体（加粗）
      add(G.taper(0.108, 0.104, 0.068, 0.450, 20), skin, [0, 0, 0], null, null, thigh);

      // 股四头三束
      slab('quads', [s * 0.030, -0.110, 0.056], [0.94, 2.10, 0.26], [0, 0, 0], thigh);   // 外侧
      slab('quads', [s * -0.028, -0.285, 0.048], [0.82, 1.40, 0.24], [0, 0, 0], thigh);   // 内侧泪滴
      slab('quads', [s * 0.002, -0.165, 0.070], [0.70, 1.75, 0.22], [0, 0, 0], thigh);    // 股直肌

      // 腘绳
      slab('hams', [s * 0.020, -0.148, -0.060], [0.96, 2.05, 0.24], [0, 0, 0], thigh);
      slab('hams', [s * -0.020, -0.148, -0.054], [0.86, 1.85, 0.22], [0, 0, 0], thigh);

      // 小腿
      const shin = new THREE.Group();
      shin.position.set(0, -0.495, 0);
      thigh.add(shin);

      add(G.taper(0.068, 0.060, 0.032, 0.410, 18), skin, [0, 0, 0], null, null, shin);
      // 腓肠肌两头
      slab('calves', [s * 0.024, -0.100, -0.040], [0.80, 1.48, 0.26], [0, 0, 0], shin);
      slab('calves', [s * -0.020, -0.112, -0.036], [0.74, 1.30, 0.24], [0, 0, 0], shin);
      // 比目鱼肌
      slab('calves', [s * 0.002, -0.190, -0.026], [0.76, 1.02, 0.22], [0, 0, 0], shin);

      // 脚
      add(G.box(0.058, 0.030, 0.130), skin, [0, -0.424, 0.036], null, null, shin);
      add(G.sph(0.028, 14), skin, [0, -0.422, 0.094], null, null, shin).scale.set(1.0, 0.58, 0.95);
      add(G.sph(0.026, 12), skin, [0, -0.422, -0.018], null, null, shin).scale.set(0.92, 0.72, 0.88);

      legs.push({ side: s, hipJoint, thigh, shin });
    });

    /* ---------- 臀 ---------- */
    [-1, 1].forEach(s => {
      const gl = add(G.sph(0.05, 20), muscle, [s * 0.066, 1.008, -0.066], [0, 0, s * 0.10], 'glutes');
      gl.scale.set(1.45, 1.40, 0.90);
    });

    /* ---------- 短裤（覆盖髋部 + 大腿上段） ---------- */
    const cloth = matCloth();
    // 腰臀部：比髋略大的锥形，包住臀和腹下
    const shorts = add(G.taper(0.146, 0.156, 0.150, 0.235, 26), cloth, [0, 1.070, 0]);
    shorts.scale.set(1.03, 1.0, 0.90);
    shorts.rotation.y = Math.PI;
    // 裤腿：沿大腿包住上 1/3，跟随大腿骨骼
    legs.forEach(l => {
      const cuff = add(G.taper(0.094, 0.096, 0.086, 0.175, 20), cloth,
        [0, -0.030, 0], null, null, l.thigh);
      cuff.scale.set(1.05, 1.0, 1.06);
    });

    const allMeshes = [];
    root.traverse(o => { if (o.isMesh) allMeshes.push(o); });

    return {
      root, muscles, allMeshes, arms, legs,
      parts: { chest, waist, pelvis, skin, muscle, cloth },
    };
  }

  /* ============================================================
     器械（与人体同色系）
     ============================================================ */
  function buildBench() {
    const g = new THREE.Group();
    const m = matEquip();
    const md = matEquip(true);

    // 凳面（深灰软垫）
    const pad = new THREE.Mesh(G.box(0.30, 0.05, 0.98), matCloth());
    pad.position.set(0, 0.452, 0.02);
    pad.castShadow = true; pad.receiveShadow = true;
    g.add(pad);

    // A 形支腿
    [[-0.122, 0.38], [0.122, 0.38], [-0.122, -0.34], [0.122, -0.34]].forEach(([x, z]) => {
      const leg = new THREE.Mesh(G.cyl(0.019, 0.023, 0.44, 10), m);
      leg.position.set(x, 0.22, z);
      leg.castShadow = true;
      g.add(leg);
    });
    [0.38, -0.34].forEach(z => {
      const br = new THREE.Mesh(G.cyl(0.015, 0.015, 0.25, 10), m);
      br.rotation.z = Math.PI / 2;
      br.position.set(0, 0.015, z);
      g.add(br);
    });

    // 杠铃立柱 + 挂钩
    [-0.40, 0.40].forEach(x => {
      const post = new THREE.Mesh(G.cyl(0.019, 0.019, 0.70, 10), m);
      post.position.set(x, 0.49, 0.33);
      post.castShadow = true;
      g.add(post);
      const hook = new THREE.Mesh(G.box(0.070, 0.024, 0.048), md);
      hook.position.set(x, 0.845, 0.33);
      g.add(hook);
      // 底座
      const base = new THREE.Mesh(G.cyl(0.055, 0.060, 0.02, 12), md);
      base.position.set(x, 0.01, 0.33);
      g.add(base);
    });

    return g;
  }

  function buildBarbell(width, plateR) {
    const g = new THREE.Group();
    const m = matEquip();
    const pm = new THREE.MeshStandardMaterial({
      color: PAL.plate, roughness: 0.62, metalness: 0.1,
    });
    const w = width || 1.34;
    const pr = plateR || 0.155;

    const bar = new THREE.Mesh(G.cyl(0.0145, 0.0145, w, 14), m);
    bar.rotation.z = Math.PI / 2;
    bar.castShadow = true;
    g.add(bar);

    [-1, 1].forEach(side => {
      [[pr, 0.034], [pr * 0.84, 0.028], [pr * 0.62, 0.022]].forEach(([r, h], i) => {
        const p = new THREE.Mesh(G.cyl(r, r, h, 24), pm);
        p.rotation.z = Math.PI / 2;
        p.position.x = side * (w / 2 - 0.072 - i * 0.036);
        p.castShadow = true;
        g.add(p);
      });
      const c = new THREE.Mesh(G.cyl(0.022, 0.022, 0.016, 10), m);
      c.rotation.z = Math.PI / 2;
      c.position.x = side * (w / 2 - 0.026);
      g.add(c);
    });

    return g;
  }

  function buildDumbbell(scale) {
    const g = new THREE.Group();
    const m = matEquip();
    const pm = new THREE.MeshStandardMaterial({
      color: PAL.plate, roughness: 0.62, metalness: 0.1,
    });
    const s = scale || 1;

    const handle = new THREE.Mesh(G.cyl(0.015 * s, 0.015 * s, 0.155 * s, 12), m);
    handle.rotation.z = Math.PI / 2;
    handle.castShadow = true;
    g.add(handle);

    [-1, 1].forEach(side => {
      const p1 = new THREE.Mesh(G.cyl(0.070 * s, 0.070 * s, 0.028 * s, 22), pm);
      p1.rotation.z = Math.PI / 2;
      p1.position.x = side * 0.060 * s;
      p1.castShadow = true;
      g.add(p1);

      const p2 = new THREE.Mesh(G.cyl(0.054 * s, 0.054 * s, 0.022 * s, 20), pm);
      p2.rotation.z = Math.PI / 2;
      p2.position.x = side * 0.094 * s;
      p2.castShadow = true;
      g.add(p2);

      const c = new THREE.Mesh(G.cyl(0.019 * s, 0.019 * s, 0.013 * s, 10), m);
      c.rotation.z = Math.PI / 2;
      c.position.x = side * 0.113 * s;
      g.add(c);
    });

    return g;
  }

  function buildSquatRack() {
    const g = new THREE.Group();
    const m = matEquip();
    const md = matEquip(true);

    [-0.60, 0.60].forEach(x => {
      const post = new THREE.Mesh(G.cyl(0.021, 0.023, 1.16, 10), m);
      post.position.set(x, 0.58, -0.08);
      post.castShadow = true;
      g.add(post);

      const foot = new THREE.Mesh(G.cyl(0.018, 0.018, 0.42, 8), md);
      foot.rotation.x = Math.PI / 2;
      foot.position.set(x, 0.012, -0.08);
      g.add(foot);

      const hook = new THREE.Mesh(G.box(0.046, 0.020, 0.055), md);
      hook.position.set(x * 0.90, 1.03, 0.03);
      g.add(hook);
    });

    const top = new THREE.Mesh(G.cyl(0.013, 0.013, 1.22, 8), m);
    top.rotation.z = Math.PI / 2;
    top.position.set(0, 1.16, -0.08);
    g.add(top);

    return g;
  }

  /* 柔和椭圆地面阴影（原图那种） */
  function buildShadow() {
    const g = new THREE.Group();
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    const grd = ctx.createRadialGradient(128, 128, 10, 128, 128, 124);
    grd.addColorStop(0, 'rgba(90,100,95,0.42)');
    grd.addColorStop(0.55, 'rgba(90,100,95,0.16)');
    grd.addColorStop(1, 'rgba(90,100,95,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, 256, 256);

    const tex = new THREE.CanvasTexture(c);
    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(1.5, 1.5),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
    );
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.y = 0.002;
    g.add(mesh);
    return g;
  }

  /* ============================================================
     动作动画
     ============================================================ */
  const ANIMS = {
    /* 哑铃弯举 —— 对照参考图 */
    curl: {
      props: 'dumbbell',
      pose: b => {
        b.arms.forEach(a => {
          a.shoulder.rotation.x = 0.04;
          a.shoulder.rotation.z = a.side * 0.13;
          a.upper.rotation.x = 0.06;
          a.fore.rotation.x = -0.30;
        });
        b.legs.forEach(l => {
          l.hipJoint.rotation.z = l.side * 0.02;
        });
      },
      tick: (b, t) => {
        const p = (Math.sin(t * 2.1) + 1) / 2;
        b.arms.forEach(a => {
          a.fore.rotation.x = -0.30 - p * 1.60;
          a.shoulder.rotation.x = 0.04 - p * 0.05;
        });
      },
    },

    /* 卧推
       root.rotation.x = +π/2 时：局部(x,y,z) → 世界(x, posY−z, posZ+y)
       肩局部 y=1.418 → 世界 z = posZ + 1.418，要肩落在凳面中部 z≈0.45
       → posZ = -0.97 */
    bench: {
      props: 'bench',
      pose: b => {
        b.root.rotation.x = Math.PI / 2;
        b.root.position.set(0, 0.50, -0.97);
        b.arms.forEach(a => {
          a.shoulder.rotation.z = a.side * 0.42;
          a.shoulder.rotation.x = 1.52;
        });
        b.legs.forEach(l => {
          l.hipJoint.rotation.x = -0.55;
          l.thigh.rotation.x = 0.95;
          l.shin.rotation.x = -1.75;
        });
      },
      tick: (b, t) => {
        const p = (Math.sin(t * 1.9) + 1) / 2;
        b.arms.forEach(a => {
          a.fore.rotation.x = -1.05 + p * 1.05;
        });
        if (b._bar) {
          b._bar.position.set(0, 0.80 + p * 0.26, 0.27);
          b._bar.visible = true;
        }
      },
    },

    /* 深蹲 */
    squat: {
      props: 'rack',
      pose: b => {
        b.arms.forEach(a => {
          a.shoulder.rotation.x = -1.30;
          a.shoulder.rotation.z = a.side * 0.50;
          a.upper.rotation.x = 0.16;
          a.fore.rotation.x = -0.68;
        });
      },
      tick: (b, t) => {
        const p = (Math.sin(t * 1.5) + 1) / 2;
        const d = p * 0.86;
        b.legs.forEach(l => {
          l.hipJoint.rotation.x = d * 1.02;
          l.thigh.rotation.x = -d * 2.00;
          l.shin.rotation.x = d * 1.90;
        });
        b.root.position.y = -d * 0.30;
        b.parts.chest.rotation.x = d * 0.28;
        b.parts.waist.rotation.x = d * 0.28;
        b.parts.pelvis.rotation.x = d * 0.16;
        // 杠铃压在斜方肌上（略高于肩，稍靠后）
        if (b._bar) {
          b._bar.position.set(0, 1.485 - d * 0.30, -0.075);
          b._bar.visible = true;
        }
      },
    },

    /* 硬拉 / 划船 */
    hinge: {
      props: 'barbell',
      pose: b => {
        b.arms.forEach(a => {
          a.shoulder.rotation.x = 0.26;
          a.upper.rotation.x = 0.14;
          a.fore.rotation.x = -0.26;
        });
      },
      tick: (b, t) => {
        const p = (Math.sin(t * 1.4) + 1) / 2;
        const bend = p * 1.0;
        b.legs.forEach(l => {
          l.hipJoint.rotation.x = bend * 0.58;
          l.thigh.rotation.x = -bend * 0.70;
          l.shin.rotation.x = bend * 0.50;
        });
        b.parts.chest.rotation.x = bend * 0.68;
        b.parts.waist.rotation.x = bend * 0.38;
        b.parts.pelvis.rotation.x = bend * 0.24;
        b.arms.forEach(a => { a.shoulder.rotation.x = 0.26 + bend * 0.40; });
        if (b._bar) {
          b._bar.position.set(0, 0.42 - bend * 0.12, 0.19);
          b._bar.visible = true;
        }
      },
    },

    /* 推举 */
    press: {
      props: 'dumbbell',
      pose: b => {
        b.arms.forEach(a => {
          a.shoulder.rotation.z = a.side * 0.28;
          a.shoulder.rotation.x = -0.20;
          a.fore.rotation.x = -0.10;
        });
      },
      tick: (b, t) => {
        const p = (Math.sin(t * 1.7) + 1) / 2;
        b.arms.forEach(a => {
          a.shoulder.rotation.x = -0.20 - p * 2.15;
          a.fore.rotation.x = -0.10 - p * 0.25;
        });
      },
    },

    /* 下拉 / 引体 */
    pulldown: {
      pose: b => {
        b.arms.forEach(a => {
          a.shoulder.rotation.z = a.side * 0.44;
          a.shoulder.rotation.x = -2.50;
        });
      },
      tick: (b, t) => {
        const p = (Math.sin(t * 1.6) + 1) / 2;
        b.arms.forEach(a => {
          a.shoulder.rotation.x = -2.50 + p * 1.00;
          a.fore.rotation.x = -0.26 + p * 0.44;
        });
      },
    },

    /* 侧平举 */
    lateral: {
      props: 'dumbbell',
      pose: b => {
        b.arms.forEach(a => {
          a.shoulder.rotation.z = a.side * 0.10;
          a.fore.rotation.x = -0.12;
        });
      },
      tick: (b, t) => {
        const p = (Math.sin(t * 1.8) + 1) / 2;
        b.arms.forEach(a => {
          a.shoulder.rotation.z = a.side * (0.10 + p * 1.00);
        });
      },
    },

    /* 卷腹 */
    crunch: {
      pose: b => {
        b.root.rotation.x = -Math.PI / 2;
        b.root.position.set(0, 0.44, 0);
        b.legs.forEach(l => {
          l.hipJoint.rotation.x = 0.55;
          l.thigh.rotation.x = -1.55;
          l.shin.rotation.x = 1.35;
        });
        b.arms.forEach(a => {
          a.shoulder.rotation.x = -0.55;
          a.upper.rotation.x = -0.45;
        });
      },
      tick: (b, t) => {
        const p = (Math.sin(t * 1.9) + 1) / 2;
        b.parts.chest.rotation.x = -p * 0.44;
        b.parts.waist.rotation.x = -p * 0.24;
      },
    },

    /* 站立 */
    idle: {
      pose: () => {},
      tick: (b, t) => {
        const p = Math.sin(t * 0.85);
        b.root.position.y = p * 0.005;
        b.parts.chest.rotation.z = p * 0.008;
        b.arms.forEach(a => {
          a.shoulder.rotation.z = a.side * (0.13 + Math.sin(t * 0.85 + 0.4) * 0.010);
        });
      },
    },
  };

  function pickAnim(name) {
    const n = name || '';
    if (/侧平举/.test(n)) return 'lateral';
    if (/弯举/.test(n)) return 'curl';
    if (/卧推|飞鸟|臂屈伸|俯卧撑|夹胸/.test(n)) return 'bench';
    if (/深蹲|腿举|分腿蹲|腿屈伸|提踵|臀推|外展/.test(n)) return 'squat';
    if (/硬拉|划船|罗马尼亚/.test(n)) return 'hinge';
    if (/推举|前平举|面拉/.test(n)) return 'press';
    if (/引体|下拉|下压/.test(n)) return 'pulldown';
    if (/卷腹|举腿|平板|转体|死虫/.test(n)) return 'crunch';
    return 'idle';
  }

  /* ============================================================
     机位（拉远，保证全身入镜）
     ============================================================ */
  const VIEWS = {
    front: { pos: [0, 0.95, 3.55], target: [0, 0.86, 0] },
    back:  { pos: [0, 0.95, -3.55], target: [0, 0.86, 0] },
    side:  { pos: [3.55, 0.95, 0], target: [0, 0.86, 0] },
    q34:   { pos: [2.35, 1.05, 2.70], target: [0, 0.86, 0] },
    bench: { pos: [2.55, 1.65, 1.55], target: [0, 0.58, 0.05] },
    squat: { pos: [2.20, 0.95, 2.85], target: [0, 0.74, 0] },
    hinge: { pos: [2.85, 1.05, 2.20], target: [0, 0.58, 0.05] },
  };

  const ANIM_VIEW = {
    bench: 'bench', squat: 'squat', hinge: 'hinge', crunch: 'bench',
    curl: 'q34', press: 'q34', lateral: 'front', pulldown: 'q34', idle: 'q34',
  };

  /* ============================================================
     查看器
     ============================================================ */
  function createViewer(container, opts) {
    const o = opts || {};
    const height = o.height || 300;
    const autoRotate = !!o.autoRotate;
    const showProps = o.showProps !== false;

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 60);
    camera.position.set(...VIEWS.q34.pos);
    camera.lookAt(...VIEWS.q34.target);

    const renderer = new THREE.WebGLRenderer({
      antialias: true, alpha: true, powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(global.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;

    container.innerHTML = '';
    container.appendChild(renderer.domElement);
    const dom = renderer.domElement;
    dom.style.cssText = 'width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab';

    /* ---------- 灯光（原图是柔和的影棚光） ---------- */
    const key = new THREE.DirectionalLight(0xffffff, 2.6);
    key.position.set(2.0, 3.2, 2.6);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 12;
    key.shadow.camera.left = -1.5;
    key.shadow.camera.right = 1.5;
    key.shadow.camera.top = 2.4;
    key.shadow.camera.bottom = -0.4;
    key.shadow.bias = -0.0012;
    key.shadow.radius = 4;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xeef4ff, 1.0);
    fill.position.set(-2.4, 1.6, 1.8);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xffffff, 0.9);
    rim.position.set(-0.8, 1.8, -2.4);
    scene.add(rim);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa39b, 1.15));

    /* ---------- 地面阴影 ---------- */
    scene.add(buildShadow());

    /* ---------- 人体 ---------- */
    const body = buildBody();
    scene.add(body.root);

    /* ---------- 器械 ---------- */
    const props = { bench: buildBench(), rack: buildSquatRack() };
    Object.values(props).forEach(p => { p.visible = false; scene.add(p); });

    const barbell = buildBarbell(1.34, 0.155);
    barbell.visible = false;
    scene.add(barbell);
    body._bar = barbell;

    const dumbbells = [buildDumbbell(1.0), buildDumbbell(1.0)];
    dumbbells.forEach(d => { d.visible = false; scene.add(d); });

    const setProps = k => {
      Object.entries(props).forEach(([kk, p]) => { p.visible = showProps && kk === k; });
    };
    setProps(null);

    /* ---------- 高亮 ---------- */
    body.allMeshes.forEach(m => { m.userData._origMat = m.material; });

    const matHotMain = matHot(1.7);
    const matHotSoft = matHot(0.85);

    function highlight(keys, oo) {
      const mode = (oo && oo.mode) || 'hot';
      const active = new Set(keys || []);
      body.allMeshes.forEach(m => { m.material = m.userData._origMat; });
      Object.entries(body.muscles).forEach(([k, list]) => {
        if (!active.has(k)) return;
        const mat = mode === 'soft' ? matHotSoft : matHotMain;
        list.forEach(m => { m.material = mat; });
      });
    }

    function heatmap(volume) {
      const v = volume || {};
      const maxV = Math.max(1, ...Object.values(v));
      body.allMeshes.forEach(m => { m.material = m.userData._origMat; });
      Object.entries(body.muscles).forEach(([k, list]) => {
        const val = v[k] || 0;
        if (val <= 0) return;
        const t = val / maxV;
        const mat = matHot(0.5 + t * 1.3);
        list.forEach(m => { m.material = mat; });
      });
    }

    /* ---------- 尺寸 ---------- */
    function resize() {
      const w = container.clientWidth || 300;
      const h = container.clientHeight || height;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    resize();
    let ro = null;
    if (global.ResizeObserver) {
      ro = new ResizeObserver(resize);
      ro.observe(container);
    }

    /* ---------- 循环 ---------- */
    let animKey = 'idle';
    let playing = true;
    let t0 = performance.now();
    let raf = null;
    let rotY = 0;
    let dragging = false, lastX = 0;

    function loop(now) {
      raf = requestAnimationFrame(loop);
      const t = (now - t0) / 1000;

      if (playing && ANIMS[animKey] && ANIMS[animKey].tick) {
        ANIMS[animKey].tick(body, t);
      }
      if (autoRotate && !dragging) rotY += 0.003;
      body.root.rotation.y = rotY;

      // 哑铃朝向跟随前臂
      dumbbells.forEach((d, i) => {
        if (!d.visible) return;
        const a = body.arms[i];
        const q = new THREE.Quaternion();
        a.fore.getWorldQuaternion(q);
        d.quaternion.copy(q);
        if (!d.position.lengthSq() || ANIMS[animKey].props === 'dumbbell') {
          d.position.copy(a.fore.localToWorld(new THREE.Vector3(0, -0.30, 0.01)));
        }
      });

      renderer.render(scene, camera);
    }
    raf = requestAnimationFrame(loop);

    /* ---------- 拖拽 ---------- */
    const onDown = e => {
      dragging = true;
      dom.style.cursor = 'grabbing';
      lastX = e.touches ? e.touches[0].clientX : e.clientX;
    };
    const onMove = e => {
      if (!dragging) return;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      rotY += (x - lastX) * 0.011;
      lastX = x;
      if (e.touches) e.preventDefault();
    };
    const onUp = () => { dragging = false; dom.style.cursor = 'grab'; };

    dom.addEventListener('mousedown', onDown);
    global.addEventListener('mousemove', onMove);
    global.addEventListener('mouseup', onUp);
    dom.addEventListener('touchstart', onDown, { passive: true });
    dom.addEventListener('touchmove', onMove, { passive: false });
    dom.addEventListener('touchend', onUp);

    function resetPose() {
      body.root.rotation.set(0, rotY, 0);
      body.root.position.set(0, 0, 0);
      body.parts.chest.rotation.set(0, 0, 0);
      body.parts.waist.rotation.set(0, 0, 0);
      body.parts.pelvis.rotation.set(0, 0, 0);
      body.arms.forEach(a => {
        a.shoulder.rotation.set(0, 0, 0);
        a.upper.rotation.set(0, 0, 0);
        a.fore.rotation.set(0, 0, 0);
      });
      body.legs.forEach(l => {
        l.hipJoint.rotation.set(0, 0, 0);
        l.thigh.rotation.set(0, 0, 0);
        l.shin.rotation.set(0, 0, 0);
      });
    }

    return {
      scene, camera, renderer, body,

      setAnim(key) {
        if (!ANIMS[key]) return;
        animKey = key;
        resetPose();
        setProps(ANIMS[key].props || null);

        barbell.visible = showProps && ['bench', 'squat', 'hinge'].includes(key);
        const useDb = showProps && ['curl', 'press', 'lateral'].includes(key);
        dumbbells.forEach(d => { d.visible = useDb; });

        if (ANIMS[key].pose) ANIMS[key].pose(body);

        const vk = ANIM_VIEW[key] || 'q34';
        const v = VIEWS[vk];
        camera.position.set(...v.pos);
        camera.lookAt(...v.target);
        rotY = 0;
        body.root.rotation.y = 0;

        if (useDb) {
          dumbbells.forEach((d, i) => {
            d.position.copy(body.arms[i].fore.localToWorld(new THREE.Vector3(0, -0.30, 0.01)));
          });
        }
        t0 = performance.now();
      },

      setPlaying(v) { playing = v; },
      highlight, heatmap,

      setView(name) {
        const v = VIEWS[name] || VIEWS.q34;
        camera.position.set(...v.pos);
        camera.lookAt(...v.target);
        rotY = name === 'back' ? Math.PI : 0;
        body.root.rotation.y = rotY;
      },

      resetView() { this.setView('q34'); },

      dispose() {
        cancelAnimationFrame(raf);
        if (ro) ro.disconnect();
        global.removeEventListener('mousemove', onMove);
        global.removeEventListener('mouseup', onUp);
        renderer.dispose();
        scene.traverse(x => { if (x.isMesh && x.geometry) x.geometry.dispose(); });
        container.innerHTML = '';
      },
    };
  }

  global.Norg3D = {
    ensureThree, createViewer, buildBody, pickAnim, ANIMS, VIEWS, PAL,
    get THREE() { return THREE; },
  };
})(window);
