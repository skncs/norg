(function (global) {
  'use strict';

  const S = global.NorgStore;
  const C = global.NorgChart;
  const U = global.NorgUI;
  const D = global.NORG_DATA;
  const esc = U.esc, ICON = U.ICON;

  let mode = 'diet';        // 今日页模式：diet / train
  let viewDate = null;      // 浏览的日期（null = 今天）
  let curTab = 'today';
  let planSub = null;       // 计划页子视图：null / {type:'session',key} / {type:'meal'}

  const V = {};

  /* ==========================================================
     今日
     ========================================================== */
  V.today = function () {
    const k = viewDate || S.todayKey();
    const t = S.calcTargets();
    const tot = S.dayTotals(k);
    const p = S.state.profile;
    const d = S.day(k);

    const pct = Math.min(1, tot.kcal / t.kcal);
    const left = t.kcal - tot.kcal;

    const pctP = Math.min(1, tot.p / t.protein);
    const pctC = Math.min(1, tot.c / t.carb);
    const pctF = Math.min(1, tot.f / t.fat);

    // 训练模式数据
    const vol = S.dayVolume(k);
    const wsets = d.workouts.reduce((a, w) => a + S.workoutSets(w), 0);
    const musc = S.muscleVolume(7);

    // 体重
    const ws = S.weightSeries(14);
    const curW = d.weight != null ? d.weight : p.weight;
    const prevW = (() => {
      for (let i = 1; i <= 14; i++) {
        const dd = S.state.days[S.dayOffset(k, -i)];
        if (dd && dd.weight != null) return dd.weight;
      }
      return null;
    })();
    const wDelta = prevW != null ? S.round(curW - prevW, 1) : null;
    const avg7 = S.weightAvg(7);

    // 缺口
    const bal = S.calorieBalance(k);

    // PR
    const prKeys = Object.keys(S.state.prs);
    const bestPr = prKeys.map(id => {
      const ex = D.EXERCISES.find(e => e.id === id);
      return ex ? { ex, pr: S.state.prs[id] } : null;
    }).filter(Boolean).sort((a, b) => b.pr.e1rm - a.pr.e1rm)[0];

    const isToday = k === S.todayKey();
    const dateLabel = isToday ? '今日' : `${k.slice(5).replace('-', '/')}`;

    return `
    <div style="display:flex;align-items:center;gap:8px;margin:6px 4px 0;">
      <button class="round-btn" data-act="prevday" style="width:34px;height:34px;flex:0 0 auto">${ICON.back}</button>
      <div style="font-size:24px;font-weight:800;letter-spacing:-.8px;flex:0 0 auto;">${dateLabel}</div>
      ${!isToday ? `<button class="round-btn" style="width:30px;height:30px" data-act="nextday">${ICON.arrow}</button>` : ''}
      <div style="margin-left:auto;flex:0 0 auto">
        <div class="mode-seg">
          <button class="${mode === 'diet' ? 'on' : ''}" data-mode="diet">饮食</button>
          <button class="${mode === 'train' ? 'on' : ''}" data-mode="train">训练</button>
        </div>
      </div>
    </div>

    ${mode === 'diet' ? dietHero(t, tot, pct, left, pctP, pctC, pctF, k) : trainHero(vol, wsets, d)}

    <div class="quick-row">
      ${quick('学院', ICON.medal, false, 'college')}
      ${quick('成就', ICON.trophy, false, 'achv')}
      ${quick('官方计划', ICON.plan, true, 'plan')}
      ${quick('段位', ICON.rank, false, 'rank')}
      ${quick('主题市场', ICON.store, false, 'themes')}
    </div>

    <div class="sec-title"><span class="dot"></span>身体数据<span class="more" data-act="editweight">编辑</span></div>

    <div class="grid2">
      <div class="mini" data-act="editweight" style="cursor:pointer">
        <div class="h"><span>${isToday ? '今日体重' : '当日体重'}</span>
          <span style="color:var(--red);font-size:15px;line-height:1">+</span></div>
        <div class="big">${curW.toFixed(1)}<span>kg</span></div>
        <div class="foot">
          ${wDelta != null ? `<span style="color:${wDelta <= 0 ? 'var(--green)' : 'var(--orange)'};font-weight:800">${wDelta <= 0 ? '↓' : '↑'}${Math.abs(wDelta).toFixed(1)}</span> 较上次` : '暂无对比'}
        </div>
        <div style="margin-top:8px">${C.line({ w: 150, h: 40, points: ws, dots: false, minPad: .5 })}</div>
        <div class="foot" style="display:flex;justify-content:space-between">
          <span>7 天前</span><span>7 日均 ${avg7 != null ? avg7 : '--'}</span>
        </div>
      </div>

      <div class="mini" style="min-width:0">
        <div class="ring-cell">
          ${C.ring({
            size: 84, stroke: 9, gap: 6,
            segments: [
              { value: tot.c || .001, color: 'var(--green)' },
              { value: tot.p || .001, color: 'var(--purple)' },
              { value: tot.f || .001, color: 'var(--yellow)' },
            ],
            center: String(tot.kcal), sub: 'kcal',
          })}
          <div class="legend">
            <span><i style="background:var(--green)"></i>${Math.round(tot.c)}g 碳水</span>
            <span><i style="background:var(--purple)"></i>${Math.round(tot.p)}g 蛋白</span>
            <span><i style="background:var(--yellow)"></i>${Math.round(tot.f)}g 脂肪</span>
          </div>
        </div>
      </div>

      <div class="mini">
        <div class="h"><span>热量缺口</span></div>
        <div style="display:grid;place-items:center;margin-top:2px">
          ${C.gauge({
            w: 168, h: 100, value: bal.deficit, min: -1200, max: 1600,
            label: String(Math.round(bal.deficit)), sub: 'kcal 缺口',
            color: bal.deficit > 0 ? 'var(--red)' : 'var(--orange)',
          })}
        </div>
        <div class="foot center">缺口区 · 摄入 ${bal.intake} / 消耗 ${bal.burn}</div>
      </div>

      <div class="mini" data-act="pr" style="cursor:pointer">
        <div class="h"><span>个人纪录</span>${ICON.arrow}</div>
        ${bestPr ? `
          <div style="margin-top:6px;display:flex;align-items:center;gap:9px">
            <div style="width:44px;height:52px;flex:0 0 auto">${C.bodyMap({ data: { [bestPr.ex.primary]: 1 }, w: 44, h: 52, mode: 'front' })}</div>
            <div>
              <div style="font-size:12.5px;font-weight:700;color:var(--t2)">${esc(bestPr.ex.name)}</div>
              <div style="font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1.15">${bestPr.pr.e1rm}<span style="font-size:11px;color:var(--t3);font-weight:600"> kg</span></div>
              <div class="tiny muted">估算 1RM</div>
            </div>
          </div>` : `<div class="empty" style="padding:20px 0">还没有纪录</div>`}
      </div>

      <div class="mini">
        <div class="h"><span>训练分布</span>${ICON.arrow}</div>
        <div class="muscle-wrap" style="margin-top:6px">
          <div>${C.bodyMap({ data: musc, w: 72, h: 112, mode: 'front' })}</div>
          <div>${C.bodyMap({ data: musc, w: 72, h: 112, mode: 'back' })}</div>
        </div>
        <div class="foot">近 7 天训练量分布</div>
      </div>

      <div class="mini">
        <div class="h"><span>睡眠</span>${ICON.arrow}</div>
        <div class="big">${d.sleep != null ? d.sleep.toFixed(1) : '--'}<span>小时</span></div>
        <div class="foot">昨夜 · 目标 7.5h</div>
        <div style="margin-top:10px">${C.bars({ w: 150, h: 34, data: weekSleep(), color: 'var(--purple)' })}</div>
      </div>

      <div class="mini">
        <div class="h"><span>训练容量</span>${ICON.arrow}</div>
        <div class="big">${vol.toLocaleString()}<span>kg</span></div>
        <div class="foot">${d.workouts.length} 次训练 · ${wsets} 组</div>
      </div>

      <div class="mini">
        <div class="h"><span>活动消耗</span>${ICON.arrow}</div>
        <div class="big">${bal.exerciseBurn}<span>大卡</span></div>
        <div class="foot">来自训练容量估算</div>
      </div>
    </div>

    <div class="sec-title"><span class="dot"></span>本周摄入<span class="more" data-act="goDiet">查看全部</span></div>
    <div class="card">
      ${C.bars({
        w: 300, h: 104,
        data: weekKcal(),
        goal: t.kcal,
        labels: weekLabels(),
        color: 'var(--red)',
      })}
      <div class="tiny muted center" style="margin-top:6px">虚线为目标 ${t.kcal} kcal</div>
    </div>

    <div style="height:8px"></div>
    `;
  };

  function quick(label, icon, on, act) {
    return `<button class="quick ${on ? 'on' : ''}" data-act="${act}">${icon}<span>${label}</span></button>`;
  }

  function dietHero(t, tot, pct, left, pctP, pctC, pctF, k) {
    const d = S.day(k);
    const slots = ['早餐', '午餐', '晚餐', '加餐'];
    const cnt = d.meals.length;
    return `
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-kcal"><b class="num">${tot.kcal.toLocaleString()}</b><i>kcal</i></div>
          <div class="hero-sub">已记录 ${cnt} 餐${left > 0 ? ` · 还可摄入 ${left} kcal` : ` · 已超出 ${Math.abs(left)} kcal`}</div>
        </div>
        <div class="hero-btns">
          <button class="round-btn" data-act="addMeal" title="记录饮食">${ICON.bowl}</button>
          <button class="round-btn" data-act="editweight" title="记录体重">${ICON.edit}</button>
        </div>
      </div>

      <div class="bar-wrap">
        <div class="bar"><div class="bar-fill" style="width:${Math.max(2, pct * 100)}%"></div></div>
        <div class="bar-pct">${Math.round(pct * 100)}%</div>
      </div>

      <div class="macros">
        <div class="macro"><div class="k">蛋白质</div><div class="v">${Math.round(tot.p)}<span>g</span></div>
          <div class="prog" style="margin-top:6px"><i style="width:${pctP * 100}%;background:linear-gradient(90deg,#c4b5fd,#7c3aed)"></i></div></div>
        <div class="macro"><div class="k">碳水</div><div class="v">${Math.round(tot.c)}<span>g</span></div>
          <div class="prog" style="margin-top:6px"><i style="width:${pctC * 100}%;background:linear-gradient(90deg,#6ee7a0,#16a34a)"></i></div></div>
        <div class="macro"><div class="k">脂肪</div><div class="v">${Math.round(tot.f)}<span>g</span></div>
          <div class="prog" style="margin-top:6px"><i style="width:${pctF * 100}%;background:linear-gradient(90deg,#f7ff8a,#a3b800)"></i></div></div>
      </div>

      <div class="goal-arc">目标 <b>${t.kcal.toLocaleString()}</b> kcal · TDEE ${t.tdee} · BMR ${t.bmr}</div>
    </div>

    ${d.meals.length ? `
      <div class="sec-title"><span class="dot"></span>今日记录<span class="more" data-act="addMeal">+ 添加</span></div>
      <div class="list">
        ${slots.map(sl => {
          const items = d.meals.filter(m => m.slot === sl);
          if (!items.length) return '';
          const sum = items.reduce((a, m) => a + m.kcal, 0);
          return `<div class="card" style="padding:12px 14px">
            <div style="display:flex;align-items:center;margin-bottom:8px">
              <span style="font-size:13px;font-weight:800">${sl}</span>
              <span class="tiny muted" style="margin-left:auto">${sum} kcal</span>
            </div>
            ${items.map(m => `
              <div class="row" style="background:transparent;border:0;padding:8px 0" data-meal="${m.id}">
                <div class="mid"><div class="t" style="font-size:13.5px">${esc(m.name)}</div>
                  <div class="s">${m.grams}g · 蛋白 ${m.p}g · 碳水 ${m.c}g · 脂肪 ${m.f}g</div></div>
                <div class="r"><div class="n">${m.kcal}</div><div class="u">kcal</div></div>
                <button class="icon-btn" style="width:26px;height:26px;background:transparent;color:var(--t4)" data-del="${m.id}">${ICON.trash}</button>
              </div>`).join('')}
          </div>`;
        }).join('')}
      </div>` : `
      <div class="card" style="margin-top:14px">
        <div class="empty">
          ${ICON.bowl}
          <div>今天还没有记录饮食</div>
          <button class="btn sm" style="margin-top:14px;max-width:180px" data-act="addMeal">记录第一餐</button>
        </div>
      </div>`}
    `;
  }

  function trainHero(vol, sets, d) {
    const t = S.calcTargets();
    const cnt = d.workouts.length;
    return `
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-kcal"><b class="num">${vol.toLocaleString()}</b><i>kg 容量</i></div>
          <div class="hero-sub">${cnt} 次训练 · ${sets} 组有效组</div>
        </div>
        <div class="hero-btns">
          <button class="round-btn" data-act="addWorkout" title="开始训练">${ICON.dumbbell}</button>
        </div>
      </div>
      <div class="bar-wrap">
        <div class="bar"><div class="bar-fill" style="width:${Math.min(100, vol / 250)}%"></div></div>
        <div class="bar-pct">${cnt}</div>
      </div>
      <div class="goal-arc">建议每周 3-5 练 · 目标 ${t.kcal} kcal 摄入</div>
    </div>

    ${d.workouts.length ? `
      <div class="sec-title"><span class="dot"></span>今日训练<span class="more" data-act="addWorkout">+ 新增</span></div>
      ${d.workouts.map(w => `
        <div class="card" style="margin-bottom:11px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="flex:1">
              <div style="font-size:15px;font-weight:800">${esc(w.name)}</div>
              <div class="tiny muted" style="margin-top:4px">${w.dur} 分钟 · ${S.workoutVolume(w).toLocaleString()} kg · ${S.workoutSets(w)} 组</div>
            </div>
            <button class="icon-btn" data-workout="${w.id}">${ICON.arrow}</button>
          </div>
          <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">
            ${w.exercises.map(ex => `<span class="tag">${esc(ex.name)} ${ex.sets.length}×</span>`).join('')}
          </div>
        </div>`).join('')}` : `
      <div class="card" style="margin-top:14px">
        <div class="empty">${ICON.dumbbell}
          <div>今天还没有训练记录</div>
          <button class="btn sm" style="margin-top:14px;max-width:180px" data-act="addWorkout">开始训练</button>
        </div>
      </div>`}
    `;
  }

  function weekKcal() {
    const out = [];
    for (let i = 6; i >= 0; i--) out.push(S.dayTotals(S.dayOffset(S.todayKey(), -i)).kcal);
    return out;
  }
  function weekLabels() {
    const out = [];
    const names = ['日', '一', '二', '三', '四', '五', '六'];
    for (let i = 6; i >= 0; i--) {
      const k = S.dayOffset(S.todayKey(), -i);
      out.push(names[new Date(k + 'T00:00:00').getDay()]);
    }
    return out;
  }
  function weekSleep() {
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const d = S.state.days[S.dayOffset(S.todayKey(), -i)];
      out.push(d && d.sleep ? d.sleep : 0);
    }
    return out;
  }

  /* ==========================================================
     饮食
     ========================================================== */
  V.diet = function () {
    const k = S.todayKey();
    const t = S.calcTargets();
    const tot = S.dayTotals(k);
    const d = S.day(k);
    const slots = ['早餐', '午餐', '晚餐', '加餐'];

    return `
    <div class="sec-title" style="margin-top:8px"><span class="dot"></span>营养摄入</div>
    <div class="card glow">
      <div style="display:flex;align-items:center;gap:16px">
        ${C.ring({
          size: 112, stroke: 11, gap: 6,
          segments: [
            { value: Math.max(.001, t.carb - tot.c), color: 'rgba(61,220,132,.22)' },
            { value: Math.max(.001, tot.c), color: 'var(--green)' },
            { value: Math.max(.001, tot.p), color: 'var(--purple)' },
            { value: Math.max(.001, tot.f), color: 'var(--yellow)' },
          ],
          center: String(tot.kcal), sub: '已摄入',
        })}
        <div style="flex:1">
          <div style="font-size:13px;color:var(--t3);font-weight:700">今日剩余</div>
          <div style="font-size:32px;font-weight:800;letter-spacing:-1.4px;line-height:1.15">${Math.max(0, t.kcal - tot.kcal)}<span style="font-size:13px;color:var(--t3);font-weight:600"> kcal</span></div>
          <div class="tiny muted" style="margin-top:6px">目标 ${t.kcal} · 已摄入 ${tot.kcal}</div>
        </div>
      </div>

      <div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
        ${macroBar('蛋白质', tot.p, t.protein, 'var(--purple)', '#7c3aed')}
        ${macroBar('碳水', tot.c, t.carb, 'var(--green)', '#16a34a')}
        ${macroBar('脂肪', tot.f, t.fat, 'var(--yellow)', '#a3b800')}
      </div>
    </div>

    <div class="sec-title"><span class="dot"></span>今日饮食<span class="more" data-act="addMeal">+ 添加</span></div>

    ${slots.map(sl => {
      const items = d.meals.filter(m => m.slot === sl);
      const sum = items.reduce((a, m) => a + m.kcal, 0);
      return `<div class="card" style="margin-bottom:11px;padding:14px">
        <div style="display:flex;align-items:center;margin-bottom:${items.length ? 8 : 0}px">
          <div style="font-size:14px;font-weight:800">${sl}</div>
          <div class="tiny muted" style="margin-left:8px">${items.length ? sum + ' kcal' : '未记录'}</div>
          <button class="icon-btn" style="margin-left:auto;width:28px;height:28px" data-addslot="${sl}">${ICON.plus}</button>
        </div>
        ${items.map(m => `
          <div class="row" style="background:transparent;border:0;padding:8px 0">
            <div class="mid"><div class="t" style="font-size:13.5px">${esc(m.name)}</div>
              <div class="s">${m.grams}g · P${m.p} C${m.c} F${m.f}</div></div>
            <div class="r"><div class="n">${m.kcal}</div><div class="u">kcal</div></div>
            <button class="icon-btn" style="width:26px;height:26px;background:transparent;color:var(--t4)" data-del="${m.id}">${ICON.trash}</button>
          </div>`).join('')}
      </div>`;
    }).join('')}

    <div class="sec-title"><span class="dot"></span>快捷添加</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      ${['鸡胸肉', '鸡蛋', '米饭', '牛奶', '燕麦片', '西兰花', '香蕉', '乳清蛋白粉'].map(n => {
        const f = D.FOODS.find(x => x.name === n);
        return f ? `<button class="tag" data-quick="${f.id}" style="padding:9px 14px;font-size:12.5px">${n} · ${f.serving}g</button>` : '';
      }).join('')}
    </div>

    <div style="height:8px"></div>`;
  };

  function macroBar(name, cur, goal, c1, c2) {
    const pct = Math.min(1, cur / (goal || 1));
    return `<div>
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px">
        <span style="color:var(--t2)">${name}</span>
        <span><b style="font-size:13px">${Math.round(cur)}</b><span class="muted" style="font-weight:600"> / ${goal}g</span></span>
      </div>
      <div class="prog"><i style="width:${pct * 100}%;background:linear-gradient(90deg,${c1},${c2})"></i></div>
    </div>`;
  }

  /* ==========================================================
     训练
     ========================================================== */
  V.train = function () {
    const k = S.todayKey();
    const d = S.day(k);
    const musc = S.muscleVolume(7);
    const totalVol = Object.values(S.state.days).reduce((a, dd) =>
      a + (dd.workouts || []).reduce((b, w) => b + S.workoutVolume(w), 0), 0);

    const prs = Object.keys(S.state.prs).map(id => {
      const ex = D.EXERCISES.find(e => e.id === id);
      return ex ? { ex, pr: S.state.prs[id] } : null;
    }).filter(Boolean).sort((a, b) => b.pr.e1rm - a.pr.e1rm);

    return `
    <div class="sec-title" style="margin-top:8px"><span class="dot"></span>训练概览</div>
    <div class="card glow">
      <div style="display:flex;gap:14px;align-items:center">
        <div style="flex:1">
          <div class="tiny muted" style="font-weight:700">累计容量</div>
          <div style="font-size:30px;font-weight:800;letter-spacing:-1.4px;line-height:1.2">${totalVol.toLocaleString()}<span style="font-size:12px;color:var(--t3)"> kg</span></div>
          <div class="tiny muted" style="margin-top:5px">共 ${S.totalWorkouts()} 次训练</div>
        </div>
        <div style="text-align:center">
          ${C.progressRing({ size: 78, stroke: 8, pct: Math.min(1, S.totalWorkouts() / 30), label: String(S.totalWorkouts()), sub: '次' })}
        </div>
      </div>
    </div>

    <div class="sec-title"><span class="dot"></span>肌群分布<span class="more">近 7 天</span></div>
    <div class="card" style="padding:12px">
      <div id="train3d" style="height:340px;border-radius:18px;overflow:hidden;
           background:radial-gradient(70% 70% at 50% 25%, #1e2430, #0a0c10 75%)"></div>
      <div class="tiny muted center" style="margin-top:8px">3D 肌群热力图 · 越红练得越多 · 可拖动旋转</div>
      <div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:7px 14px">
        ${Object.entries(D.MUSCLES).filter(([mk]) => musc[mk]).sort((a, b) => musc[b[0]] - musc[a[0]]).slice(0, 8).map(([mk, m]) => `

/* ===== views-plan.js ===== */
/* ============================================================
   Norg · 计划视图 v2
   ------------------------------------------------------------
   - 计划库：8 套可选，按水平/器械筛选
   - 分阶段：显示当前第几周、这阶段该注意什么
   - 动作教学：难度标签 + 新手替代 + 关键提示
   ============================================================ */
(function (global) {
  'use strict';

  const S = global.NorgStore;
  const P = global.NorgPrograms;
  const C = global.NorgChart;
  const U = global.NorgUI;
  const D = global.NORG_DATA;
  const esc = U.esc, ICON = U.ICON;

  const WEEKDAY = ['日', '一', '二', '三', '四', '五', '六'];

  /* 取当前计划状态（存在 store 里） */
  function getState() {
    const st = S.state;
    if (!st.program) {
      st.program = { id: 'starter4w', startDate: S.todayKey(), weekIndex: 1 };
      S.save();
    }
    return st.program;
  }

  function currentProgram() {
    const p = getState();
    return P.PROGRAMS.find(x => x.id === p.id) || P.PROGRAMS[0];
  }

  function currentWeek() {
    const st = getState();
    const prog = currentProgram();
    return P.buildWeek(prog.id, st.weekIndex);
  }

  /* 计算已进行到第几周（按开始日期推算） */
  function autoWeekIndex() {
    const st = getState();
    if (!st.startDate) return 1;
    const start = new Date(st.startDate + 'T00:00:00');
    const now = new Date(S.todayKey() + 'T00:00:00');
    const days = Math.floor((now - start) / 86400000);
    const w = Math.floor(days / 7) + 1;
    return Math.max(1, Math.min(currentProgram().weeks, w));
  }

  function switchProgram(id) {
    const st = S.state;
    st.program = { id, startDate: S.todayKey(), weekIndex: 1 };
    S.save();
  }

  /* ==========================================================
     计划主页
     ========================================================== */
  const V = {};

  V.plan = function () {
    const st = getState();
    const prog = currentProgram();
    const weekIdx = autoWeekIndex();
    const week = P.buildWeek(prog.id, weekIdx);
    const phase = P.phaseOf(prog, weekIdx);
    const audit = P.auditWeek(week);
    const todayWd = new Date().getDay();
    const todaySession = week.sessions.find(s => s.weekday === todayWd);
    const nextSession = (() => {
      for (let i = 1; i <= 7; i++) {
        const wd = (todayWd + i) % 7;
        const s = week.sessions.find(x => x.weekday === wd);
        if (s) return { s, inDays: i };
      }
      return null;
    })();

    const progress = Math.min(100, Math.round(weekIdx / prog.weeks * 100));

    return `
    <!-- 当前计划卡 -->
    <div class="sec-title" style="margin-top:8px"><span class="dot"></span>我的计划
      <span class="more" data-act="openLibrary">换计划</span>
    </div>

    <div class="card glow" style="padding:18px">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
            <span style="font-size:18px;font-weight:800;letter-spacing:-.4px">${esc(prog.name)}</span>
            <span class="tag red" style="font-size:10px">${esc(prog.badge)}</span>
          </div>
          <div class="tiny muted" style="margin-top:6px;line-height:1.55">${esc(prog.desc)}</div>
        </div>
      </div>

      <!-- 进度 -->
      <div style="margin-top:16px">
        <div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;margin-bottom:6px">
          <span style="color:var(--t2)">第 ${weekIdx} 周 / 共 ${prog.weeks} 周</span>
          <span style="color:var(--t3)">${progress}%</span>
        </div>
        <div class="prog"><i style="width:${progress}%"></i></div>
      </div>

      <!-- 当前阶段 -->
      ${phase ? `
      <div style="margin-top:14px;padding:12px 13px;border-radius:14px;
           background:rgba(255,59,48,.10);border:1px solid rgba(255,59,48,.22)">
        <div style="display:flex;align-items:center;gap:7px">
          <span style="font-size:13px;font-weight:800;color:#ff8b82">${esc(phase.name)}</span>
          <span class="tag" style="font-size:9.5px;margin-left:auto">强度 RPE ${esc(phase.rpe)}</span>
        </div>
        <div class="tiny" style="margin-top:7px;line-height:1.65;color:var(--t2)">${esc(phase.note)}</div>
      </div>` : ''}

      <!-- 周次切换 -->
      <div style="margin-top:14px;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px">
        ${Array.from({ length: prog.weeks }, (_, i) => i + 1).map(w => {
          const on = w === weekIdx;
          const ph = P.phaseOf(prog, w);
          return `<button class="tag ${on ? 'red' : ''}" data-week="${w}"
            style="white-space:nowrap;font-size:10.5px">第${w}周${ph ? ' · ' + ph.name.split('·')[0].trim() : ''}</button>`;
        }).join('')}
      </div>
    </div>

    <!-- 今日任务 -->
    <div class="sec-title"><span class="dot"></span>今天该练什么</div>
    ${todaySession ? todayCard(todaySession, week, phase) : restCard(nextSession, week)}

    <!-- 本周安排 -->
    <div class="sec-title"><span class="dot"></span>本周安排<span class="more">共 ${week.sessions.length} 练</span></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${week.sessions.map(s => {
        const isToday = s.weekday === todayWd;
        const hardCount = s.exercises.filter(e => e.difficulty === 3).length;
        return `<div class="card" data-session="${s.key}" style="padding:13px 15px;
          background:${isToday ? 'linear-gradient(168deg,rgba(255,59,48,.16),rgba(255,59,48,.06))' : ''};
          border-color:${isToday ? 'rgba(255,59,48,.32)' : ''}">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
              background:${isToday ? 'var(--red)' : 'rgba(255,255,255,.07)'};
              font-size:11.5px;font-weight:800;color:${isToday ? '#fff' : 'var(--t3)'};flex:0 0 auto">
              周${WEEKDAY[s.weekday]}
            </span>
            <div style="flex:1;min-width:0">
              <div style="font-size:14px;font-weight:800">${esc(s.label)}</div>
              <div class="tiny muted" style="margin-top:2px">
                ${s.exercises.length} 个动作 · ${s.totalSets} 组${hardCount ? ` · ${hardCount} 个较难` : ''}
              </div>
            </div>
            <span style="color:var(--t4);flex:0 0 auto">${ICON.arrow}</span>
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- 检查 -->
    ${audit.warnings.length ? `
      <div class="sec-title"><span class="dot"></span>提醒</div>
      <div class="card">
        ${audit.warnings.map(w => `<div style="display:flex;gap:8px;font-size:12px;line-height:1.6;margin-bottom:6px">
          <span style="color:var(--orange);flex:0 0 auto">●</span><span style="color:var(--t2)">${esc(w)}</span></div>`).join('')}
      </div>` : ''}

    <!-- 有氧 + 复盘 -->
    <div class="sec-title"><span class="dot"></span>有氧建议</div>
    ${cardioCard()}

    <div class="sec-title"><span class="dot"></span>进度复盘<span class="more">近 2 周</span></div>
    ${reviewCard()}

    <div style="height:8px"></div>`;
  };

  /* ---------- 今日训练卡 ---------- */
  function todayCard(s, week, phase) {
    const done = S.day(S.todayKey()).workouts.length > 0;
    const mins = Math.round(s.totalSets * 3);

    return `<div class="card glow" style="margin-bottom:4px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div style="flex:1">
          <div style="font-size:18px;font-weight:800;letter-spacing:-.4px">${esc(s.label)}</div>
          <div class="tiny muted" style="margin-top:4px">${s.exercises.length} 个动作 · ${s.totalSets} 组 · 约 ${mins} 分钟</div>
        </div>
        ${done ? `<span class="tag red">已完成</span>` : `<span class="tag">待训练</span>`}
      </div>

      <div style="display:flex;flex-direction:column;gap:8px">
        ${s.exercises.map((e, i) => {
          const dc = P.diffColor(e.difficulty);
          return `<div data-planex="${e.exId}" style="padding:10px 11px;border-radius:13px;background:rgba(255,255,255,.045)">
            <div style="display:flex;align-items:center;gap:9px">
              <span style="width:19px;height:19px;border-radius:6px;background:rgba(255,59,48,.18);color:#ff8b82;
                font-size:10px;font-weight:800;display:grid;place-items:center;flex:0 0 auto">${i + 1}</span>
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px">
                  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.name)}</span>
                  <span style="font-size:9px;font-weight:800;color:${dc};flex:0 0 auto">${P.diffLabel(e.difficulty)}</span>

                <div class="tiny muted" style="margin-top:2px">${e.targetSets} 组 × ${e.targetReps}${typeof e.targetReps === 'number' ? ' 次' : ''} · 休息 ${e.rest}</div>

      </div>

      <button class="btn" style="margin-top:14px" data-act="startFromPlan">按计划开始训练</button>
      <div class="tiny muted center" style="margin-top:8px;line-height:1.5">

          <div style="font-size:15px;font-weight:800">今天是休息日</div>
          <div class="tiny muted" style="margin-top:4px;line-height:1.55">

          dur: isBeginner ? '20-30 分钟' : '30-45 分钟',

        }
      : {

          type: 'Zone 2 有氧',
          dur: '20 分钟',

          <div class="tiny muted" style="margin-top:3px">每周 ${info.n} 次 · 每次 ${info.dur}</div>
        </div>

    const today = S.todayKey();
    let done = 0;
    for (let i = 0; i < 14; i++) {
      const d = S.state.days[S.dayOffset(today, -i)];
      if (d) done += (d.workouts || []).length;
    }
    const avg = done / 2;
    const prog = currentProgram();
    const rate = Math.round(avg / prog.days * 100);

    // 体重建议
    const ws = S.weightSeries(14).filter(x => x.w != null);
    let advice = '数据不足，再记录几天';
    if (ws.length >= 7) {
      const rate2 = (ws[ws.length - 1].w - ws[0].w) / (ws.length / 7);
      const target = S.state.profile.goalRate;
      if (Math.abs(rate2 - target) > 0.3) {
        advice = rate2 < target
          ? `减重 ${Math.abs(rate2).toFixed(2)} kg/周，慢于目标。每日再减 150 kcal 或加 1 次快走`
          : `变化 ${rate2.toFixed(2)} kg/周，快于目标。每日加 150 kcal，避免掉肌肉`;
      } else {
        advice = `${rate2.toFixed(2)} kg/周，与目标基本吻合，保持`;
      }
    }

    return `<div class="card">
      <div style="display:flex;gap:14px;margin-bottom:12px">
        <div>
          <div class="tiny muted">周均完成</div>
          <div style="font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1.2">

        <div style="padding-top:11px;border-top:1px solid var(--line);font-size:12px;color:var(--t3);line-height:1.6">
          <span style="color:var(--orange)">建议：</span>完成率偏低。新手先把频率稳住，哪怕每次只练 20 分钟也算。

/* ===== app.js ===== */
/* ============================================================
   Norg · 应用控制器
   路由 / 事件委托 / 各类弹层流程
   ============================================================ */
(function (global) {
  'use strict';

  const S = global.NorgStore;
  const C = global.NorgChart;
  const U = global.NorgUI;
  const D = global.NORG_DATA;
  const VW = global.NorgViews;
  const V = VW.V;
  const esc = U.esc, ICON = U.ICON;
  const $ = U.$, $$ = U.$$;

  /* ==========================================================
     3D 视图管理（页面级）
     ========================================================== */
  let pageViewer = null;
  function disposePageViewer() {
    if (pageViewer) { try { pageViewer.dispose(); } catch (e) {} pageViewer = null; }
  }

  function initPage3d(tab) {
    disposePageViewer();
    if (tab !== 'train') return;
    const el = document.getElementById('train3d');
    if (!el) return;

    global.Norg3D.ensureThree().then(() => {
      if (!document.getElementById('train3d')) return;
      try {
        pageViewer = global.Norg3D.createViewer(el, { height: 340, autoRotate: true });
        pageViewer.setAnim('idle');
        pageViewer.setView('front');
        pageViewer.heatmap(S.muscleVolume(7));
      } catch (e) {
        el.innerHTML = `<div style="display:grid;place-items:center;height:100%;color:var(--t4);font-size:12px">3D 加载失败</div>`;
      }
    }).catch(() => {
      el.innerHTML = `<div style="display:grid;place-items:center;height:100%;color:var(--t4);font-size:12px">3D 加载失败</div>`;
    });
  }

  /* ==========================================================
     渲染
     ========================================================== */
  function render() {
    const tab = VW.tab;
    const el = $('#view');
    const PV = global.NorgPlanViews;

    // 计划相关子页
    if (tab === 'plan') {
      const sub = VW.planSub;
      if (sub && sub.type === 'session') el.innerHTML = PV.V.planSession(sub.key);
      else if (sub && sub.type === 'meal') el.innerHTML = PV.V.planMeal();
      else if (sub && sub.type === 'library') el.innerHTML = PV.V.planLibrary();
      else el.innerHTML = PV.V.plan();
    } else {
      el.innerHTML = V[tab] ? V[tab]() : '';
    }

    el.scrollTop = 0;
    window.scrollTo(0, 0);
    $$('.tab').forEach(b => b.classList.toggle('is-active', b.dataset.tab === tab));
    $('#streakNum').textContent = S.state.streak || 0;

    // FAB
    const old = $('#fab');
    if (old) old.remove();
    if (tab === 'diet' || tab === 'train') {
      const f = document.createElement('button');
      f.id = 'fab';
      f.className = 'fab';
      f.innerHTML = ICON.plus;
      f.onclick = () => tab === 'diet' ? openAddMeal() : openAddWorkout();
      document.body.appendChild(f);
    }

    // 训练页的 3D 肌群图
    setTimeout(() => initPage3d(tab), 30);
  }

  /* ==========================================================
     事件委托
     ========================================================== */
  function bindGlobal() {
    $('#tabbar').addEventListener('click', e => {
      const b = e.target.closest('.tab');
      if (!b) return;
      VW.tab = b.dataset.tab;
      VW.planSub = null;
      render();
    });

    $('#view').addEventListener('click', e => {
      const t = e.target;

      // 删除一餐
      const del = t.closest('[data-del]');
      if (del) {
        e.stopPropagation();
        const k = VW.viewDate || S.todayKey();
        S.removeMeal(k, del.dataset.del);
        U.toast('已删除');
        render();
        return;
      }

      // 计划：打开某个训练日
      const ps = t.closest('[data-session]');
      if (ps) {
        VW.planSub = { type: 'session', key: ps.dataset.session };
        render();
        return;
      }

      // 计划库：选择计划
      const pp = t.closest('[data-pickprog]');
      if (pp) {
        const PV2 = global.NorgPlanViews;
        PV2.switchProgram(pp.dataset.pickprog);
        VW.planSub = null;
        U.toast('已切换计划');
        render();
        return;
      }

      // 计划库：切换周次
      const wkBtn = t.closest('[data-week]');
      if (wkBtn) {
        const st = S.state.program;
        if (st) {
          // 按周次反推 startDate
          const offset = (Number(wkBtn.dataset.week) - 1) * 7;
          st.startDate = S.dayOffset(S.todayKey(), -offset);
          st.weekIndex = Number(wkBtn.dataset.week);
          S.save();
          render();
        }
        return;
      }

      // 计划：动作详情
      const pex = t.closest('[data-planex]');
      if (pex) { openExercise(pex.dataset.planex); return; }

      // 打开某个动作
      const ex = t.closest('[data-ex]');
      if (ex) { openExercise(ex.dataset.ex); return; }

      // 打开某次训练
      const wk = t.closest('[data-workout]');
      if (wk) { openWorkoutDetail(wk.dataset.workout); return; }

      // 指定餐次添加
      const as = t.closest('[data-addslot]');
      if (as) { openAddMeal(as.dataset.addslot); return; }

      // 快捷添加
      const qk = t.closest('[data-quick]');
      if (qk) {
        const f = D.FOODS.find(x => x.id === qk.dataset.quick);
        if (f) { S.addMeal(S.todayKey(), f, f.serving); U.toast(`已添加 ${f.name} ${f.serving}g`); render(); }
        return;
      }

      // 模式切换
      const md = t.closest('[data-mode]');
      if (md) { VW.mode = md.dataset.mode; render(); return; }

      // 通用动作
      const act = t.closest('[data-act]');
      if (!act) return;
      const a = act.dataset.act;
      switch (a) {
        case 'addMeal': openAddMeal(); break;
        case 'addWorkout': openAddWorkout(); break;
        case 'editweight': openWeight(); break;
        case 'prevday': VW.viewDate = S.dayOffset(VW.viewDate || S.todayKey(), -1); render(); break;
        case 'nextday': {
          const n = S.dayOffset(VW.viewDate || S.todayKey(), 1);
          VW.viewDate = n > S.todayKey() ? S.todayKey() : n;
          render();
          break;
        }
        case 'goDiet': VW.tab = 'diet'; render(); break;
        case 'settings': openSettings(); break;
        case 'themes': openThemes(); break;
        case 'achv': openAchievements(); break;
        case 'pr': openPRs(); break;
        case 'college': U.toast('Norg 学院 · 内容持续更新中'); break;
        case 'plan': openPlan(); break;
        case 'rank': openRank(); break;
        case 'allEx': openAllExercises(); break;
        case 'export': doExport(); break;
        case 'import': doImport(); break;
        case 'reset': doReset(); break;

        // ===== 计划相关 =====
        case 'backPlan': VW.planSub = null; render(); break;
        case 'mealPlan': VW.planSub = { type: 'meal' }; render(); break;
        case 'openLibrary': VW.planSub = { type: 'library' }; render(); break;
        case 'planSettings': openPlanSettings(); break;
        case 'startFromPlan': {
          const PV = global.NorgPlanViews;
          const week = PV.currentWeek();
          const today = week.sessions.find(s => s.weekday === new Date().getDay());
          if (today) startSessionFromPlan(today);
          else U.toast('今天没有安排训练');
          break;
        }
        case 'startSession': startSessionFromPlanByKey(act.dataset.key); break;
      }
    });

    $('#btnPro').onclick = () => U.toast('PRO 已解锁（演示版全部功能免费）');
    $('#btnStreak').onclick = () => U.toast(`已连续记录 ${S.state.streak} 天`);
    $('#sheetClose').onclick = U.closeSheet;
    $('#sheetMask').onclick = U.closeSheet;
  }

  /* ==========================================================
     按计划开始训练
     ========================================================== */
  function startSessionFromPlanByKey(key) {
    const PV = global.NorgPlanViews;
    const week = PV.currentWeek();
    const s = week.sessions.find(x => x.key === key);
    if (s) startSessionFromPlan(s);
  }

  function startSessionFromPlan(session) {
    const k = S.todayKey();
    const d = S.day(k);

    // 已存在同名训练就复用，避免重复创建
    let w = d.workouts.find(x => x.name === session.label);
    if (!w) {
      w = {
        id: S.uid(),
        name: session.label,
        ts: Date.now(),
        dur: Math.round(session.totalSets * 3),
        exercises: session.exercises.map(e => ({
          exId: e.exId,
          name: e.name,
          sets: [],
          planned: {
            weight: e.targetWeight,
            reps: e.targetReps,
            sets: e.targetSets,
          },
        })),
      };
      d.workouts.push(w);
      S.save();
      U.toast('已按计划创建训练');
    } else {
      U.toast('今天的这个训练已存在');
    }

    VW.tab = 'train';
    VW.planSub = null;
    render();
    setTimeout(() => openWorkoutDetail(w.id), 240);
  }

      <div class="field" style="margin-top:14px">
        <label>可用器械</label>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          ${[['all', '不限'], ['杠铃', '杠铃'], ['哑铃', '哑铃'], ['器械', '固定器械'], ['绳索', '绳索'], ['自重', '自重']]

        </div>
      </div>

        <label>训练经验</label>
        <div style="display:flex;gap:7px;flex-wrap:wrap">

        </div>
      </div>

      <div class="card" style="margin:16px 0">
        <div class="tiny muted" style="font-weight:700;margin-bottom:7px">当前方案</div>
        <div style="font-size:14.5px;font-weight:800">${esc(week.splitName)}</div>
        <div class="tiny muted" style="margin-top:5px;line-height:1.55">${esc(week.splitDesc)}</div>
      </div>

      <button class="btn" id="regenPlan">重新生成计划</button>
      <div class="tiny muted center" style="margin-top:10px;line-height:1.6">
        重新生成会按新的天数 / 器械 / 经验重新编排动作和目标重量。<br>已记录的训练数据不受影响。

      after: () => {
        let days = p.daysPerWeek, eq = p.equipment, lv = p.level;
        $('#sheetBody').addEventListener('click', e => {
          const d1 = e.target.closest('[data-days]');
          if (d1) {
            days = Number(d1.dataset.days);
            $$('[data-days]').forEach(b => b.classList.toggle('red', b.dataset.days == days));
            return;
          }
          const e1 = e.target.closest('[data-eq]');
          if (e1) {
            eq = e1.dataset.eq;
            $$('[data-eq]').forEach(b => b.classList.toggle('red', b.dataset.eq === eq));
            return;
          }
          const l1 = e.target.closest('[data-lv]');
          if (l1) {
            lv = l1.dataset.lv;

            PV.regenWeek({ daysPerWeek: days, equipment: eq, level: lv });
            U.closeSheet();
            U.toast('计划已重新生成');
            render();
          }
        });
      },
    });
  }

  /* ==========================================================
     记录饮食
     ========================================================== */
  let mealPick = { slot: null, food: null, grams: 100, cat: '全部', q: '' };

  function openAddMeal(slot) {
    mealPick = { slot: slot || null, food: null, grams: 100, cat: '全部', q: '' };
    U.openSheet('记录饮食', mealSheetHTML(), { after: bindMealSheet });
  }

  function mealSheetHTML() {
    const cats = ['全部', '主食', '蛋白', '乳制品', '蔬菜', '水果', '油脂', '外食', '饮品'];
    const q = mealPick.q.trim();
    let list = D.FOODS;
    if (mealPick.cat !== '全部') list = list.filter(f => f.cat === mealPick.cat);
    if (q) list = list.filter(f => (f.name + ' ' + f.alias).toLowerCase().includes(q.toLowerCase()));
    list = list.slice(0, 60);

    return `
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <div style="flex:1;position:relative">
          <span style="position:absolute;left:13px;top:14px;width:18px;height:18px;color:var(--t4)">${ICON.search}</span>
          <input class="input" id="fq" placeholder="搜索食物，如 鸡胸肉" value="${esc(mealPick.q)}" style="padding-left:38px" />
        </div>
      </div>
      <div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px">
        ${cats.map(c => `<button class="tag ${mealPick.cat === c ? 'red' : ''}" data-cat="${c}" style="white-space:nowrap">${c}</button>`).join('')}
      </div>
      <div id="flist" style="max-height:44vh;overflow-y:auto;margin:0 -4px">
        ${list.map(f => `
          <div class="row" data-food="${f.id}" style="margin:0 4px 7px">
            <div class="mid">
              <div class="t">${esc(f.name)}</div>
              <div class="s">每100g · P${f.p} C${f.c} F${f.f}</div>
            </div>
            <div class="r"><div class="n">${f.kcal}</div><div class="u">kcal</div></div>
          </div>`).join('') || `<div class="empty">没有找到相关食物</div>`}
      </div>`;
  }

  function bindMealSheet() {
    const q = $('#fq');
    if (q) {
      q.addEventListener('input', () => {
        mealPick.q = q.value;
        $('#flist').innerHTML = renderFoodList();
      });
      q.addEventListener('focus', () => setTimeout(() => q.setSelectionRange(q.value.length, q.value.length), 10));
    }
    $('#sheetBody').addEventListener('click', e => {
      const cat = e.target.closest('[data-cat]');
      if (cat) {
        mealPick.cat = cat.dataset.cat;
        U.openSheet('记录饮食', mealSheetHTML(), { after: bindMealSheet });
        return;
      }
      const fi = e.target.closest('[data-food]');
      if (fi) {
        mealPick.food = D.FOODS.find(f => f.id === fi.dataset.food);
        mealPick.grams = mealPick.food.serving;
        openGramsSheet();
      }
    });
  }

  function renderFoodList() {
    let list = D.FOODS;
    if (mealPick.cat !== '全部') list = list.filter(f => f.cat === mealPick.cat);
    if (mealPick.q.trim()) {
      const q = mealPick.q.trim().toLowerCase();
      list = list.filter(f => (f.name + ' ' + f.alias).toLowerCase().includes(q));
    }
    list = list.slice(0, 60);
    return list.map(f => `
      <div class="row" data-food="${f.id}" style="margin:0 4px 7px">
        <div class="mid"><div class="t">${esc(f.name)}</div>
          <div class="s">每100g · P${f.p} C${f.c} F${f.f}</div></div>
        <div class="r"><div class="n">${f.kcal}</div><div class="u">kcal</div></div>
      </div>`).join('') || `<div class="empty">没有找到相关食物</div>`;
  }

  function openGramsSheet() {
    const f = mealPick.food;
    const slots = ['早餐', '午餐', '晚餐', '加餐'];
    if (!mealPick.slot) mealPick.slot = S.slotOfNow ? S.slotOfNow() : '午餐';

    const html = `
      <div style="display:flex;align-items:center;gap:13px;margin-bottom:16px">
        <div class="ico" style="width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:23px;background:rgba(255,59,48,.14);border:1px solid rgba(255,59,48,.28)">🍽️</div>
        <div>
          <div style="font-size:17px;font-weight:800">${esc(f.name)}</div>
          <div class="tiny muted" style="margin-top:3px">每 100g：${f.kcal} kcal · P${f.p} C${f.c} F${f.f}</div>
        </div>
      </div>

      <div class="field">
        <label>份量（克）</label>
        <input class="input" id="gIn" type="number" inputmode="decimal" value="${mealPick.grams}" />
      </div>
      <div style="display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap">
        ${[50, 100, 150, 200, 250, 300].map(g => `<button class="tag" data-g="${g}">${g}g</button>`).join('')}
        <button class="tag red" data-g="${f.serving}">1份 ${f.serving}g</button>
      </div>

      <div class="field">
        <label>餐次</label>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          ${slots.map(s => `<button class="tag ${mealPick.slot === s ? 'red' : ''}" data-slot="${s}">${s}</button>`).join('')}
        </div>
      </div>

      <div class="card" style="margin:16px 0" id="preview">
        ${previewHTML(f, mealPick.grams)}
      </div>

      <button class="btn" id="doAdd">加入记录</button>
    `;
    U.openSheet('添加食物', html, {
      after: () => {
        const gIn = $('#gIn');
        const upd = () => {
          mealPick.grams = Number(gIn.value) || 0;
          $('#preview').innerHTML = previewHTML(f, mealPick.grams);
        };
        gIn.addEventListener('input', upd);
        $('#sheetBody').addEventListener('click', e => {
          const g = e.target.closest('[data-g]');
          if (g) { gIn.value = g.dataset.g; upd(); return; }
          const s = e.target.closest('[data-slot]');
          if (s) {
            mealPick.slot = s.dataset.slot;
            $$('[data-slot]').forEach(b => b.classList.toggle('red', b.dataset.slot === mealPick.slot));
            return;
          }
          if (e.target.closest('#doAdd')) {
            if (!mealPick.grams) { U.toast('请输入份量'); return; }
            S.addMeal(S.todayKey(), f, mealPick.grams, mealPick.slot);
            U.closeSheet();
            U.toast(`已记录 ${f.name} ${mealPick.grams}g`);
            render();
          }
        });
      },
    });
  }

  function previewHTML(f, g) {
    const k = Math.round(f.kcal * g / 100);
    const p = Math.round(f.p * g / 100 * 10) / 10;
    const c = Math.round(f.c * g / 100 * 10) / 10;
    const fa = Math.round(f.f * g / 100 * 10) / 10;
    return `<div style="display:flex;align-items:center">
      <div>
        <div class="tiny muted" style="font-weight:700">本次摄入</div>
        <div style="font-size:28px;font-weight:800;letter-spacing:-1.2px;line-height:1.2">${k}<span style="font-size:12px;color:var(--t3)"> kcal</span></div>
      </div>
      <div style="margin-left:auto;display:flex;gap:14px;text-align:right">
        <div><div class="tiny muted">蛋白</div><div style="font-size:15px;font-weight:800;color:var(--purple)">${p}g</div></div>
        <div><div class="tiny muted">碳水</div><div style="font-size:15px;font-weight:800;color:var(--green)">${c}g</div></div>
        <div><div class="tiny muted">脂肪</div><div style="font-size:15px;font-weight:800;color:var(--yellow)">${fa}g</div></div>
      </div>
    </div>`;
  }

  /* ==========================================================
     记录体重
     ========================================================== */
  function openWeight() {
    const k = VW.viewDate || S.todayKey();
    const d = S.day(k);
    const cur = d.weight != null ? d.weight : S.state.profile.weight;
    const html = `
      <div class="field">
        <label>体重（kg）</label>
        <input class="input" id="wIn" type="number" inputmode="decimal" step="0.1" value="${cur}" style="font-size:26px;height:60px;font-weight:800;text-align:center" />
      </div>
      <div style="display:flex;gap:7px;margin-bottom:16px;justify-content:center">
        ${[-0.5, -0.1, +0.1, +0.5].map(x => `<button class="tag" data-adj="${x}">${x > 0 ? '+' : ''}${x}</button>`).join('')}
      </div>
      <div class="card" style="margin-bottom:16px">
        ${C.line({ w: 280, h: 80, points: S.weightSeries(14) })}
        <div class="tiny muted center" style="margin-top:6px">近 14 天趋势</div>
      </div>
      <button class="btn" id="doW">保存体重</button>
    `;
    U.openSheet('记录体重', html, {
      after: () => {
        const inp = $('#wIn');
        $('#sheetBody').addEventListener('click', e => {
          const adj = e.target.closest('[data-adj]');
          if (adj) { inp.value = (Number(inp.value) + Number(adj.dataset.adj)).toFixed(1); return; }
          if (e.target.closest('#doW')) {
            const v = Number(inp.value);
            if (!v || v < 20 || v > 300) { U.toast('请输入合理体重'); return; }
            S.setWeight(k, v);
            U.closeSheet();
            U.toast('体重已记录');
            render();
          }
        });
      },
    });
  }

              }
            });
          });
        });
        pts.sort((a, b) => a.k.localeCompare(b.k));
        body = pts.length > 1 ? `
          <div class="card">
            <div style="font-size:12px;font-weight:700;color:var(--t3);margin-bottom:10px">估算 1RM 变化</div>

                <span class="muted">${r} RM</span>
                <span class="v">${w || '--'}<span class="u"> kg</span></span>

          <span class="tag red">${D.MUSCLES[ex.primary].name}</span>
          <span class="tag">${esc(ex.equip)}</span>
        </div>
        <div class="seg" style="margin-top:12px;margin-bottom:14px">
          <button class="${tab === 'about' ? 'on' : ''}" data-etab="about">关于</button>
          <button class="${tab === 'history' ? 'on' : ''}" data-etab="history">历史记录</button>
          <button class="${tab === 'progress' ? 'on' : ''}" data-etab="progress">进度</button>
          <button class="${tab === 'record' ? 'on' : ''}" data-etab="record">纪录</button>
        </div>
        ${body}
        <button class="btn" style="margin-top:18px" id="logThis">记录这组训练</button>
      `;
    };

    /* 3D 场景实例（切换 tab 时销毁重建，避免泄漏） */
    let viewer3d = null;
    let muscleViewer = null;

    const dispose3d = () => {
      if (viewer3d) { try { viewer3d.dispose(); } catch (e) {} viewer3d = null; }
      if (muscleViewer) { try { muscleViewer.dispose(); } catch (e) {} muscleViewer = null; }
    };

    const init3d = () => {
      if (tab !== 'about') return;
      const wrap = document.getElementById('ex3d');
      if (!wrap) return;

      global.Norg3D.ensureThree().then(() => {
        // 弹层可能在异步期间被关掉
        if (!document.getElementById('ex3d')) return;

        /* ---- 动作动画视图 ---- */
        try {
          viewer3d = global.Norg3D.createViewer(wrap, { height: wrap.clientHeight || 240 });
          const animKey = global.Norg3D.pickAnim(ex.name);
          viewer3d.setAnim(animKey);
          // 主肌群亮（红心蓝边）
          viewer3d.highlight(ex.muscles.slice(0, 2));
        } catch (e) {
          const fb = document.getElementById('ex3dFallback');
          if (fb) fb.style.display = 'grid';
          console.warn('3D 动作视图初始化失败', e);
        }

        /* ---- 目标肌群静态视图 ---- */
        const mw = document.getElementById('exMuscle3d');
        if (mw) {
          try {
            muscleViewer = global.Norg3D.createViewer(mw, { height: 300, autoRotate: true });
            muscleViewer.setAnim('idle');
            muscleViewer.setView('front');
            // 主肌群亮，协同肌群稍暗
            const heat = {};
            ex.muscles.forEach((k, i) => { heat[k] = ex.muscles.length - i; });
            muscleViewer.heatmap(heat);
          } catch (e) {
            mw.innerHTML = `<div style="display:grid;place-items:center;height:100%;color:var(--t4);font-size:12px">3D 加载失败</div>`;
          }
        }
      }).catch(() => {
        const fb = document.getElementById('ex3dFallback');
        if (fb) fb.style.display = 'grid';
      });
    };

    const rerender = () => {
      dispose3d();
      U.openSheet(ex.name, build(), { after: rerender });
      setTimeout(init3d, 60);
    };

    U.openSheet(ex.name, build(), {
      after: () => {
        $('#sheetBody').addEventListener('click', e => {
          const tb = e.target.closest('[data-etab]');
          if (tb) {
            tab = tb.dataset.etab;
            rerender();
            return;
          }
          // 3D 控制
          if (e.target.closest('#btn3dToggle')) {
            const btn = e.target.closest('#btn3dToggle');
            const paused = btn.dataset.paused === '1';
            if (viewer3d) viewer3d.setPlaying(paused);
            btn.dataset.paused = paused ? '0' : '1';
            btn.textContent = paused ? '暂停' : '播放';
            return;
          }
          const vb = e.target.closest('[data-view]');
          if (vb) {
            if (viewer3d) viewer3d.setView(vb.dataset.view);
            $$('[data-view]').forEach(b => {
              b.style.background = b === vb ? 'rgba(255,59,48,.85)' : 'rgba(0,0,0,.55)';
            });
            return;
          }
          if (e.target.closest('#logThis')) openQuickLog(ex);
        });
        setTimeout(init3d, 80);
      },
      onClose: dispose3d,
    });
  }

  /* ---------- 快速记一组 ---------- */
  function openQuickLog(ex) {
    const last = (() => {
      const arr = [];
      Object.entries(S.state.days).forEach(([dk, dd]) => {
        (dd.workouts || []).forEach(w => (w.exercises || []).forEach(e2 => {
          if (e2.exId === ex.id) arr.push({ dk, sets: e2.sets });
        }));
      });
      arr.sort((a, b) => b.dk.localeCompare(a.dk));
      return arr[0];
    })();
    const lastSet = last && last.sets.length ? last.sets[last.sets.length - 1] : { weight: 20, reps: 10 };

    const html = `
      <div class="tiny muted" style="margin-bottom:12px;font-weight:700">${esc(ex.name)} · ${D.MUSCLES[ex.primary].name}</div>
      <div class="row-in">
        <div class="field"><label>重量 (kg)</label>
          <input class="input" id="qw" type="number" inputmode="decimal" step="0.5" value="${lastSet.weight}" style="text-align:center;font-size:20px;font-weight:800;height:54px" /></div>
        <div class="field"><label>次数</label>
          <input class="input" id="qr" type="number" inputmode="numeric" value="${lastSet.reps}" style="text-align:center;font-size:20px;font-weight:800;height:54px" /></div>
      </div>
      <div class="card" style="margin-bottom:16px" id="qprev">${qlPrev(lastSet.weight, lastSet.reps)}</div>
      <button class="btn" id="doQ">保存这组</button>
    `;
    U.openSheet('记录一组', html, {
      after: () => {
        const w = $('#qw'), r = $('#qr');
        const upd = () => { $('#qprev').innerHTML = qlPrev(Number(w.value), Number(r.value)); };
        w.addEventListener('input', upd); r.addEventListener('input', upd);
        $('#sheetBody').addEventListener('click', e => {
          if (!e.target.closest('#doQ')) return;
          const weight = Number(w.value), reps = Number(r.value);
          if (!weight || !reps) { U.toast('请填写重量与次数'); return; }

          const k = S.todayKey();
          const d = S.day(k);
          if (!d.workouts.length) {
            d.workouts.push({ id: S.uid(), name: '自由训练', ts: Date.now(), dur: 45, exercises: [] });
          }
          const w0 = d.workouts[d.workouts.length - 1];
          let e0 = w0.exercises.find(x => x.exId === ex.id);
          if (!e0) { e0 = { exId: ex.id, name: ex.name, sets: [] }; w0.exercises.push(e0); }
          e0.sets.push({ id: S.uid(), weight, reps, done: true });

          // PR
          const rm = S.e1rm(weight, reps);
          const old = S.state.prs[ex.id];
          if (!old || rm > old.e1rm) {
            S.state.prs[ex.id] = { weight, reps, e1rm: rm, date: k };
            U.toast(`🎉 新纪录！估算 1RM ${rm} kg`);
          } else {
            U.toast(`已记录 ${weight}kg × ${reps}`);
          }
          S.bumpStreak(k);
          S.save();
          S.checkAchievements();
          U.closeSheet();
          render();
        });
      },
    });
  }

  function qlPrev(w, r) {
    const rm = S.e1rm(w, r);
    const vol = Math.round(w * r);
    return `<div style="display:flex">
      <div><div class="tiny muted">估算 1RM</div><div style="font-size:20px;font-weight:800">${rm || '--'}<span style="font-size:11px;color:var(--t3)"> kg</span></div></div>
      <div style="margin-left:auto;text-align:right"><div class="tiny muted">本组容量</div><div style="font-size:20px;font-weight:800">${vol}<span style="font-size:11px;color:var(--t3)"> kg</span></div></div>
    </div>`;
  }

  /* ==========================================================

     ========================================================== */
  function openWorkoutDetail(id) {
    const k = S.todayKey();
    const d = S.day(k);
    const w = d.workouts.find(x => x.id === id);
    if (!w) return;

    const html = `
      <div style="display:flex;gap:14px;margin-bottom:16px">
        <div><div class="tiny muted">容量</div><div style="font-size:22px;font-weight:800">${S.workoutVolume(w).toLocaleString()}<span style="font-size:11px;color:var(--t3)"> kg</span></div></div>
        <div><div class="tiny muted">组数</div><div style="font-size:22px;font-weight:800">${S.workoutSets(w)}</div></div>
        <div><div class="tiny muted">时长</div><div style="font-size:22px;font-weight:800">${w.dur}<span style="font-size:11px;color:var(--t3)"> 分</span></div></div>
      </div>
      ${w.exercises.map(ex => {
        const meta = D.EXERCISES.find(e => e.id === ex.exId);
        return `<div class="card" style="margin-bottom:11px;padding:13px 15px">
          <div style="display:flex;align-items:center;margin-bottom:8px">
            <div style="font-size:14px;font-weight:800">${esc(ex.name)}</div>
            <span class="tag" style="margin-left:auto;font-size:10px">${meta ? D.MUSCLES[meta.primary].name : ''}</span>
          </div>
          ${ex.sets.map((s, i) => `<div class="set-line">
            <span class="idx">${i + 1}</span>
            <span class="v">${s.weight}<span class="u"> kg</span></span>
            <span class="v">${s.reps}<span class="u"> 次</span></span>
            <span class="muted">${S.e1rm(s.weight, s.reps)}<span class="u"> 1RM</span></span>
            <span class="del" data-rmset="${ex.exId}|${s.id}">${ICON.trash}</span>
          </div>`).join('')}
        </div>`;
      }).join('')}
      <button class="btn ghost" id="addExToW" style="margin-top:6px">添加动作</button>
      <button class="btn" id="finishW" style="margin-top:10px">完成训练</button>
    `;

    U.openSheet(w.name, html, {
      after: () => {
        $('#sheetBody').addEventListener('click', e => {
          const rm = e.target.closest('[data-rmset]');
          if (rm) {
            const [exId, setId] = rm.dataset.rmset.split('|');
            const ex = w.exercises.find(x => x.exId === exId);
            if (ex) ex.sets = ex.sets.filter(s => s.id !== setId);
            S.save();
            U.closeSheet();
            openWorkoutDetail(id);
            render();
            return;
          }
          if (e.target.closest('#addExToW')) { openPickExercise(w); return; }
          if (e.target.closest('#finishW')) {
            U.closeSheet();
            U.toast('训练完成 💪');
            S.checkAchievements();
            render();
          }
        });
      },
    });
  }

    const html = prs.length ? prs.map(({ ex, pr }) => `
      <div class="row" data-ex="${ex.id}">

          <div class="s">${pr.weight}kg × ${pr.reps} · ${pr.date}</div></div>
        <div class="r"><div class="n">${pr.e1rm}</div><div class="u">估算1RM</div></div>
      </div>`).join('') : `<div class="empty">还没有个人纪录，去练一组吧</div>`;
    U.openSheet('个人纪录', html, {
      after: () => {
        $('#sheetBody').addEventListener('click', e => {
          const ex = e.target.closest('[data-ex]');
          if (ex) { U.closeSheet(); setTimeout(() => openExercise(ex.dataset.ex), 200); }
        });
      },
    });
  }

  function openAllExercises() {
    const html = `
      <div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:10px">
        ${Object.entries(D.MUSCLES).map(([k, m]) => `<button class="tag" data-mf="${k}" style="white-space:nowrap">${m.name}</button>`).join('')}
      </div>
      <div id="exlist" style="max-height:58vh;overflow-y:auto">
        ${exRows(D.EXERCISES)}
      </div>`;
    U.openSheet('动作库', html, {
      after: () => {
        $('#sheetBody').addEventListener('click', e => {
          const mf = e.target.closest('[data-mf]');
          if (mf) { $('#exlist').innerHTML = exRows(D.EXERCISES.filter(x => x.primary === mf.dataset.mf)); return; }
          const ex = e.target.closest('[data-ex2]');
          if (ex) { U.closeSheet(); setTimeout(() => openExercise(ex.dataset.ex2), 200); }
        });
      },
    });
  }
  function exRows(list) {
    return list.map(ex => `
      <div class="row" data-ex2="${ex.id}" style="margin-bottom:7px">
        <div class="mid"><div class="t">${esc(ex.name)}</div>
          <div class="s">${D.MUSCLES[ex.primary].name} · ${esc(ex.equip)}</div></div>
        ${ICON.arrow}
      </div>`).join('');
  }

  function openPlan() {
    const t = S.calcTargets();
    const html = `
      <div class="card glow" style="margin-bottom:14px">
        <div style="font-size:15px;font-weight:800;margin-bottom:6px">减脂期 · 标准方案</div>
        <div class="tiny muted">基于你的 TDEE ${t.tdee} kcal 自动生成</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px">
          <div><div class="tiny muted">热量</div><div style="font-size:19px;font-weight:800">${t.kcal}</div></div>
          <div><div class="tiny muted">蛋白</div><div style="font-size:19px;font-weight:800;color:var(--purple)">${t.protein}g</div></div>
          <div><div class="tiny muted">碳水</div><div style="font-size:19px;font-weight:800;color:var(--green)">${t.carb}g</div></div>
        </div>
      </div>
      <div class="sec-title" style="margin:0 2px 10px"><span class="dot"></span>训练安排</div>
      ${[
        ['周一', '推日 · 胸肩三头', '卧推 4×6-8 · 上斜 3×8-10 · 侧平举 3×12-15 · 绳索下压 3×12'],
        ['周二', '有氧 + 核心', '快走 30 分钟 · 卷腹 3×15 · 平板支撑 3×45s'],
        ['周三', '拉日 · 背二头', '高位下拉 4×8-10 · 划船 4×8 · 面拉 3×15 · 弯举 3×12'],
        ['周四', '休息', '散步 6000 步 · 拉伸 10 分钟'],
        ['周五', '腿日 · 下肢', '深蹲 4×6-8 · RDL 3×8 · 腿举 3×10 · 提踵 4×15'],
        ['周六', '上肢综合', '肩推 3×8 · 侧平举 3×15 · 引体 3×力竭 · 三头 3×12'],
        ['周日', '休息', '恢复日，保证 7.5 小时睡眠'],
      ].map(([d, n, s]) => `
        <div class="card" style="margin-bottom:9px;padding:13px 15px">
          <div style="display:flex;align-items:center">
            <span style="font-size:12px;font-weight:800;color:var(--red);width:34px">${d}</span>
            <span style="font-size:13.5px;font-weight:800">${n}</span>
          </div>
          <div class="tiny muted" style="margin-top:6px;line-height:1.6;padding-left:34px">${s}</div>
        </div>`).join('')}`;
    U.openSheet('官方计划', html);
  }

  function openRank() {
    const vol = Object.values(S.state.days).reduce((a, dd) =>
      a + (dd.workouts || []).reduce((b, w) => b + S.workoutVolume(w), 0), 0);
    const tiers = [
      [0, '青铜', '刚开始的人'],
      [5000, '白银', '建立习惯'],
      [20000, '黄金', '稳定训练'],
      [50000, '铂金', '进阶力量'],
      [100000, '钻石', '硬核选手'],
      [200000, '王者', '天花板'],
    ];
    const cur = tiers.filter(t => vol >= t[0]).pop() || tiers[0];
    const next = tiers.find(t => vol < t[0]);
    const pct = next ? (vol - cur[0]) / (next[0] - cur[0]) : 1;

    const html = `
      <div class="card glow" style="text-align:center;margin-bottom:16px">
        <div style="font-size:44px;line-height:1">🏅</div>
        <div style="font-size:24px;font-weight:800;margin-top:8px">${cur[1]}</div>
        <div class="tiny muted" style="margin-top:4px">${cur[2]}</div>
        <div class="prog" style="margin-top:16px"><i style="width:${Math.min(100, pct * 100)}%"></i></div>
        <div class="tiny muted" style="margin-top:8px">
          ${next ? `再练 ${(next[0] - vol).toLocaleString()} kg 容量升到 ${next[1]}` : '已达最高段位'}
        </div>
      </div>
      ${tiers.map(([v, n, d], i) => `
        <div class="row" style="opacity:${vol >= v ? 1 : .4};margin-bottom:7px">
          <div class="ico">${['🥉', '🥈', '🥇', '💎', '💠', '👑'][i]}</div>
          <div class="mid"><div class="t">${n}</div><div class="s">${d}</div></div>
          <div class="r"><div class="n" style="font-size:12px">${v.toLocaleString()}</div><div class="u">kg</div></div>
        </div>`).join('')}`;
    U.openSheet('段位', html);
  }

  /* ==========================================================
     导入导出
     ========================================================== */
  function doExport() {
    const txt = S.exportJSON();
    const blob = new Blob([txt], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `norg-backup-${S.todayKey()}.json`;
    a.click();
    U.toast('已导出备份文件');
  }

  function doImport() {
    const html = `
      <div class="tiny muted" style="margin-bottom:12px">粘贴之前导出的 JSON 内容，或选择文件。</div>
      <textarea class="input" id="impTxt" style="height:160px;padding:12px;resize:none;font-size:12px;font-family:var(--mono)" placeholder='{"profile":{...}}'></textarea>
      <input type="file" id="impFile" accept=".json" style="margin:12px 0;font-size:12px;color:var(--t3)" />
      <button class="btn" id="doImp" style="margin-top:10px">导入</button>`;
    U.openSheet('导入数据', html, {
      after: () => {
        const f = $('#impFile');
        f.addEventListener('change', () => {
          const file = f.files[0];
          if (!file) return;
          const r = new FileReader();
          r.onload = () => { $('#impTxt').value = r.result; };
          r.readAsText(file);
        });
        $('#sheetBody').addEventListener('click', e => {
          if (!e.target.closest('#doImp')) return;
          try {
            S.importJSON($('#impTxt').value);
            U.closeSheet();
            U.toast('导入成功');
            render();
          } catch (err) { U.toast('导入失败：' + err.message); }
        });
      },
    });
  }

  function doReset() {
    const html = `
      <div class="tiny muted" style="line-height:1.7;margin-bottom:16px">
        将清空全部饮食、训练、体重记录并恢复演示数据。此操作不可撤销。
      </div>
      <button class="btn" id="doR" style="background:linear-gradient(135deg,#ff5a4e,#8e0f16)">确认清空</button>`;
    U.openSheet('清空数据', html, {
      after: () => {
        $('#sheetBody').addEventListener('click', e => {
          if (!e.target.closest('#doR')) return;
          S.reset();
          U.closeSheet();
          U.toast('已重置');
          render();
        });
      },
    });
  }

  /* ==========================================================
     启动
     ========================================================== */
  function boot() {
    S.load();
    S.applyTheme(S.state.profile.theme || 'crimson');
    S.checkAchievements();
    bindGlobal();
    render();
    // 单文件版不注册 Service Worker（file:// 场景下无意义）
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  global.NorgApp = { render, openAddMeal, openExercise };
})(window);

</script>
</body>
</html>
