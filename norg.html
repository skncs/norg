<style>
/* ============================================================
   Norg · 设计系统
   深色 + 猩红主色，卡片圆角 20-24px，光晕质感
   ============================================================ */

:root{
  --bg:#080607;
  --bg-1:#0e0a0c;
  --card:#141011;
  --card-2:#1a1416;
  --card-3:#221a1d;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.12);

  --red:#ff3b30;
  --red-2:#e01b24;
  --red-3:#8e0f16;
  --red-soft:rgba(255,59,48,.14);

  --green:#3ddc84;
  --purple:#a78bfa;
  --yellow:#e8ff4f;
  --cyan:#4fd1e0;
  --orange:#ff9f43;

  --t1:#ffffff;
  --t2:rgba(255,255,255,.72);
  --t3:rgba(255,255,255,.44);
  --t4:rgba(255,255,255,.26);

  --r-s:12px;
  --r-m:18px;
  --r-l:24px;
  --r-xl:30px;

  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC",
          "Helvetica Neue", "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--t1);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}
/* hidden 必须压过组件自身的 display */
[hidden]{display:none !important;}

/* 内联图标统一尺寸，防止无宽高的 svg 撑满容器 */
.mini .h svg{width:14px;height:14px;flex:0 0 auto;color:var(--t4);}
.row > svg{width:16px;height:16px;flex:0 0 auto;color:var(--t4);}
.kv svg{width:16px;height:16px;color:var(--t4);}
.tag svg{width:13px;height:13px;}
.icon-btn svg{width:17px;height:17px;}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
input,select,textarea{font-family:inherit;color:inherit;}
::-webkit-scrollbar{width:0;height:0;}

/* ---------- 外壳 ---------- */
#app{
  max-width:520px;margin:0 auto;min-height:100%;
  display:flex;flex-direction:column;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(224,27,36,.22), transparent 62%),
    var(--bg);
  position:relative;
}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(var(--safe-t) + 14px) 18px 12px;
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  background:linear-gradient(180deg, rgba(8,6,7,.92), rgba(8,6,7,.62));
}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto;}
.brand-mark{width:26px;height:26px;filter:drop-shadow(0 0 10px rgba(255,59,48,.55));}
.brand-name{font-size:22px;font-weight:800;letter-spacing:-.5px;}
.top-actions{display:flex;align-items:center;gap:8px;}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  height:29px;padding:0 13px;border-radius:999px;
  font-size:12.5px;font-weight:700;letter-spacing:.2px;
  background:rgba(255,255,255,.09);
  border:1px solid var(--line-2);
}
.pill-pro{
  background:linear-gradient(135deg,#fff,#e6e6e6);
  color:#111;border-color:transparent;
  box-shadow:0 2px 10px rgba(255,255,255,.18);
}
.pill-streak{color:var(--t2);}
.pill-streak svg{color:var(--red);}

/* ---------- 视图 ---------- */
.view{
  flex:1;
  padding:4px 14px calc(104px + var(--safe-b));
  animation:viewIn .28s cubic-bezier(.2,.8,.25,1);
}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--safe-b) + 10px);
  width:min(492px, calc(100% - 28px));
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:8px 6px;
  border-radius:22px;
  background:rgba(22,16,18,.82);
  border:1px solid var(--line-2);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:0 12px 40px rgba(0,0,0,.6);
  z-index:50;
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 0 5px;border-radius:16px;
  color:var(--t4);transition:color .18s, background .18s;
}
.tab svg{width:22px;height:22px;}
.tab span{font-size:10px;font-weight:600;letter-spacing:.2px;}
.tab.is-active{
  color:var(--red);
  background:radial-gradient(60% 100% at 50% 120%, rgba(255,59,48,.22), transparent 70%);
}

/* ---------- 通用卡片 ---------- */
.card{
  background:linear-gradient(168deg, var(--card-2), var(--card));
  border:1px solid var(--line);
  border-radius:var(--r-l);
  padding:16px;
  position:relative;
  overflow:hidden;
}
.card.glow::after{
  content:"";position:absolute;inset:auto -30% -60% -30%;height:70%;
  background:radial-gradient(50% 100% at 50% 100%, rgba(255,59,48,.30), transparent 70%);
  pointer-events:none;
}
.sec-title{
  display:flex;align-items:center;gap:8px;
  margin:22px 4px 12px;font-size:17px;font-weight:800;letter-spacing:-.2px;
}
.sec-title .dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 9px var(--red);}
.sec-title .more{margin-left:auto;font-size:13px;font-weight:600;color:var(--t3);}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px;}
.grid2 > *{min-width:0;overflow:hidden;}
.muted{color:var(--t3);}
.small{font-size:12px;}
.tiny{font-size:11px;}
.center{text-align:center;}

/* ---------- 今日：模式切换 ---------- */
.mode-seg{
  display:inline-flex;gap:4px;padding:4px;border-radius:999px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  flex:0 0 auto;
}
.mode-seg button{
  padding:6px 15px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--t3);
  transition:.2s;white-space:nowrap;
}
.mode-seg button.on{
  background:linear-gradient(135deg,#ff5a4e,#d3141d);
  color:#fff;box-shadow:0 4px 16px rgba(224,27,36,.45);
}

/* ---------- 今日：主数据卡 ---------- */
.hero{
  margin-top:14px;
  border-radius:var(--r-xl);
  padding:18px 18px 20px;
  background:
    radial-gradient(120% 90% at 50% 108%, rgba(255,59,48,.34), transparent 62%),
    linear-gradient(170deg, #241a1c, #120d0e 70%);
  border:1px solid rgba(255,90,78,.22);
  box-shadow:0 18px 48px -18px rgba(224,27,36,.55), inset 0 1px 0 rgba(255,255,255,.06);
  position:relative;overflow:hidden;
}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.hero-kcal{display:flex;align-items:baseline;gap:7px;}
.hero-kcal b{font-size:46px;line-height:1;font-weight:800;letter-spacing:-2.2px;}
.hero-kcal i{font-style:normal;font-size:14px;font-weight:700;color:var(--t2);}
.hero-sub{margin-top:7px;font-size:12.5px;color:var(--t3);font-weight:600;}
.hero-btns{display:flex;gap:8px;}
.round-btn{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.08);
  border:1px solid var(--line-2);
  color:var(--t2);transition:.16s;
}
.round-btn:active{transform:scale(.93);background:rgba(255,255,255,.16);}
.round-btn svg{width:18px;height:18px;}

.bar-wrap{display:flex;align-items:center;gap:12px;margin-top:16px;}
.bar{
  flex:1;height:30px;border-radius:999px;
  background:rgba(255,255,255,.08);
  overflow:hidden;position:relative;
  border:1px solid rgba(255,255,255,.06);
}
.bar-fill{
  height:100%;border-radius:999px;
  background:repeating-linear-gradient(115deg,#ff6a5e 0 9px,#f5352b 9px 18px);
  box-shadow:0 0 22px rgba(255,59,48,.6);
  transition:width .55s cubic-bezier(.2,.8,.25,1);
}
.bar-pct{font-size:17px;font-weight:800;min-width:46px;text-align:right;}

.macros{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;gap:6px;}
.macro{text-align:left;}
.macro .k{font-size:11.5px;color:var(--t3);font-weight:600;}
.macro .v{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.4px;}
.macro .v span{font-size:11.5px;font-weight:600;color:var(--t3);margin-left:2px;}
.goal-arc{
  margin-top:14px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.07);
  text-align:center;font-size:12.5px;color:var(--t3);font-weight:600;
}
.goal-arc b{color:var(--t1);font-weight:800;font-size:14px;}

/* ---------- 快捷入口横排 ---------- */
.quick-row{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  gap:2px;margin-top:16px;
}
.quick{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 2px;border-radius:16px;color:var(--t3);
  font-size:10.5px;font-weight:600;transition:.16s;
  min-width:0;overflow:hidden;
}
.quick span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.quick:active{background:rgba(255,255,255,.05);}
.quick svg{width:26px;height:26px;color:rgba(255,255,255,.5);}
.quick.on svg{color:var(--red);filter:drop-shadow(0 0 8px rgba(255,59,48,.6));}
.quick.on{color:var(--t1);}

/* ---------- 数据小卡 ---------- */
.mini{
  background:linear-gradient(168deg,var(--card-2),var(--card));
  border:1px solid var(--line);border-radius:var(--r-m);
  padding:13px 14px;position:relative;overflow:hidden;
}
.mini .h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--t2);font-weight:600;gap:6px;}
.mini .big{font-size:26px;font-weight:800;letter-spacing:-1px;margin-top:6px;line-height:1;white-space:nowrap;overflow:hidden;}
.mini .big span{font-size:12px;font-weight:600;color:var(--t3);margin-left:3px;letter-spacing:0;}
.mini .foot{font-size:10.5px;color:var(--t4);margin-top:7px;}

/* ---------- 环形（宏量） ---------- */
.ring-cell{display:flex;align-items:center;gap:10px;min-width:0;}
.ring-cell > svg{flex:0 0 auto;}
.legend{display:flex;flex-direction:column;gap:5px;font-size:10.5px;color:var(--t2);font-weight:600;min-width:0;}
.legend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.legend i{display:inline-block;width:3px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;}

/* ---------- 列表 ---------- */
.list{display:flex;flex-direction:column;gap:8px;}
.row{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:var(--r-m);
  background:linear-gradient(168deg,var(--card-2),var(--card));
  border:1px solid var(--line);
}
.row:active{background:var(--card-3);}
.row .ico{
  width:38px;height:38px;border-radius:12px;flex:0 0 auto;
  display:grid;place-items:center;font-size:19px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
}
.row .mid{flex:1;min-width:0;}
.row .t{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .s{font-size:11.5px;color:var(--t3);margin-top:3px;font-weight:600;}
.row .r{text-align:right;flex:0 0 auto;}
.row .r .n{font-size:15px;font-weight:800;}
.row .r .u{font-size:10.5px;color:var(--t4);font-weight:600;}

/* ---------- 输入 ---------- */
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--t3);font-weight:700;margin-bottom:6px;}
.input,.select{
  width:100%;height:46px;padding:0 14px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid var(--line-2);
  font-size:15px;font-weight:600;outline:none;transition:.16s;
}
.input:focus,.select:focus{border-color:rgba(255,59,48,.6);background:rgba(255,59,48,.08);}
.input::placeholder{color:var(--t4);}
.row-in{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.btn{
  width:100%;height:50px;border-radius:16px;font-size:15.5px;font-weight:800;
  background:linear-gradient(135deg,#ff5a4e,#cf1520);
  color:#fff;box-shadow:0 10px 26px -8px rgba(224,27,36,.8);
  transition:.16s;
}
.btn:active{transform:scale(.98);}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--t1);box-shadow:none;border:1px solid var(--line-2);}
.btn.sm{height:40px;font-size:13.5px;border-radius:13px;}

/* ---------- 弹层 ---------- */
.sheet-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.62);
  backdrop-filter:blur(4px);z-index:90;
  animation:fade .2s;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:0;width:min(520px,100%);
  max-height:88vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#191315,#0d090a);
  border-radius:26px 26px 0 0;
  border-top:1px solid var(--line-2);
  z-index:100;
  padding-bottom:var(--safe-b);
  animation:up .3s cubic-bezier(.2,.9,.25,1);
  box-shadow:0 -18px 60px rgba(0,0,0,.7);
}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:9px auto 0;}
.sheet-head{display:flex;align-items:center;padding:12px 18px 8px;}
.sheet-head h3{margin:0;font-size:17px;font-weight:800;flex:1;}
.icon-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--t2);}
.sheet-body{padding:4px 18px 22px;overflow-y:auto;}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);
  transform:translateX(-50%);
  padding:11px 20px;border-radius:14px;
  background:rgba(255,255,255,.96);color:#111;
  font-size:13.5px;font-weight:700;z-index:200;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:up2 .26s;
}
@keyframes up2{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- 动作卡 / 肌群 ---------- */
.ex-hero{
  border-radius:var(--r-l);overflow:hidden;position:relative;
  background:linear-gradient(160deg,#f2f2f0,#d8d8d4);
  aspect-ratio:1.28/1;display:grid;place-items:center;
}
.ex-hero svg{width:88%;height:88%;}
.tag{
  display:inline-block;padding:5px 11px;border-radius:999px;
  font-size:11.5px;font-weight:700;
  background:rgba(255,255,255,.08);border:1px solid var(--line-2);color:var(--t2);
}
.tag.red{background:var(--red-soft);border-color:rgba(255,59,48,.35);color:#ff8b82;}

/* ---------- 训练记录条目 ---------- */
.set-line{
  display:grid;grid-template-columns:26px 1fr 1fr 1fr 30px;
  gap:6px;align-items:center;
  font-size:13px;font-weight:600;
  padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.05);
}
.set-line .idx{color:var(--t4);font-weight:800;font-size:12px;}
.set-line .v{font-weight:800;}
.set-line .u{font-size:10.5px;color:var(--t4);font-weight:600;}
.set-line .del{color:var(--t4);text-align:right;}

/* ---------- 空状态 ---------- */
.empty{
  text-align:center;padding:34px 20px;color:var(--t4);
  font-size:13px;font-weight:600;
}
.empty svg{width:44px;height:44px;opacity:.4;margin-bottom:10px;}

/* ---------- 进度条（目标） ---------- */
.prog{height:7px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff6a5e,#e01b24);transition:width .5s;}

/* ---------- 分段 tab（动作详情） ---------- */
.seg{
  display:flex;gap:16px;overflow-x:auto;padding:2px 2px 0;
  border-bottom:1px solid var(--line);
}
.seg button{
  padding:10px 0 11px;font-size:13.5px;font-weight:700;color:var(--t3);
  border-bottom:2px solid transparent;white-space:nowrap;transition:.18s;
}
.seg button.on{color:var(--t1);border-bottom-color:var(--red);}

/* ---------- 头像 / 设置 ---------- */
.avatar{
  width:60px;height:60px;border-radius:50%;
  background:linear-gradient(135deg,#ff5a4e,#8e0f16);
  display:grid;place-items:center;font-size:24px;font-weight:800;
  box-shadow:0 8px 24px -6px rgba(224,27,36,.8);
}
.kv{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.05);
  font-size:14px;font-weight:600;
}
.kv:last-child{border-bottom:0;}
.kv .k{color:var(--t2);}
.kv .v{color:var(--t1);font-weight:800;}

/* ---------- 数字滚动 ---------- */
.num{font-variant-numeric:tabular-nums;}

/* ---------- 水波纹按钮 ---------- */
.fab{
  position:fixed;right:calc(50% - 246px);
  bottom:calc(var(--safe-b) + 92px);
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#ff5a4e,#cf1520);
  display:grid;place-items:center;z-index:60;
  box-shadow:0 12px 30px -6px rgba(224,27,36,.9);
  transition:.16s;
}
.fab:active{transform:scale(.92);}
.fab svg{width:24px;height:24px;}
@media(max-width:540px){.fab{right:20px;}}

/* ---------- 图表容器 ---------- */
.chart{width:100%;display:block;overflow:visible;}
.chart text{font-family:var(--font);}

/* ---------- 训练热力 ---------- */
.muscle-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

</head>

  /* ---------- 默认档案 ---------- */
  function defaultState() {
    return {
      v: 1,
      profile: {
        name: '训练者',
        sex: 'male',
        age: 25,
        height: 175,
        weight: 70,
        targetWeight: 65,
        activity: 1.375,      // 活动系数
        goalRate: -0.5,       // kg / 周
        goalType: 'cut',      // cut / maintain / bulk
        proteinPerKg: 2.0,
        fatPct: 0.25,
        theme: 'crimson',
        unit: 'kg',
      },
      days: {},        // { '2026-11-12': { meals:[], workouts:[], weight:null, water:0, sleep:null, steps:0 } }
      prs: {},         // { exerciseId: { weight, reps, e1rm, date } }
      streak: 0,
      lastLog: null,
      achievements: [],
      customFoods: [],
    };
  }

  /* ---------- 读写 ---------- */
  let S = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) { S = defaultState(); seed(); return S; }
      S = JSON.parse(raw);
      // 迁移/补全
      const d = defaultState();
      S.profile = Object.assign({}, d.profile, S.profile || {});
      S.days = S.days || {};
      S.prs = S.prs || {};
      S.achievements = S.achievements || [];
      S.customFoods = S.customFoods || [];
      return S;
    } catch (e) {
      S = defaultState(); seed(); return S;
    }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  /* ---------- 首次体验：注入 30 天演示数据 ---------- */
  function seed() {
    const t = todayKey();
    const foods = global.NORG_DATA.FOODS;
    const find = n => foods.find(f => f.name === n);

    /* 1) 30 天体重曲线：从 87.6 缓慢降到 85.0，带自然波动 */
    const w0 = 87.6, w1 = 85.0;
    for (let i = 29; i >= 0; i--) {
      const k = dayOffset(t, -i);
      if (!S.days[k]) S.days[k] = { meals: [], workouts: [], weight: null, water: 0, sleep: null, steps: 0 };
      const prog = (29 - i) / 29;
      const base = w0 + (w1 - w0) * prog;
      // 每 7 天一个平台期，加 ±0.25 抖动
      const wobble = Math.sin((29 - i) / 7 * Math.PI * 2) * 0.22 + Math.sin((29 - i) * 1.7) * 0.1;
      S.days[k].weight = round(base + wobble, 1);
      S.days[k].sleep = round(6.2 + Math.abs(Math.sin(i * 0.9)) * 1.8, 1);
      S.days[k].steps = 5500 + Math.round(Math.abs(Math.sin(i * 1.3)) * 5000);
      S.days[k].water = 1500 + Math.round(Math.abs(Math.cos(i * 0.8)) * 1200);
    }
    // 今天体重固定为 85.0
    S.days[t].weight = 85.0;

    /* 2) 最近 7 天的饮食记录 */
    const plan = [
      { off: -6, meals: [['燕麦片', 60], ['牛奶', 250], ['鸡蛋', 100], ['鸡胸肉', 180], ['米饭', 250], ['西兰花', 200], ['三文鱼', 130]] },
      { off: -5, meals: [['全麦面包', 70], ['鸡蛋', 100], ['鸡胸肉', 200], ['糙米饭', 250], ['菠菜', 150], ['牛肉丸', 100]] },
      { off: -4, meals: [['燕麦片', 60], ['乳清蛋白粉', 30], ['米饭', 200], ['牛里脊', 180], ['黄瓜', 150], ['苹果', 200]] },
      { off: -3, meals: [['馒头', 100], ['鸡蛋', 100], ['鸡腿肉', 200], ['红薯', 200], ['生菜', 100], ['无糖希腊酸奶', 150]] },
      { off: -2, meals: [['燕麦片', 50], ['牛奶', 250], ['猪里脊', 180], ['意大利面', 250], ['番茄', 150], ['香蕉', 120]] },
      { off: -1, meals: [['全麦面包', 60], ['鸡蛋', 100], ['鸡胸肉', 200], ['糙米饭', 220], ['西兰花', 180], ['蓝莓', 100]] },
      { off: 0,  meals: [['燕麦片', 50], ['牛奶', 250], ['鸡蛋', 50], ['鸡胸肉', 200], ['米饭', 250], ['西兰花', 200]] },
    ];

    plan.forEach(p => {
      const k = dayOffset(t, p.off);
      const meals = [];
      const slots = ['早餐', '早餐', '午餐', '午餐', '晚餐', '加餐', '加餐'];
      p.meals.forEach((m, i) => {
        const f = find(m[0]);
        if (!f) return;
        const grams = m[1];
        meals.push({
          id: uid(),
          foodId: f.id,
          name: f.name,
          grams,
          kcal: round(f.kcal * grams / 100),
          p: round(f.p * grams / 100, 1),
          c: round(f.c * grams / 100, 1),
          f: round(f.f * grams / 100, 1),
          slot: slots[i] || '加餐',
          ts: Date.now() - (6 - p.off) * 864e5,
        });
      });
      S.days[k].meals = meals;
    });

    /* 3) 训练记录：最近 3 次 */
    [[-6, 'push'], [-3, 'pull'], [-1, 'legs']].forEach(([off, kind]) => {
      const k = dayOffset(t, off);
      S.days[k].workouts = [makeWorkout(kind)];
    });
    // 今天也给一次训练，让今日训练页有内容
    S.days[t].workouts = [makeWorkout('push')];

    /* 4) 个人纪录（按动作名定位，避免 ID 漂移） */
    const EXS = global.NORG_DATA.EXERCISES;
    const byName = n => EXS.find(e => e.name === n);
    const prSet = (name, weight, reps, off) => {
      const ex = byName(name);
      if (!ex) return;
      S.prs[ex.id] = { weight, reps, e1rm: e1rm(weight, reps), date: dayOffset(t, off) };
    };
    prSet('杠铃平板卧推', 80, 5, -1);
    prSet('杠铃深蹲', 110, 6, -1);
    prSet('硬拉', 130, 5, -6);
    prSet('高位下拉', 65, 8, -3);
    prSet('腿举', 150, 8, -6);

    S.streak = 12;
    S.lastLog = t;
    save();
  }

  function makeWorkout(kind) {
    const EX = global.NORG_DATA.EXERCISES;
    const pick = names => names.map(n => EX.find(e => e.name === n)).filter(Boolean);
    const sets = (ex, base, n) => {
      if (!ex) return null;
      const arr = [];
      for (let i = 0; i < n; i++) {
        arr.push({ id: uid(), weight: round(base * (1 + i * 0.025), 1), reps: [10, 9, 8, 7][i] || 8, done: true });
      }
      return { exId: ex.id, name: ex.name, sets: arr };
    };
    let list = [];
    if (kind === 'push') {
      list = [
        sets(EX.find(e => e.name === '杠铃平板卧推'), 70, 4),
        sets(EX.find(e => e.name === '上斜哑铃卧推'), 24, 3),
        sets(EX.find(e => e.name === '哑铃侧平举'), 10, 3),
        sets(EX.find(e => e.name === '绳索下压'), 25, 3),
      ];
    } else if (kind === 'pull') {
      list = [
        sets(EX.find(e => e.name === '高位下拉'), 60, 4),
        sets(EX.find(e => e.name === '杠铃划船'), 65, 4),
        sets(EX.find(e => e.name === '面拉'), 20, 3),
        sets(EX.find(e => e.name === '哑铃交替弯举'), 14, 3),
      ];
    } else {
      list = [
        sets(EX.find(e => e.name === '杠铃深蹲'), 90, 4),
        sets(EX.find(e => e.name === '罗马尼亚硬拉'), 70, 3),
        sets(EX.find(e => e.name === '腿举'), 140, 3),
        sets(EX.find(e => e.name === '站姿提踵'), 50, 4),
      ];
    }
    return {
      id: uid(),
      name: kind === 'push' ? '推日 · 胸肩三头' : kind === 'pull' ? '拉日 · 背二头' : '腿日 · 下肢',
      ts: Date.now(),
      dur: 55 + Math.round(Math.random() * 25),
      exercises: list.filter(Boolean),
    };
  }

  /* ---------- 日数据 ---------- */
  function day(k) {
    k = k || todayKey();
    if (!S.days[k]) S.days[k] = { meals: [], workouts: [], weight: null, water: 0, sleep: null, steps: 0 };
    const d = S.days[k];
    d.meals = d.meals || [];
    d.workouts = d.workouts || [];
    if (d.water == null) d.water = 0;
    if (d.steps == null) d.steps = 0;
    return d;
  }

  /* ---------- 目标计算 ---------- */
  function calcTargets() {
    const p = S.profile;
    // Mifflin-St Jeor
    const bmr = p.sex === 'male'
      ? 10 * p.weight + 6.25 * p.height - 5 * p.age + 5
      : 10 * p.weight + 6.25 * p.height - 5 * p.age - 161;
    const tdee = bmr * p.activity;
    // 1kg 脂肪 ≈ 7700 kcal
    const dailyDelta = (p.goalRate * 7700) / 7;
    let kcal = tdee + dailyDelta;
    kcal = clamp(kcal, bmr * 1.05, tdee * 1.6);
    kcal = Math.round(kcal / 10) * 10;

    const protein = Math.round(p.weight * p.proteinPerKg);
    const fat = Math.round((kcal * p.fatPct) / 9);
    const carb = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));

    return {
      bmr: Math.round(bmr),
      tdee: Math.round(tdee),
      kcal,
      protein, fat, carb,
      delta: Math.round(dailyDelta),
    };
  }

  /* ---------- 日汇总 ---------- */
  function dayTotals(k) {
    const d = day(k);
    const t = { kcal: 0, p: 0, c: 0, f: 0 };
    d.meals.forEach(m => { t.kcal += m.kcal; t.p += m.p; t.c += m.c; t.f += m.f; });
    t.kcal = Math.round(t.kcal);
    t.p = round(t.p, 1); t.c = round(t.c, 1); t.f = round(t.f, 1);
    return t;
  }

  function workoutVolume(w) {
    if (!w || !w.exercises) return 0;
    let v = 0;
    w.exercises.forEach(ex => {
      (ex.sets || []).forEach(s => { if (s.done) v += (s.weight || 0) * (s.reps || 0); });
    });
    return Math.round(v);
  }

  function workoutSets(w) {
    if (!w || !w.exercises) return 0;
    let n = 0;
    w.exercises.forEach(ex => { n += (ex.sets || []).filter(s => s.done).length; });
    return n;
  }

  function dayVolume(k) {
    return day(k).workouts.reduce((a, w) => a + workoutVolume(w), 0);
  }

  /* ---------- e1RM (Epley) ---------- */
  function e1rm(weight, reps) {
    if (!weight || !reps) return 0;
    if (reps === 1) return weight;
    return round(weight * (1 + reps / 30), 1);
  }

  /* ---------- 记录一餐 ---------- */
  function addMeal(k, food, grams, slot) {
    const d = day(k);
    const g = Number(grams) || food.serving;
    const item = {
      id: uid(),
      foodId: food.id,
      name: food.name,
      grams: g,
      kcal: round(food.kcal * g / 100),
      p: round(food.p * g / 100, 1),
      c: round(food.c * g / 100, 1),
      f: round(food.f * g / 100, 1),
      slot: slot || slotOfNow(),
      ts: Date.now(),
    };
    d.meals.push(item);
    bumpStreak(k);
    save();
    return item;
  }

  function removeMeal(k, id) {
    const d = day(k);
    d.meals = d.meals.filter(m => m.id !== id);
    save();
  }

  function slotOfNow() {
    const h = new Date().getHours();
    if (h < 10) return '早餐';
    if (h < 15) return '午餐';
    if (h < 20) return '晚餐';
    return '加餐';
  }

  /* ---------- 记录体重 ---------- */
  function setWeight(k, kg) {
    const d = day(k);
    d.weight = Number(kg);
    S.profile.weight = Number(kg);
    save();
  }

  /* ---------- 连续打卡 ---------- */
  function bumpStreak(k) {
    if (S.lastLog === k) return;
    if (S.lastLog === dayOffset(k, -1)) S.streak += 1;
    else S.streak = 1;
    S.lastLog = k;
  }

  /* ---------- 体重趋势 ---------- */
  function weightSeries(n = 30) {
    const t = todayKey();
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const k = dayOffset(t, -i);
      const d = S.days[k];
      out.push({ k, w: d && d.weight != null ? d.weight : null });
    }
    return out;
  }

  function weightAvg(n = 7) {
    const s = weightSeries(n).filter(x => x.w != null);
    if (!s.length) return null;
    return round(s.reduce((a, x) => a + x.w, 0) / s.length, 1);
  }

  /* ---------- 热量缺口 ---------- */
  function calorieBalance(k) {
    const t = calcTargets();
    const tot = dayTotals(k);
    const vol = dayVolume(k);
    // 训练消耗估算：容量 × 0.0006 ≈ 每 1000kg 容量 6kcal（保守）
    const exerciseBurn = Math.round(vol * 0.0006);
    const intake = tot.kcal;
    const deficit = t.tdee + exerciseBurn - intake;
    return { intake, burn: t.tdee + exerciseBurn, exerciseBurn, deficit };
  }

  /* ---------- 统计聚合 ---------- */
  function weekSeries(n = 7, field) {
    const t = todayKey();
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const k = dayOffset(t, -i);
      out.push({ k, v: field === 'kcal' ? dayTotals(k).kcal : dayVolume(k) });
    }
    return out;
  }

  function totalWorkouts() {
    return Object.values(S.days).reduce((a, d) => a + (d.workouts || []).length, 0);
  }

  function muscleVolume(daysBack = 7) {
    const t = todayKey();
    const acc = {};
    const EX = global.NORG_DATA.EXERCISES;
    for (let i = 0; i < daysBack; i++) {
      const k = dayOffset(t, -i);
      const d = S.days[k];
      if (!d) continue;
      (d.workouts || []).forEach(w => {
        (w.exercises || []).forEach(ex => {
          const meta = EX.find(e => e.id === ex.exId);
          if (!meta) return;
          const vol = (ex.sets || []).filter(s => s.done).reduce((a, s) => a + s.weight * s.reps, 0);
          meta.muscles.forEach(m => { acc[m] = (acc[m] || 0) + vol; });
        });
      });
    }
    return acc;
  }

  /* ---------- 主题 ---------- */
  function applyTheme(id) {
    const th = global.NORG_DATA.THEMES.find(t => t.id === id) || global.NORG_DATA.THEMES[0];
    const r = document.documentElement.style;
    r.setProperty('--red', th.accent);
    r.setProperty('--red-2', th.accent2);
    r.setProperty('--red-soft', hexA(th.accent, .14));
    r.setProperty('--bg', th.bg);
    document.querySelector('meta[name=theme-color]').setAttribute('content', th.bg);
    S.profile.theme = th.id;
    save();
  }

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }

  /* ---------- 成就 ---------- */
  function checkAchievements() {
    const got = new Set(S.achievements);
    const add = id => { if (!got.has(id)) { S.achievements.push(id); return true; } return false; };
    let n = 0;
    if (Object.values(S.days).some(d => (d.meals || []).length)) n += add('first_meal') ? 1 : 0;
    if (S.streak >= 7) n += add('week_streak') ? 1 : 0;
    if (S.streak >= 30) n += add('month_streak') ? 1 : 0;
    if (totalWorkouts() >= 1) n += add('first_workout') ? 1 : 0;
    if (totalWorkouts() >= 10) n += add('ten_workouts') ? 1 : 0;
    if (Object.keys(S.prs).length >= 5) n += add('pr_hunter') ? 1 : 0;
    if (n) save();
    return n;
  }

  /* ---------- 导出 / 导入 ---------- */
  function exportJSON() { return JSON.stringify(S, null, 2); }

  function importJSON(txt) {
    const obj = JSON.parse(txt);
    if (!obj || typeof obj !== 'object' || !obj.profile) throw new Error('格式不正确');
    S = obj;
    save();
  }

  function reset() {
    localStorage.removeItem(KEY);
    S = defaultState();
    save();
  }

  global.NorgStore = {
    load, save, get state() { return S; },
    day, dayTotals, calcTargets, addMeal, removeMeal, setWeight,
    weightSeries, weightAvg, calorieBalance, weekSeries,
    workoutVolume, workoutSets, dayVolume, totalWorkouts, muscleVolume,
    e1rm, applyTheme, checkAchievements, exportJSON, importJSON, reset,
    bumpStreak, slotOfNow,
    todayKey, dayOffset, round, clamp, uid, seed,
  };
})(window);


/* ===== charts.js ===== */
/* ============================================================
   Norg · SVG 图表引擎（零依赖）
   环形 / 弧线仪表 / 折线 / 柱状 / 人体肌群热力图
   ============================================================ */
(function (global) {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const R = global.NorgStore.round;

  /* ---------- 多段环形（宏量） ---------- */
  function ring(opts) {
    const { size = 108, stroke = 11, gap = 7, segments = [], center = '', sub = '' } = opts;
    const cx = size / 2, cy = size / 2;
    const r = (size - stroke) / 2 - 2;
    const C = 2 * Math.PI * r;
    const total = segments.reduce((a, s) => a + s.value, 0) || 1;
    let acc = 0;

    let paths = '';
    segments.forEach(s => {
      const frac = s.value / total;
      const len = Math.max(0, frac * C - gap);
      const dash = `${len} ${C - len}`;
      const rot = -90 + (acc / total) * 360;
      paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
        stroke="${s.color}" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${dash}" transform="rotate(${rot} ${cx} ${cy})"
        style="filter:drop-shadow(0 0 5px ${s.color}66)"/>`;
      acc += s.value;
    });

    return `<svg class="chart" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="${stroke}"/>
      ${paths}
      <text x="${cx}" y="${cy - 2}" text-anchor="middle" fill="#fff"
        font-size="${size * .19}" font-weight="800" letter-spacing="-1">${center}</text>
      <text x="${cx}" y="${cy + size * .13}" text-anchor="middle" fill="rgba(255,255,255,.4)"
        font-size="${size * .085}" font-weight="600">${sub}</text>
    </svg>`;
  }

  /* ---------- 单值进度环 ---------- */
  function progressRing(opts) {
    const { size = 120, stroke = 12, pct = 0, color = '#ff3b30', label = '', sub = '', track = 'rgba(255,255,255,.10)' } = opts;
    const cx = size / 2, cy = size / 2;
    const r = (size - stroke) / 2 - 1;
    const C = 2 * Math.PI * r;
    const v = Math.max(0, Math.min(1, pct));
    const dash = v * C;
    return `<svg class="chart" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${(C - dash).toFixed(1)}"
        transform="rotate(-90 ${cx} ${cy})"
        style="filter:drop-shadow(0 0 7px ${color}77)"/>
      <text x="${cx}" y="${cy + 2}" text-anchor="middle" fill="#fff"
        font-size="${size * .23}" font-weight="800" letter-spacing="-1">${label}</text>
      <text x="${cx}" y="${cy + size * .17}" text-anchor="middle" fill="rgba(255,255,255,.38)"
        font-size="${size * .092}" font-weight="600">${sub}</text>
    </svg>`;
  }

  /* ---------- 半圆仪表（热量缺口） ---------- */
  function gauge(opts) {
    const { w = 200, h = 118, value = 0, min = -2000, max = 2000, label = '', sub = '', color = '#ff3b30' } = opts;
    const cx = w / 2, cy = h - 12;
    const r = Math.min(w / 2 - 12, h - 26);
    const start = Math.PI, end = 2 * Math.PI;
    const arc = (a1, a2, rr) => {
      const x1 = cx + rr * Math.cos(a1), y1 = cy + rr * Math.sin(a1);
      const x2 = cx + rr * Math.cos(a2), y2 = cy + rr * Math.sin(a2);
      const large = Math.abs(a2 - a1) > Math.PI ? 1 : 0;
      return `M${x1} ${y1} A${rr} ${rr} 0 ${large} 1 ${x2} ${y2}`;
    };
    const frac = (value - min) / (max - min);
    const ang = start + Math.PI * Math.max(0, Math.min(1, frac));

    // 刻度
    let ticks = '';
    for (let i = 0; i <= 8; i++) {
      const a = start + (Math.PI * i) / 8;
      const x1 = cx + (r - 9) * Math.cos(a), y1 = cy + (r - 9) * Math.sin(a);
      const x2 = cx + (r - 2) * Math.cos(a), y2 = cy + (r - 2) * Math.sin(a);
      ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(255,255,255,.2)" stroke-width="1.6" stroke-linecap="round"/>`;
    }

    return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
      <path d="${arc(start, end, r)}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="11" stroke-linecap="round"/>
      <path d="${arc(start, ang, r)}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round"
        style="filter:drop-shadow(0 0 9px ${color}aa)"/>
      ${ticks}
      <circle cx="${cx + r * Math.cos(ang)}" cy="${cy + r * Math.sin(ang)}" r="5.5" fill="#fff"/>
      <text x="${cx}" y="${cy - 26}" text-anchor="middle" fill="#fff" font-size="26" font-weight="800" letter-spacing="-1">${label}</text>
      <text x="${cx}" y="${cy - 8}" text-anchor="middle" fill="rgba(255,255,255,.4)" font-size="10.5" font-weight="700">${sub}</text>
    </svg>`;
  }

  /* ---------- 折线（体重趋势） ---------- */
  function line(opts) {
    const { w = 300, h = 74, points = [], color = '#ff3b30', fill = true, dots = true, minPad = 0.8 } = opts;
    const vals = points.map(p => p.w).filter(v => v != null);
    if (!vals.length) {
      return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
        <line x1="0" y1="${h - 6}" x2="${w}" y2="${h - 6}" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
      </svg>`;
    }
    const mn = Math.min(...vals) - minPad, mx = Math.max(...vals) + minPad;
    const span = mx - mn || 1;
    const pad = 5;
    const X = i => pad + (i / Math.max(1, points.length - 1)) * (w - pad * 2);
    const Y = v => h - pad - ((v - mn) / span) * (h - pad * 2);

    let d = '', area = '', started = false, firstX = 0, lastX = 0;
    points.forEach((p, i) => {
      if (p.w == null) return;
      const x = X(i), y = Y(p.w);
      if (!started) { d += `M${x} ${y}`; firstX = x; started = true; }
      else d += ` L${x} ${y}`;
      lastX = x;
    });
    area = `${d} L${lastX} ${h} L${firstX} ${h} Z`;

    let ds = '';
    if (dots) {
      points.forEach((p, i) => {
        if (p.w == null) return;
        ds += `<circle cx="${X(i)}" cy="${Y(p.w)}" r="2.4" fill="${color}"/>`;
      });
      // 最后一个点高亮
      for (let i = points.length - 1; i >= 0; i--) {
        if (points[i].w != null) {
          ds += `<circle cx="${X(i)}" cy="${Y(points[i].w)}" r="4" fill="#fff" stroke="${color}" stroke-width="2.4"/>`;
          break;
        }
      }
    }

    const gid = 'lg' + Math.random().toString(36).slice(2, 6);
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${color}" stop-opacity=".28"/>
        <stop offset="1" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      ${fill ? `<path d="${area}" fill="url(#${gid})"/>` : ''}
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      ${ds}
    </svg>`;
  }

  /* ---------- 柱状（周热量） ---------- */
  function bars(opts) {
    const { w = 300, h = 90, data = [], color = '#ff3b30', goal = null, labels = [] } = opts;
    const mx = Math.max(goal || 0, ...data, 1);
    const n = data.length || 1;
    const gap = 7;
    const bw = (w - gap * (n - 1)) / n;
    let out = '';
    data.forEach((v, i) => {
      const bh = Math.max(2, (v / mx) * (h - 20));
      const x = i * (bw + gap);
      const y = h - 16 - bh;
      const over = goal && v > goal * 1.06;
      out += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="${Math.min(5, bw / 2)}"
        fill="${over ? 'rgba(255,255,255,.28)' : color}" opacity="${v ? .92 : .16}"/>`;
      if (labels[i]) {
        out += `<text x="${x + bw / 2}" y="${h - 3}" text-anchor="middle" fill="rgba(255,255,255,.34)"
          font-size="9" font-weight="700">${labels[i]}</text>`;
      }
    });
    let goalLine = '';
    if (goal) {
      const gy = h - 16 - (goal / mx) * (h - 20);
      goalLine = `<line x1="0" y1="${gy}" x2="${w}" y2="${gy}" stroke="rgba(255,255,255,.3)"
        stroke-width="1" stroke-dasharray="4 4"/>`;
    }
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${goalLine}${out}</svg>`;
  }

    })();
    const wDelta = prevW != null ? S.round(curW - prevW, 1) : null;
    const avg7 = S.weightAvg(7);

    // 缺口
    const bal = S.calorieBalance(k);

    // PR
    const prKeys = Object.keys(S.state.prs);
    const bestPr = prKeys.map(id => {
      const ex = D.EXERCISES.find(e => e.id === id);
      return ex ? { ex, pr: S.state.prs[id] } : null;
    }).filter(Boolean).sort((a, b) => b.pr.e1rm - a.pr.e1rm)[0];

    const isToday = k === S.todayKey();
    const dateLabel = isToday ? '今日' : `${k.slice(5).replace('-', '/')}`;

    return `
    <div style="display:flex;align-items:center;gap:8px;margin:6px 4px 0;">

    ${mode === 'diet' ? dietHero(t, tot, pct, left, pctP, pctC, pctF, k) : trainHero(vol, wsets, d)}

    <div class="quick-row">
      ${quick('学院', ICON.medal, false, 'college')}
      ${quick('成就', ICON.trophy, false, 'achv')}
      ${quick('官方计划', ICON.plan, true, 'plan')}
      ${quick('段位', ICON.rank, false, 'rank')}
      ${quick('主题市场', ICON.store, false, 'themes')}
    </div>

    <div class="sec-title"><span class="dot"></span>身体数据<span class="more" data-act="editweight">编辑</span></div>

    <div class="grid2">
      <div class="mini" data-act="editweight" style="cursor:pointer">
        <div class="h"><span>${isToday ? '今日体重' : '当日体重'}</span>
          <span style="color:var(--red);font-size:15px;line-height:1">+</span></div>
        <div class="big">${curW.toFixed(1)}<span>kg</span></div>
        <div class="foot">
          ${wDelta != null ? `<span style="color:${wDelta <= 0 ? 'var(--green)' : 'var(--orange)'};font-weight:800">${wDelta <= 0 ? '↓' : '↑'}${Math.abs(wDelta).toFixed(1)}</span> 较上次` : '暂无对比'}
        </div>
        <div style="margin-top:8px">${C.line({ w: 150, h: 40, points: ws, dots: false, minPad: .5 })}</div>
        <div class="foot" style="display:flex;justify-content:space-between">
          <span>7 天前</span><span>7 日均 ${avg7 != null ? avg7 : '--'}</span>
        </div>
      </div>

      <div class="mini" style="min-width:0">
        <div class="ring-cell">
          ${C.ring({
            size: 84, stroke: 9, gap: 6,
            segments: [
              { value: tot.c || .001, color: 'var(--green)' },
              { value: tot.p || .001, color: 'var(--purple)' },
              { value: tot.f || .001, color: 'var(--yellow)' },

            center: String(tot.kcal), sub: 'kcal',
          })}
          <div class="legend">
            <span><i style="background:var(--green)"></i>${Math.round(tot.c)}g 碳水</span>
            <span><i style="background:var(--purple)"></i>${Math.round(tot.p)}g 蛋白</span>
            <span><i style="background:var(--yellow)"></i>${Math.round(tot.f)}g 脂肪</span>
          </div>
        </div>
      </div>

      <div class="mini">
        <div class="h"><span>热量缺口</span></div>
        <div style="display:grid;place-items:center;margin-top:2px">
          ${C.gauge({
            w: 168, h: 100, value: bal.deficit, min: -1200, max: 1600,
            label: String(Math.round(bal.deficit)), sub: 'kcal 缺口',
            color: bal.deficit > 0 ? 'var(--red)' : 'var(--orange)',
          })}
        </div>
        <div class="foot center">缺口区 · 摄入 ${bal.intake} / 消耗 ${bal.burn}</div>
      </div>

      <div class="mini" data-act="pr" style="cursor:pointer">
        <div class="h"><span>个人纪录</span>${ICON.arrow}</div>
        ${bestPr ? `
          <div style="margin-top:6px;display:flex;align-items:center;gap:9px">
            <div style="width:44px;height:52px;flex:0 0 auto">${C.bodyMap({ data: { [bestPr.ex.primary]: 1 }, w: 44, h: 52, mode: 'front' })}</div>
            <div>
              <div style="font-size:12.5px;font-weight:700;color:var(--t2)">${esc(bestPr.ex.name)}</div>
              <div style="font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1.15">${bestPr.pr.e1rm}<span style="font-size:11px;color:var(--t3);font-weight:600"> kg</span></div>
              <div class="tiny muted">估算 1RM</div>
            </div>
          </div>` : `<div class="empty" style="padding:20px 0">还没有纪录</div>`}
      </div>

      <div class="mini">
        <div class="h"><span>训练分布</span>${ICON.arrow}</div>
        <div class="muscle-wrap" style="margin-top:6px">
          <div>${C.bodyMap({ data: musc, w: 72, h: 112, mode: 'front' })}</div>
          <div>${C.bodyMap({ data: musc, w: 72, h: 112, mode: 'back' })}</div>
        </div>
        <div class="foot">近 7 天训练量分布</div>
      </div>

      <div class="mini">
        <div class="h"><span>睡眠</span>${ICON.arrow}</div>
        <div class="big">${d.sleep != null ? d.sleep.toFixed(1) : '--'}<span>小时</span></div>
        <div class="foot">昨夜 · 目标 7.5h</div>
        <div style="margin-top:10px">${C.bars({ w: 150, h: 34, data: weekSleep(), color: 'var(--purple)' })}</div>
      </div>

      <div class="mini">
        <div class="h"><span>训练容量</span>${ICON.arrow}</div>
        <div class="big">${vol.toLocaleString()}<span>kg</span></div>
        <div class="foot">${d.workouts.length} 次训练 · ${wsets} 组</div>
      </div>

      <div class="mini">
        <div class="h"><span>活动消耗</span>${ICON.arrow}</div>
        <div class="big">${bal.exerciseBurn}<span>大卡</span></div>
        <div class="foot">来自训练容量估算</div>
      </div>
    </div>

    <div class="sec-title"><span class="dot"></span>本周摄入<span class="more" data-act="goDiet">查看全部</span></div>
    <div class="card">
      ${C.bars({
        w: 300, h: 104,
        data: weekKcal(),
        goal: t.kcal,
        labels: weekLabels(),
        color: 'var(--red)',
      })}
      <div class="tiny muted center" style="margin-top:6px">虚线为目标 ${t.kcal} kcal</div>
    </div>

    <div style="height:8px"></div>
    `;
  };

  function quick(label, icon, on, act) {
    return `<button class="quick ${on ? 'on' : ''}" data-act="${act}">${icon}<span>${label}</span></button>`;
  }

  function dietHero(t, tot, pct, left, pctP, pctC, pctF, k) {
    const d = S.day(k);
    const slots = ['早餐', '午餐', '晚餐', '加餐'];
    const cnt = d.meals.length;
    return `
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-kcal"><b class="num">${tot.kcal.toLocaleString()}</b><i>kcal</i></div>
          <div class="hero-sub">已记录 ${cnt} 餐${left > 0 ? ` · 还可摄入 ${left} kcal` : ` · 已超出 ${Math.abs(left)} kcal`}</div>
        </div>
        <div class="hero-btns">
          <button class="round-btn" data-act="addMeal" title="记录饮食">${ICON.bowl}</button>
          <button class="round-btn" data-act="editweight" title="记录体重">${ICON.edit}</button>
        </div>
      </div>

      <div class="bar-wrap">
        <div class="bar"><div class="bar-fill" style="width:${Math.max(2, pct * 100)}%"></div></div>
        <div class="bar-pct">${Math.round(pct * 100)}%</div>
      </div>

      <div class="macros">
        <div class="macro"><div class="k">蛋白质</div><div class="v">${Math.round(tot.p)}<span>g</span></div>
          <div class="prog" style="margin-top:6px"><i style="width:${pctP * 100}%;background:linear-gradient(90deg,#c4b5fd,#7c3aed)"></i></div></div>
        <div class="macro"><div class="k">碳水</div><div class="v">${Math.round(tot.c)}<span>g</span></div>
          <div class="prog" style="margin-top:6px"><i style="width:${pctC * 100}%;background:linear-gradient(90deg,#6ee7a0,#16a34a)"></i></div></div>
        <div class="macro"><div class="k">脂肪</div><div class="v">${Math.round(tot.f)}<span>g</span></div>
          <div class="prog" style="margin-top:6px"><i style="width:${pctF * 100}%;background:linear-gradient(90deg,#f7ff8a,#a3b800)"></i></div></div>
      </div>

      <div class="goal-arc">目标 <b>${t.kcal.toLocaleString()}</b> kcal · TDEE ${t.tdee} · BMR ${t.bmr}</div>
    </div>

    ${d.meals.length ? `
      <div class="sec-title"><span class="dot"></span>今日记录<span class="more" data-act="addMeal">+ 添加</span></div>
      <div class="list">
        ${slots.map(sl => {
          const items = d.meals.filter(m => m.slot === sl);
          if (!items.length) return '';
          const sum = items.reduce((a, m) => a + m.kcal, 0);
          return `<div class="card" style="padding:12px 14px">
            <div style="display:flex;align-items:center;margin-bottom:8px">
              <span style="font-size:13px;font-weight:800">${sl}</span>
              <span class="tiny muted" style="margin-left:auto">${sum} kcal</span>
            </div>
            ${items.map(m => `
              <div class="row" style="background:transparent;border:0;padding:8px 0" data-meal="${m.id}">
                <div class="mid"><div class="t" style="font-size:13.5px">${esc(m.name)}</div>
                  <div class="s">${m.grams}g · 蛋白 ${m.p}g · 碳水 ${m.c}g · 脂肪 ${m.f}g</div></div>
                <div class="r"><div class="n">${m.kcal}</div><div class="u">kcal</div></div>
                <button class="icon-btn" style="width:26px;height:26px;background:transparent;color:var(--t4)" data-del="${m.id}">${ICON.trash}</button>
              </div>`).join('')}
          </div>`;
        }).join('')}
      </div>` : `
      <div class="card" style="margin-top:14px">
        <div class="empty">
          ${ICON.bowl}
          <div>今天还没有记录饮食</div>
          <button class="btn sm" style="margin-top:14px;max-width:180px" data-act="addMeal">记录第一餐</button>
        </div>
      </div>`}
    `;
  }

  function trainHero(vol, sets, d) {
    const t = S.calcTargets();
    const cnt = d.workouts.length;
    return `
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-kcal"><b class="num">${vol.toLocaleString()}</b><i>kg 容量</i></div>
          <div class="hero-sub">${cnt} 次训练 · ${sets} 组有效组</div>
        </div>
        <div class="hero-btns">
          <button class="round-btn" data-act="addWorkout" title="开始训练">${ICON.dumbbell}</button>
        </div>
      </div>
      <div class="bar-wrap">
        <div class="bar"><div class="bar-fill" style="width:${Math.min(100, vol / 250)}%"></div></div>
        <div class="bar-pct">${cnt}</div>
      </div>
      <div class="goal-arc">建议每周 3-5 练 · 目标 ${t.kcal} kcal 摄入</div>
    </div>

    ${d.workouts.length ? `
      <div class="sec-title"><span class="dot"></span>今日训练<span class="more" data-act="addWorkout">+ 新增</span></div>
      ${d.workouts.map(w => `
        <div class="card" style="margin-bottom:11px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="flex:1">
              <div style="font-size:15px;font-weight:800">${esc(w.name)}</div>
              <div class="tiny muted" style="margin-top:4px">${w.dur} 分钟 · ${S.workoutVolume(w).toLocaleString()} kg · ${S.workoutSets(w)} 组</div>
            </div>
            <button class="icon-btn" data-workout="${w.id}">${ICON.arrow}</button>
          </div>
          <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">
            ${w.exercises.map(ex => `<span class="tag">${esc(ex.name)} ${ex.sets.length}×</span>`).join('')}
          </div>
        </div>`).join('')}` : `
      <div class="card" style="margin-top:14px">
        <div class="empty">${ICON.dumbbell}
          <div>今天还没有训练记录</div>
          <button class="btn sm" style="margin-top:14px;max-width:180px" data-act="addWorkout">开始训练</button>
        </div>
      </div>`}
    `;
  }

  function weekKcal() {
    const out = [];
    for (let i = 6; i >= 0; i--) out.push(S.dayTotals(S.dayOffset(S.todayKey(), -i)).kcal);
    return out;
  }
  function weekLabels() {
    const out = [];
    const names = ['日', '一', '二', '三', '四', '五', '六'];
    for (let i = 6; i >= 0; i--) {
      const k = S.dayOffset(S.todayKey(), -i);
      out.push(names[new Date(k + 'T00:00:00').getDay()]);
    }
    return out;
  }
  function weekSleep() {
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const d = S.state.days[S.dayOffset(S.todayKey(), -i)];
      out.push(d && d.sleep ? d.sleep : 0);
    }
    return out;
  }

  /* ==========================================================
     饮食
     ========================================================== */
  V.diet = function () {
    const k = S.todayKey();
    const t = S.calcTargets();
    const tot = S.dayTotals(k);
    const d = S.day(k);
    const slots = ['早餐', '午餐', '晚餐', '加餐'];

    return `
    <div class="sec-title" style="margin-top:8px"><span class="dot"></span>营养摄入</div>
    <div class="card glow">
      <div style="display:flex;align-items:center;gap:16px">
        ${C.ring({
          size: 112, stroke: 11, gap: 6,
          segments: [
            { value: Math.max(.001, t.carb - tot.c), color: 'rgba(61,220,132,.22)' },
            { value: Math.max(.001, tot.c), color: 'var(--green)' },
            { value: Math.max(.001, tot.p), color: 'var(--purple)' },
            { value: Math.max(.001, tot.f), color: 'var(--yellow)' },
          ],
          center: String(tot.kcal), sub: '已摄入',
        })}
        <div style="flex:1">
          <div style="font-size:13px;color:var(--t3);font-weight:700">今日剩余</div>
          <div style="font-size:32px;font-weight:800;letter-spacing:-1.4px;line-height:1.15">${Math.max(0, t.kcal - tot.kcal)}<span style="font-size:13px;color:var(--t3);font-weight:600"> kcal</span></div>
          <div class="tiny muted" style="margin-top:6px">目标 ${t.kcal} · 已摄入 ${tot.kcal}</div>
        </div>
      </div>

      <div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
        ${macroBar('蛋白质', tot.p, t.protein, 'var(--purple)', '#7c3aed')}
        ${macroBar('碳水', tot.c, t.carb, 'var(--green)', '#16a34a')}
        ${macroBar('脂肪', tot.f, t.fat, 'var(--yellow)', '#a3b800')}
      </div>
    </div>

    <div class="sec-title"><span class="dot"></span>今日饮食<span class="more" data-act="addMeal">+ 添加</span></div>

    ${slots.map(sl => {
      const items = d.meals.filter(m => m.slot === sl);
      const sum = items.reduce((a, m) => a + m.kcal, 0);
      return `<div class="card" style="margin-bottom:11px;padding:14px">
        <div style="display:flex;align-items:center;margin-bottom:${items.length ? 8 : 0}px">
          <div style="font-size:14px;font-weight:800">${sl}</div>
          <div class="tiny muted" style="margin-left:8px">${items.length ? sum + ' kcal' : '未记录'}</div>
          <button class="icon-btn" style="margin-left:auto;width:28px;height:28px" data-addslot="${sl}">${ICON.plus}</button>
        </div>
        ${items.map(m => `
          <div class="row" style="background:transparent;border:0;padding:8px 0">
            <div class="mid"><div class="t" style="font-size:13.5px">${esc(m.name)}</div>
              <div class="s">${m.grams}g · P${m.p} C${m.c} F${m.f}</div></div>
            <div class="r"><div class="n">${m.kcal}</div><div class="u">kcal</div></div>
            <button class="icon-btn" style="width:26px;height:26px;background:transparent;color:var(--t4)" data-del="${m.id}">${ICON.trash}</button>
          </div>`).join('')}
      </div>`;
    }).join('')}

    <div class="sec-title"><span class="dot"></span>快捷添加</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      ${['鸡胸肉', '鸡蛋', '米饭', '牛奶', '燕麦片', '西兰花', '香蕉', '乳清蛋白粉'].map(n => {
        const f = D.FOODS.find(x => x.name === n);
        return f ? `<button class="tag" data-quick="${f.id}" style="padding:9px 14px;font-size:12.5px">${n} · ${f.serving}g</button>` : '';
      }).join('')}
    </div>

    <div style="height:8px"></div>`;
  };

  function macroBar(name, cur, goal, c1, c2) {
    const pct = Math.min(1, cur / (goal || 1));
    return `<div>
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:5px">
        <span style="color:var(--t2)">${name}</span>
        <span><b style="font-size:13px">${Math.round(cur)}</b><span class="muted" style="font-weight:600"> / ${goal}g</span></span>
      </div>
      <div class="prog"><i style="width:${pct * 100}%;background:linear-gradient(90deg,${c1},${c2})"></i></div>
    </div>`;
  }

  /* ==========================================================
     训练
     ========================================================== */
  V.train = function () {
    const k = S.todayKey();
    const d = S.day(k);
    const musc = S.muscleVolume(7);
    const totalVol = Object.values(S.state.days).reduce((a, dd) =>
      a + (dd.workouts || []).reduce((b, w) => b + S.workoutVolume(w), 0), 0);

    const prs = Object.keys(S.state.prs).map(id => {
      const ex = D.EXERCISES.find(e => e.id === id);
      return ex ? { ex, pr: S.state.prs[id] } : null;
    }).filter(Boolean).sort((a, b) => b.pr.e1rm - a.pr.e1rm);

    return `
    <div class="sec-title" style="margin-top:8px"><span class="dot"></span>训练概览</div>
    <div class="card glow">
      <div style="display:flex;gap:14px;align-items:center">
        <div style="flex:1">
          <div class="tiny muted" style="font-weight:700">累计容量</div>

        </div>
        <div style="text-align:center">

    <div class="sec-title"><span class="dot"></span>肌群分布<span class="more">近 7 天</span></div>
    <div class="card">
      <div class="muscle-wrap">
        <div style="text-align:center">${C.bodyMap({ data: musc, w: 118, h: 184, mode: 'front' })}
          <div class="tiny muted" style="margin-top:4px">正面</div></div>
        <div style="text-align:center">${C.bodyMap({ data: musc, w: 118, h: 184, mode: 'back' })}
          <div class="tiny muted" style="margin-top:4px">背面</div></div>
      </div>
      <div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:7px 14px">
        ${Object.entries(D.MUSCLES).filter(([mk]) => musc[mk]).sort((a, b) => musc[b[0]] - musc[a[0]]).slice(0, 8).map(([mk, m]) => `
          <div style="display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700">
            <i style="width:7px;height:7px;border-radius:50%;background:${m.color};flex:0 0 auto"></i>
            <span style="color:var(--t2)">${m.name}</span>
            <span style="margin-left:auto;color:var(--t3);font-weight:600">${Math.round(musc[mk] / 100) / 10}t</span>
          </div>`).join('')}
      </div>
    </div>

    <div class="sec-title"><span class="dot"></span>今日训练<span class="more" data-act="addWorkout">+ 新增</span></div>
    ${d.workouts.length ? d.workouts.map(w => `
      <div class="card" style="margin-bottom:11px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="flex:1">
            <div style="font-size:15px;font-weight:800">${esc(w.name)}</div>
            <div class="tiny muted" style="margin-top:4px">${w.dur} 分钟 · ${S.workoutVolume(w).toLocaleString()} kg · ${S.workoutSets(w)} 组</div>
          </div>
          <button class="icon-btn" data-workout="${w.id}">${ICON.arrow}</button>
        </div>

  /* ==========================================================

  V.body = function () {

    const t = S.calcTargets();
    const ws = S.weightSeries(30);
    const filled = ws.filter(x => x.w != null);

          <div class="tiny" style="margin-top:5px;font-weight:700;color:${change <= 0 ? 'var(--green)' : 'var(--orange)'}">
            ${change <= 0 ? '↓' : '↑'} ${Math.abs(change)} kg / 30天
          </div>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div class="tiny muted" style="font-weight:700">目标</div>

      </div>
      ${C.line({ w: 300, h: 96, points: ws, minPad: .6 })}
      <div class="prog" style="margin-top:12px"><i style="width:${pctGoal * 100}%"></i></div>

    </div>

    <div class="grid2" style="margin-top:11px">

        <div class="big">${t.bmr}<span>kcal</span></div><div class="foot">Mifflin-St Jeor</div></div>
      <div class="mini"><div class="h"><span>每日消耗</span></div>

      <div class="mini"><div class="h"><span>日均摄入</span></div>
        <div class="big">${avgKcal}<span>kcal</span></div><div class="foot">近 7 天平均</div></div>
      <div class="mini"><div class="h"><span>目标速率</span></div>
        <div class="big">${p.goalRate > 0 ? '+' : ''}${p.goalRate}<span>kg/周</span></div><div class="foot">日缺口 ${Math.abs(t.delta)} kcal</div></div>
    </div>

    <div class="sec-title"><span class="dot"></span>周摄入<span class="more">近 7 天</span></div>
    <div class="card">

    <div class="sec-title"><span class="dot"></span>成就<span class="more">${S.state.achievements.length}/${D.ACHIEVEMENTS.length}</span></div>

/* ===== app.js ===== */
/* ============================================================
   Norg · 应用控制器
   路由 / 事件委托 / 各类弹层流程
   ============================================================ */
(function (global) {
  'use strict';

  const S = global.NorgStore;
  const C = global.NorgChart;
  const U = global.NorgUI;
  const D = global.NORG_DATA;
  const VW = global.NorgViews;
  const V = VW.V;
  const esc = U.esc, ICON = U.ICON;
  const $ = U.$, $$ = U.$$;

  /* ==========================================================
     渲染
     ========================================================== */
  function render() {
    const tab = VW.tab;
    const el = $('#view');
    el.innerHTML = V[tab] ? V[tab]() : '';
    el.scrollTop = 0;
    window.scrollTo(0, 0);
    $$('.tab').forEach(b => b.classList.toggle('is-active', b.dataset.tab === tab));
    $('#streakNum').textContent = S.state.streak || 0;
    // FAB
    const old = $('#fab');
    if (old) old.remove();
    if (tab === 'diet' || tab === 'train') {
      const f = document.createElement('button');
      f.id = 'fab';
      f.className = 'fab';
      f.innerHTML = ICON.plus;
      f.onclick = () => tab === 'diet' ? openAddMeal() : openAddWorkout();
      document.body.appendChild(f);
    }
  }

  /* ==========================================================
     事件委托
     ========================================================== */
  function bindGlobal() {
    $('#tabbar').addEventListener('click', e => {
      const b = e.target.closest('.tab');
      if (!b) return;
      VW.tab = b.dataset.tab;
      render();
    });

    $('#view').addEventListener('click', e => {
      const t = e.target;

      // 删除一餐
      const del = t.closest('[data-del]');
      if (del) {
        e.stopPropagation();
        const k = VW.viewDate || S.todayKey();
        S.removeMeal(k, del.dataset.del);
        U.toast('已删除');
        render();
        return;
      }

      // 打开某个动作
      const ex = t.closest('[data-ex]');
      if (ex) { openExercise(ex.dataset.ex); return; }

      // 打开某次训练
      const wk = t.closest('[data-workout]');
      if (wk) { openWorkoutDetail(wk.dataset.workout); return; }

      // 指定餐次添加
      const as = t.closest('[data-addslot]');
      if (as) { openAddMeal(as.dataset.addslot); return; }

      // 快捷添加
      const qk = t.closest('[data-quick]');
      if (qk) {
        const f = D.FOODS.find(x => x.id === qk.dataset.quick);
        if (f) { S.addMeal(S.todayKey(), f, f.serving); U.toast(`已添加 ${f.name} ${f.serving}g`); render(); }
        return;
      }

      // 模式切换
      const md = t.closest('[data-mode]');
      if (md) { VW.mode = md.dataset.mode; render(); return; }

      // 通用动作
      const act = t.closest('[data-act]');
      if (!act) return;
      const a = act.dataset.act;
      switch (a) {
        case 'addMeal': openAddMeal(); break;
        case 'addWorkout': openAddWorkout(); break;
        case 'editweight': openWeight(); break;
        case 'prevday': VW.viewDate = S.dayOffset(VW.viewDate || S.todayKey(), -1); render(); break;
        case 'nextday': {
          const n = S.dayOffset(VW.viewDate || S.todayKey(), 1);
          VW.viewDate = n > S.todayKey() ? S.todayKey() : n;
          render();
          break;
        }
        case 'goDiet': VW.tab = 'diet'; render(); break;
        case 'settings': openSettings(); break;
        case 'themes': openThemes(); break;
        case 'achv': openAchievements(); break;
        case 'pr': openPRs(); break;
        case 'college': U.toast('Norg 学院 · 内容持续更新中'); break;
        case 'plan': openPlan(); break;
        case 'rank': openRank(); break;
        case 'allEx': openAllExercises(); break;
        case 'export': doExport(); break;
        case 'import': doImport(); break;
        case 'reset': doReset(); break;
      }
    });

    $('#btnPro').onclick = () => U.toast('PRO 已解锁（演示版全部功能免费）');
    $('#btnStreak').onclick = () => U.toast(`已连续记录 ${S.state.streak} 天`);
    $('#sheetClose').onclick = U.closeSheet;
    $('#sheetMask').onclick = U.closeSheet;
  }

  /* ==========================================================
     记录饮食
     ========================================================== */
  let mealPick = { slot: null, food: null, grams: 100, cat: '全部', q: '' };

  function openAddMeal(slot) {
    mealPick = { slot: slot || null, food: null, grams: 100, cat: '全部', q: '' };
    U.openSheet('记录饮食', mealSheetHTML(), { after: bindMealSheet });
  }

  function mealSheetHTML() {
    const cats = ['全部', '主食', '蛋白', '乳制品', '蔬菜', '水果', '油脂', '外食', '饮品'];
    const q = mealPick.q.trim();
    let list = D.FOODS;
    if (mealPick.cat !== '全部') list = list.filter(f => f.cat === mealPick.cat);
    if (q) list = list.filter(f => (f.name + ' ' + f.alias).toLowerCase().includes(q.toLowerCase()));
    list = list.slice(0, 60);

    return `
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <div style="flex:1;position:relative">
          <span style="position:absolute;left:13px;top:14px;width:18px;height:18px;color:var(--t4)">${ICON.search}</span>
          <input class="input" id="fq" placeholder="搜索食物，如 鸡胸肉" value="${esc(mealPick.q)}" style="padding-left:38px" />
        </div>
      </div>
      <div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px">
        ${cats.map(c => `<button class="tag ${mealPick.cat === c ? 'red' : ''}" data-cat="${c}" style="white-space:nowrap">${c}</button>`).join('')}
      </div>
      <div id="flist" style="max-height:44vh;overflow-y:auto;margin:0 -4px">
        ${list.map(f => `
          <div class="row" data-food="${f.id}" style="margin:0 4px 7px">
            <div class="mid">
              <div class="t">${esc(f.name)}</div>
              <div class="s">每100g · P${f.p} C${f.c} F${f.f}</div>
            </div>
            <div class="r"><div class="n">${f.kcal}</div><div class="u">kcal</div></div>
          </div>`).join('') || `<div class="empty">没有找到相关食物</div>`}
      </div>`;
  }

  function bindMealSheet() {
    const q = $('#fq');
    if (q) {
      q.addEventListener('input', () => {
        mealPick.q = q.value;
        $('#flist').innerHTML = renderFoodList();
      });
      q.addEventListener('focus', () => setTimeout(() => q.setSelectionRange(q.value.length, q.value.length), 10));
    }
    $('#sheetBody').addEventListener('click', e => {
      const cat = e.target.closest('[data-cat]');
      if (cat) {
        mealPick.cat = cat.dataset.cat;
        U.openSheet('记录饮食', mealSheetHTML(), { after: bindMealSheet });
        return;
      }
      const fi = e.target.closest('[data-food]');
      if (fi) {
        mealPick.food = D.FOODS.find(f => f.id === fi.dataset.food);
        mealPick.grams = mealPick.food.serving;
        openGramsSheet();
      }
    });
  }

  function renderFoodList() {
    let list = D.FOODS;
    if (mealPick.cat !== '全部') list = list.filter(f => f.cat === mealPick.cat);
    if (mealPick.q.trim()) {
      const q = mealPick.q.trim().toLowerCase();
      list = list.filter(f => (f.name + ' ' + f.alias).toLowerCase().includes(q));
    }
    list = list.slice(0, 60);
    return list.map(f => `
      <div class="row" data-food="${f.id}" style="margin:0 4px 7px">
        <div class="mid"><div class="t">${esc(f.name)}</div>
          <div class="s">每100g · P${f.p} C${f.c} F${f.f}</div></div>
        <div class="r"><div class="n">${f.kcal}</div><div class="u">kcal</div></div>
      </div>`).join('') || `<div class="empty">没有找到相关食物</div>`;
  }

  function openGramsSheet() {
    const f = mealPick.food;
    const slots = ['早餐', '午餐', '晚餐', '加餐'];
    if (!mealPick.slot) mealPick.slot = S.slotOfNow ? S.slotOfNow() : '午餐';

    const html = `
      <div style="display:flex;align-items:center;gap:13px;margin-bottom:16px">
        <div class="ico" style="width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:23px;background:rgba(255,59,48,.14);border:1px solid rgba(255,59,48,.28)">🍽️</div>
        <div>
          <div style="font-size:17px;font-weight:800">${esc(f.name)}</div>
          <div class="tiny muted" style="margin-top:3px">每 100g：${f.kcal} kcal · P${f.p} C${f.c} F${f.f}</div>
        </div>
      </div>

      <div class="field">
        <label>份量（克）</label>
        <input class="input" id="gIn" type="number" inputmode="decimal" value="${mealPick.grams}" />
      </div>
      <div style="display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap">
        ${[50, 100, 150, 200, 250, 300].map(g => `<button class="tag" data-g="${g}">${g}g</button>`).join('')}
        <button class="tag red" data-g="${f.serving}">1份 ${f.serving}g</button>
      </div>

      <div class="field">
        <label>餐次</label>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          ${slots.map(s => `<button class="tag ${mealPick.slot === s ? 'red' : ''}" data-slot="${s}">${s}</button>`).join('')}
        </div>
      </div>

      <div class="card" style="margin:16px 0" id="preview">
        ${previewHTML(f, mealPick.grams)}
      </div>

      <button class="btn" id="doAdd">加入记录</button>
    `;
    U.openSheet('添加食物', html, {
      after: () => {
        const gIn = $('#gIn');
        const upd = () => {
          mealPick.grams = Number(gIn.value) || 0;
          $('#preview').innerHTML = previewHTML(f, mealPick.grams);
        };
        gIn.addEventListener('input', upd);
        $('#sheetBody').addEventListener('click', e => {
          const g = e.target.closest('[data-g]');
          if (g) { gIn.value = g.dataset.g; upd(); return; }
          const s = e.target.closest('[data-slot]');
          if (s) {
            mealPick.slot = s.dataset.slot;
            $$('[data-slot]').forEach(b => b.classList.toggle('red', b.dataset.slot === mealPick.slot));
            return;
          }
          if (e.target.closest('#doAdd')) {
            if (!mealPick.grams) { U.toast('请输入份量'); return; }
            S.addMeal(S.todayKey(), f, mealPick.grams, mealPick.slot);

            render();
          }
        });
      },
    });
  }

  function previewHTML(f, g) {
    const k = Math.round(f.kcal * g / 100);
    const p = Math.round(f.p * g / 100 * 10) / 10;
    const c = Math.round(f.c * g / 100 * 10) / 10;
    const fa = Math.round(f.f * g / 100 * 10) / 10;
    return `<div style="display:flex;align-items:center">
      <div>
        <div class="tiny muted" style="font-weight:700">本次摄入</div>

      </div>
      <div style="margin-left:auto;display:flex;gap:14px;text-align:right">
        <div><div class="tiny muted">蛋白</div><div style="font-size:15px;font-weight:800;color:var(--purple)">${p}g</div></div>
        <div><div class="tiny muted">碳水</div><div style="font-size:15px;font-weight:800;color:var(--green)">${c}g</div></div>
        <div><div class="tiny muted">脂肪</div><div style="font-size:15px;font-weight:800;color:var(--yellow)">${fa}g</div></div>
      </div>

  /* ==========================================================
     记录体重
     ========================================================== */
  function openWeight() {

    const html = `
      <div class="field">
        <label>体重（kg）</label>

      <div class="card" style="margin-bottom:16px">

  function openExercise(id) {

    let tab = 'about';

    const build = () => {
      const m = D.MUSCLES[ex.primary];
      let body = '';
      if (tab === 'about') {
        body = `
          <div class="ex-hero" style="margin-bottom:14px">${C.exerciseArt(ex)}</div>
